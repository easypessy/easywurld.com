<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img"><rect width="1080" height="1920" fill="#FBE7C5"/><rect x="60" y="190" width="960" height="1490" rx="14" fill="none" stroke="#144D3C" stroke-width="3"/><text x="90" y="285" font-family="Canva Sans, Arial, sans-serif" font-size="29" fill="#144D3C">EASYWURLD / EDUCATION</text><text x="90" y="420" font-family="Lora, Georgia, serif" font-size="55" fill="#144D3C">Quick test: ask someone new to</text><text x="90" y="505" font-family="Lora, Georgia, serif" font-size="55" fill="#144D3C">your page, “What do you think I</text><text x="90" y="590" font-family="Lora, Georgia, serif" font-size="55" fill="#144D3C">sell?”</text><text x="90" y="675" font-family="Lora, Georgia, serif" font-size="55" fill="#144D3C">If their answer surprises you,</text><text x="90" y="760" font-family="Lora, Georgia, serif" font-size="55" fill="#144D3C">write down the exact words</text><text x="90" y="845" font-family="Lora, Georgia, serif" font-size="55" fill="#144D3C">before editing.</text><text x="90" y="1560" font-family="Canva Sans, Arial, sans-serif" font-size="24" fill="#144D3C">SIMPLIFY. OPTIMIZE. GROW. / ST2</text></svg>