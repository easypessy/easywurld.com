<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>If I Were Hired Today long-hook length stress test</title><desc>Easywurld editable sample template. V1.0. No approved commercial claims or platform release.</desc><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBE7C5" stroke="none" stroke-width="1" opacity="1"/><g id="content-series" data-edit="replace text, preserve hierarchy"><text fill="#144D3C" font-family="Canva Sans,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="1.5"><tspan x="110" y="170">EASYWURLD / IF I WERE HIRED TODAY</tspan></text></g><path d="M110 203 L970 203" stroke="#144D3C" stroke-width="2" opacity="0.5" fill="none"/><g id="content-stress" data-edit="replace text, preserve hierarchy"><text fill="#144D3C" font-family="Canva Sans,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="1.5"><tspan x="110" y="270">STRESS PROOF / NOT A TEMPLATE</tspan></text></g><g id="content-stress-headline" data-edit="replace text, preserve hierarchy"><text fill="#144D3C" font-family="Lora,Georgia,serif" font-size="64" font-weight="600" letter-spacing="0"><tspan x="110" y="350">A buyer can see the</tspan><tspan x="110" y="426">product, but still</tspan><tspan x="110" y="502">cannot find the</tspan><tspan x="110" y="578">scope, availability</tspan><tspan x="110" y="654">or next step.</tspan></text></g><circle cx="300" cy="930" r="105" stroke="#144D3C" stroke-width="3" fill="none" opacity="1"/><circle cx="710" cy="930" r="105" stroke="#144D3C" stroke-width="3" fill="none" opacity="1"/><path d="M300 930 L500 810 L710 930 L530 930 L300 930 M500 810 L530 930" stroke="#144D3C" stroke-width="4" fill="none" opacity="1"/><g id="content-hypothetical" data-edit="replace text, preserve hierarchy"><text fill="#144D3C" font-family="Canva Sans,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="1.5"><tspan x="110" y="789">HYPOTHETICAL / SCOPE FIRST</tspan></text></g><p