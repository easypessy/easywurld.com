ax on your customer. Two seconds of nothing, on mobile data, so that a heading can slide in. Motion is fine when it reveals something. When it delays the one thing they came for, it is decoration you are charging them for.","cap":"If the animation is between the customer and the price, it is a cost, not a design.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Slide in","Fade up","Two seconds","For nothing"],"cap":"Motion should reveal. If it delays, delete it.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"Hot take: entrance animations on a small business website are a tax on the customer.\n\nTwo seconds of nothing, on mobile data, so a heading can slide into place. Then the price appears.\n\nMotion is good when it reveals something. When it stands between a customer and the one thing they came for, you are charging them for decoration.\n\nWhat is the most annoying website animation you have seen?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D4-05","type":"Entertain","topic":"She tapped the wrong thing twice","why":"A small failure with a big cost, which is the shape of most lost sales.","tiktok":{"fmt":"Talking head, 30s","hook":"She gave up on a shop because the page jumped.","beats":["The image loaded late","The button moved","She tapped the delivery fee","She left"],"vo":"A woman gave up on a shop because the page kept jumping. An image loaded late, pushed everything down, and she tapped the delivery fee twice. Then a pop-up opened. She closed the lot and bought from someone with an uglier site that stayed still. You do not lose customers to design. You lose them to movement.","cap":"You do not lose customers to ugly design. You lose them to movement.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["An image loaded late","The button moved","She tapped twice","She left"],"cap":"Reserve space for every image. A page that jumps is a page that loses sales.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A woman gave up on a shop because the page kept jumping.\n\nAn image loaded late and pushed everything down. She tapped the delivery fee twice by accident. A pop-up opened. She closed the whole thing and bought from a shop with an uglier website that stayed still.\n\nYou do not lose customers to ugly. You lose them to movement.\n\nHas a jumpy page ever made you give up?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D4-06","type":"Teach","topic":"Compress before you upload","why":"The single highest-return technical fix in the whole month.","tiktok":{"fmt":"Screen recording, 21s","hook":"You do not need a developer to make your site faster. You need to stop uploading 4MB photos.","beats":["One photo = one second","Resize to 1600px","Compress to under 200kb","Do it before upload"],"vo":"You do not need a developer to make your site faster. You need to stop uploading four megabyte photos. Resize to sixteen hundred pixels wide, compress to under two hundred kilobytes, and do it before you upload. Ten photos will take you twenty minutes and your page will load twice as fast.","cap":"Resize, compress, then upload. In that order, every time.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["4MB photo","= one extra second","Resize · compress · upload"],"cap":"Ten photos, twenty minutes, twice the speed. No developer needed.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"You do not need a developer to make your site load faster. You need to stop uploading 4MB photos straight from your camera.\n\nResize to about 1600 pixels wide. Compress to under 200KB. Then upload.\n\nTen photos is twenty minutes of work and it will roughly halve your load time.\n\nMost 'slow website' problems in Nigeria are three photos nobody resized.\n\nWhat is the biggest image on your site right now?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D4-07","type":"Entertain","topic":"The caption bar is eating your button","why":"A five-second fix that most sites have never done.","tiktok":{"fmt":"Screen recording, 12s","hook":"The caption bar is sitting on top of your only button.","beats":["Bottom 60 pixels are dead","Your button lives there","Move it up","Done"],"vo":"The caption bar is sitting on top of your only button. On most phones, the bottom sixty pixels are covered by a bar or a set of buttons. If your order button lives there, nobody can press it. Move it up and test again.","cap":"The bottom 60 pixels of a phone belong to the platform, not to you.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Bottom 60px","Covered","Put your button higher"],"cap":"Check where your button lands on an actual phone, not in the preview.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Small thing that costs businesses real money: the bottom 60-80 pixels of a phone screen.\n\nThat strip belongs to the browser or the platform. If your main button sits there, a stranger physically cannot press it, and you will never know because it looks fine in the preview.\n\nOpen your site on a real phone. Look at where the button lands. Move it up.\n\nFive seconds of work.","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D4-08","type":"Entertain","topic":"The last three shops you left","why":"The answers are the argument, and nobody can argue with them.","tiktok":{"fmt":"Street interview, 26s","hook":"What were the last three shops you gave up on online?","beats":["All three: too slow","Not one said too ugly","Not one said too expensive","Just: it would not load"],"vo":"What were the last three shops you gave up on online? Too slow. Would not load. Kept freezing. Three people, three answers, all the same answer. Not one of them said the site was ugly or expensive. They left because it made them wait.","cap":"Nobody on this street left because a shop was ugly. They left because it made them wait.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["Too slow","Wouldn't load","Kept freezing","Nobody said ugly"],"cap":"Speed is the only design decision every customer notices.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people on the street: what were the last three shops you gave up on online?\n\nToo slow. Would not load. Kept freezing.\n\nNot one of them said the site was ugly. Not one said it was too expensive. They left because it made them wait.\n\nAll the design choices in the world do not matter if the page takes nine seconds.\n\nWhat made you abandon a site?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D4-09","type":"Sell","topic":"The blueprint is words, not pixels","why":"Disqualifying honestly is the fastest way to be trusted.","tiktok":{"fmt":"Overhead shot, 28s","hook":"If your website is slow, do not buy the homepage blueprint.","beats":["It is a writing pack","Structure and copy","Nothing about speed","Speed is a different fix"],"vo":"If your website is slow, do not buy the homepage blueprint. It is a writing pack. It fixes the first screen: what you say, in what order, and what the button does. It does not touch loading time, hosting, or images. Buy it if strangers read your page and still cannot tell what you sell.","cap":"Writing pack, not a design pack. ₦5,000. If speed is your problem, this is not it.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["Slow site?","Wrong pack","This one is words","First screen, in order","₦5,000 · CLEAR"],"cap":"Buy it for confusion, not for speed. ₦5,000. Message CLEAR on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post","body":"If your website is slow, do not buy my homepage blueprint.\n\nIt is a writing pack. It fixes the first screen — what you say, in what order, and what the button does. It does not touch loading speed, hosting or image sizes.\n\nBuy it if strangers read your page and still cannot tell what you sell. That is a words problem, and words are cheap to fix.\n\n₦5,000. Message CLEAR on WhatsApp: 0905 069 0837.\n\nWhat does your first screen say right now?","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D4-10","type":"Entertain","topic":"Fast on 2G, in three weeks","why":"A story about scope, told with the number that ends the conversation.","tiktok":{"fmt":"Talking head, 45s","hook":"Someone asked us to make a site load in two seconds on 2G, in three weeks.","beats":["We said no to the 2G part","We said yes to two seconds on 3G","That is honest scope","They took it"],"vo":"Someone asked us to make their site load in two seconds on 2G, in three weeks. We said no to the 2G part. Two seconds on a good 3G connection is achievable and we can measure it. On 2G, nobody loads anything in two seconds, and we are not going to promise a number we cannot test. They took the version we could prove.","cap":"Say the number you can measure. Refuse the one you cannot.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["2 seconds, on 2G","No","2 seconds, on 3G","Yes, and we can prove it"],"cap":"A promise you cannot measure is not a standard. It is a delay before the argument.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone asked us to make their site load in two seconds on 2G, in three weeks.\n\nWe said no to the 2G part. Two seconds on a decent 3G connection is achievable and measurable. On 2G, nobody loads anything in two seconds, and promising it just delays the argument to delivery day.\n\nThey took the version we could prove.\n\nThe next time someone promises you a number, ask them how they will measure it.\n\nHave you ever been promised a result nobody could measure?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D4-11","type":"Teach","topic":"Test on a real phone, on data","why":"One line that invalidates every comfortable test they have done.","tiktok":{"fmt":"Kinetic type, 19s","hook":"Wifi lies to you every single time.","beats":["Your office wifi is fast","Your preview is cached","Their phone is on data","Test like they do"],"vo":"Wifi lies to you. Your office connection is faster than any customer's, and your browser has already saved the images. So the page you test is not the page they get. Turn off wifi, use mobile data, open in a private window, and count again. That is the real number.","cap":"Turn off wifi. Private window. Mobile data. Then look.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Wifi: fast","Preview: cached","Their phone: neither"],"cap":"Private window, mobile data, real phone. Any other test is fiction.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Two things lie to you when you test your own website: your wifi and your browser cache.\n\nYour office connection is faster than any customer's. Your browser has already saved the images, so the page you see is not the page they get.\n\nTurn off wifi. Use mobile data. Open a private window. Now count the seconds.\n\nThat is the real number, and it is usually about twice what you thought.\n\nWhat did yours turn out to be?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-04","day":4,"month":"Nov","year":2026,"weekday":"Wednesday","label":"Wednesday 4 Nov"},"short":"4 Nov"},{"day":5,"label":"Day 5 · Thursday","theme":"The customer who vanished","offer":"PLAYBOOK","posts":[{"id":"D5-01","type":"Entertain","topic":"340 unread messages","why":"A number every busy seller recognises with a wince.","tiktok":{"fmt":"Screen recording, 25s","hook":"This business has 340 unread messages.","beats":["That is a queue","Not a conversation","Most are one question","Answer the question once, publicly"],"vo":"This business has three hundred and forty unread messages. That is not a conversation, it is a queue to its own shop. Reading them, most are the same four questions. Put those four answers on the profile and the queue shrinks by half without you typing anything new.","cap":"340 unread messages is not popularity. It is a queue blocking your own door.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"5-slide carousel","slides":["340 unread","Most ask the same 4 things","Price · delivery · hours · how to order","Answer once, publicly","The queue halves"],"cap":"Your inbox is telling you what your profile should say.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"If you have hundreds of unread messages, that is not popularity. It is a queue blocking your own door.\n\nOpen the last fifty and count how many ask the same four things: price, delivery, opening hours, how to order.\n\nAlmost all of them do.\n\nPut those four answers on your profile and in your away message. The queue shrinks by half and nobody had to type anything new.\n\nHow many unread do you have right now? Be honest.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D5-02","type":"Entertain","topic":"Seen is the most expensive word","why":"One word does the emotional work of the whole lesson.","tiktok":{"fmt":"Kinetic type, 14s","hook":"\"Seen\" is the most expensive word in Nigerian business.","beats":["It is not a read receipt","It is a decision","They think you don't want them","Reply, even to say later"],"vo":"Seen is the most expensive word in Nigerian business. To you it means I will get to it. To them it means this business does not want my money. Even a broken reply beats a read receipt, because a read receipt is a decision you did not mean to make.","cap":"A blue tick with no reply is a no, whether you meant it or not.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Seen","Is not a read receipt","It is a decision"],"cap":"If you cannot answer now, answer with when you will.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"'Seen' is the most expensive word in Nigerian business.\n\nTo you it means 'I will get to it tonight'. To the customer it means 'this person does not want my money'.\n\nA short reply that says when you will answer beats a blue tick every time. 'I can confirm by 6pm' costs four seconds and keeps the customer.\n\nDo you reply even when you have no answer yet?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D5-03","type":"Teach","topic":"The follow-up that is not begging","why":"Removes the shame that stops people from following up at all.","tiktok":{"fmt":"Kinetic type, 22s","hook":"The second message feels like begging because it asks for something. So add something instead.","beats":["A date","A photo","A slot that is filling","Then ask"],"vo":"The second message feels like begging because most second messages only ask. So add something instead. A delivery date. A photo of the thing. A note that you only have two slots left this week, if that is true. Once the message carries information, it is no longer begging, it is a service.","cap":"Begging asks. Following up gives. Add one useful thing.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["\"Just checking in\"","= begging","Add a date","Add a photo","= a service"],"cap":"If the message carries no new information, do not send it.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Most people do not follow up because the second message feels like begging.\n\nIt feels that way because it usually only asks: 'just checking in'.\n\nAdd something. A delivery date. A photo of the finished thing. A note that you have two slots left this week, if that is actually true.\n\nOnce the message carries information, it stops being begging and starts being a service.\n\nWhat do you normally say in a second message?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D5-04","type":"Entertain","topic":"Ghosting is a system failure","why":"Takes the blame off the customer and puts it where they can fix it.","tiktok":{"fmt":"Talking head, 20s","hook":"Your customer did not ghost you. Your system did.","beats":["Nobody was assigned","After 6pm nobody answers","No date was set","So it died quietly"],"vo":"Your customer did not ghost you, your system did. Nobody was assigned to answer after six p.m. Nobody set a date when the quote went out. Nobody noticed the chat had gone quiet for three days. Ghosting feels like a rude person. It is usually an unowned gap.","cap":"Nobody owns the gap. That is the whole story.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Nobody answered after 6pm","No date was set","Nobody noticed the quiet"],"cap":"Assign the gap before you blame the customer.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"We call it ghosting, as though the customer did something to us.\n\nUsually it is a system failure. Nobody was assigned to answer after 6pm. Nobody put a date on the quote. Nobody noticed the chat had gone quiet for three days.\n\nFix the gap, not the customer.\n\nWho in your business owns the messages after hours?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D5-05","type":"Entertain","topic":"The ₦90,000 order lost to four hours","why":"A single specific number makes the abstract lesson real.","tiktok":{"fmt":"Talking head, 32s","hook":"She lost a ninety thousand naira order in four hours.","beats":["The customer messaged at 9am","She replied at 1pm","The order was placed elsewhere","Four hours, ninety thousand"],"vo":"She lost a ninety thousand naira order in four hours. The customer messaged at nine in the morning. She was in the market, saw it, thought I will answer when I sit down, and replied at one. The customer had already ordered from the next chat. It was not a price problem. It was a four hour problem.","cap":"Four hours. Ninety thousand naira. Not one word about price.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["9am: message","1pm: reply","1:05pm: already ordered","₦90,000"],"cap":"The most expensive thing in your business is not your price. It is your delay.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"She lost a ₦90,000 order in four hours.\n\nA customer messaged at 9am. She was in the market, saw it, and thought she would answer when she sat down. She replied at 1pm. The customer had already ordered from the next chat in the list.\n\nNot a price problem. Not a product problem. A four-hour problem.\n\nWhat is the longest a customer waits for you on a normal day?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D5-06","type":"Teach","topic":"The three-day callback is one sentence","why":"So small that there is no excuse not to do it.","tiktok":{"fmt":"Kinetic type, 18s","hook":"The three-day callback is one sentence long.","beats":["Not a paragraph","Not an apology","One useful question","\"Still need this for the weekend?\""],"vo":"The three-day callback is one sentence long. Not a paragraph, not an apology, not just checking in. One line that assumes nothing: still need this for the weekend? If yes, they answer. If no, they tell you. Either way you stop guessing and you stop waiting.","cap":"One line. No apology. A question with a real answer.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["\"Still need this","for the weekend?\"","That is the whole message"],"cap":"Send it on day three. Then leave them alone.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"The three-day callback is one sentence long.\n\n'Still need this for the weekend?'\n\nNot a paragraph. Not an apology for disturbing them. Not 'just checking in', which invites a polite nothing.\n\nOne line with a real question. They answer yes or no, and either way you stop waiting and guessing.\n\nWhen did you last follow up on a quote?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D5-07","type":"Entertain","topic":"'Ok' is not a yes","why":"A tiny exchange that quietly kills hundreds of sales a week.","tiktok":{"fmt":"Two-line skit, 13s","hook":"You sent the price. They said \"ok\".","beats":["That is not a yes","It is not a no","It is nothing yet","Ask what happens next"],"vo":"You sent the price. They said ok. That is not a yes, and it is not a no. It is nothing yet, and most businesses leave it there. Reply with the next step in one line: should I send the payment details. Now you find out.","cap":"\"Ok\" is a pause, not a decision. Someone has to move.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["\"Ok\"","Not a yes","Not a no","Ask for the next step"],"cap":"The next message is yours. Send one line with a next step in it.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"You send a price. The customer replies 'ok'.\n\nThat is not a yes. It is not a no. It is nothing yet, and most businesses leave it exactly there and count it as a sale that fell through.\n\nSend one line with a next step in it: 'Should I send the payment details?' Now you find out in four seconds instead of four days.\n\nWhat do you do when a customer says 'ok'?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D5-08","type":"Entertain","topic":"Why did you stop replying?","why":"The answers remove the excuse that it was about money.","tiktok":{"fmt":"Street interview, 26s","hook":"Why did you stop replying to a vendor?","beats":["I forgot","I saw it and got busy","Not one said expensive","They forgot, not rejected"],"vo":"Why did you stop replying to a vendor? I forgot, said one. I saw it at work and never came back, said another. I did not even realise I had not replied. Three answers and not one of them was about price. They did not reject you. They forgot you, which is worse, and easier to fix.","cap":"Nobody here rejected anybody. They forgot. Which is worse, and easier to fix.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["\"I forgot\"","\"I saw it at work\"","\"I didn't realise\"","Nobody said expensive"],"cap":"Silence is almost never a no. It is a busy person with 40 newer messages.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people on the street why they stopped replying to a vendor.\n\n'I forgot.' 'I saw it at work and never came back.' 'I didn't even realise I hadn't replied.'\n\nNot one of them said it was too expensive.\n\nThey did not reject you. They forgot you. Which is worse, and also much easier to fix, because a reminder costs nothing.\n\nDo you send the reminder, or wait to be remembered?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D5-09","type":"Sell","topic":"If they vanish after the price","why":"Names the exact moment the buyer recognises.","tiktok":{"fmt":"Overhead shot, 29s","hook":"If customers vanish right after the price, this is for you.","beats":["36 scripts for the awkward moments","And a tracker","No consulting included","It fixes chats you already have"],"vo":"If customers vanish right after the price, this is for you. Thirty-six scripts for the moments that cost you sales: price questions, let me think about it, delivery, payment, and silence. Plus a tracker so no follow-up is forgotten. Five thousand naira, do it yourself. No consulting, no guarantees, and it will not bring you new customers.","cap":"It fixes the customers already messaging you. ₦5,000. Message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["They asked the price","Then went quiet","36 scripts for that moment","Plus a tracker","₦5,000 · PLAYBOOK"],"cap":"No consulting. No guarantees. Just the words for the moments you keep getting wrong.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post","body":"If customers vanish right after you send the price, this is the one pack I would point you to.\n\nThirty-six scripts for the awkward moments: the price question, 'let me think about it', delivery, payment, and plain silence. Plus a tracker so no follow-up gets forgotten.\n\n₦5,000. Do it yourself.\n\nThe honest limit: no consulting, no guarantees, and it will not bring you a single new customer. It only helps with the ones already messaging you.\n\nMessage PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D5-10","type":"Entertain","topic":"No to the blast, yes to eleven messages","why":"Shows the alternative to automation without moralising.","tiktok":{"fmt":"Talking head, 46s","hook":"A client asked us to automate his follow-ups. We said no.","beats":["A blast would save time","And look like a blast","So we wrote eleven personal messages","It took forty minutes"],"vo":"A client asked us to automate his follow-ups. We said no, and it was not a principle, it was arithmetic. A broadcast to two thousand people would save him an hour and look exactly like what it was. So we wrote eleven personal messages to the eleven real enquiries and he sent them by hand. Forty minutes. Four replies the same day.","cap":"We are not against automation. We are against it being the first thing.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["\"Can we automate follow-ups?\"","No","11 real enquiries","11 typed messages"],"cap":"Automate the tenth time, not the first. By then you know what works.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"A client asked us to automate his follow-ups.\n\nWe said no, and it was not a principle, it was arithmetic. A broadcast to 2,000 contacts would save him an hour and look exactly like what it was. Most of them would ignore it.\n\nSo we wrote eleven personal messages to the eleven real enquiries and he sent them by hand. Forty minutes. Four replies the same day.\n\nAutomate the tenth time. Not the first.\n\nWould a broadcast even work on your customers?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D5-11","type":"Teach","topic":"Log every enquiry with a date","why":"The unglamorous habit behind every good sales story in this month.","tiktok":{"fmt":"Kinetic type, 21s","hook":"The most profitable thing in your business is a column of dates.","beats":["Name","What they asked","Next follow-up date","Open it every morning"],"vo":"The most profitable thing in your business is a column of dates. Every enquiry, the name, what they asked, and the date you will next speak to them. Open that sheet every morning and work the rows that are due. You will find sales you had already written off, sitting in a chat nobody reopened.","cap":"Name, what they asked, next date. Four columns and a habit.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["Name","What they asked","Date to speak again","Open it every morning","That is the system"],"cap":"Every sales story in this account comes back to one spreadsheet.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"The most profitable thing in a small business is a column of dates.\n\nName. What they asked for. The date you will speak to them next.\n\nOpen that sheet every morning and work the rows that are due today. That is the whole system.\n\nYou will find sales you had written off sitting in chats nobody reopened.\n\nDo you have this sheet, or is it all in your head?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-05","day":5,"month":"Nov","year":2026,"weekday":"Thursday","label":"Thursday 5 Nov"},"short":"5 Nov"},{"day":6,"label":"Day 6 · Friday","theme":"Nobody knows what you sell","offer":"CLEAR","posts":[{"id":"D6-01","type":"Entertain","topic":"A homepage about the founder","why":"Painfully common, and everyone can see their own version.","tiktok":{"fmt":"Screen recording, 24s","hook":"This homepage describes the founder and never says what they sell.","beats":["Three paragraphs about passion","Zero products","Zero prices","Nobody came for your passion"],"vo":"This homepage describes the founder and never says what they sell. Three paragraphs about passion, starting from a small idea, and one line about excellence. Zero products, zero prices, zero next step. Nobody came for your passion. They came to find out whether you sell the thing they need.","cap":"Nobody ever bought a business because the founder was passionate. They bought a thing.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"5-slide carousel","slides":["Para 1: passion","Para 2: the journey","Para 3: excellence","Product count: zero","Fix the order"],"cap":"Product first. Story second. That way people who are not here for the story still buy.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A lot of Lagos homepages spend three paragraphs on the founder and never say what the business sells.\n\nPassion. The journey. A small beginning. Commitment to excellence.\n\nZero products. Zero prices. Zero next step.\n\nNobody arrives at your site for your passion. They arrive to find out whether you sell the thing they need. Tell them that first. The story can come second, and more people will read it.\n\nWhat is the first thing on your homepage?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D6-02","type":"Entertain","topic":"The About page is doing the homepage's job","why":"A structural insight that reframes where the work goes.","tiktok":{"fmt":"Kinetic type, 15s","hook":"Your About page is doing the homepage's job, and neither is working.","beats":["Homepage: what you sell","About: who you are","They have swapped","Swap them back"],"vo":"Your About page is doing the homepage's job. The homepage should say what you sell and what to do next. The About page should say who you are. Instead the homepage tells your story and the About page is the only place with a product on it. Swap them back and watch enquiries move.","cap":"Homepage sells. About page explains. Most sites have them the wrong way round.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Homepage = what you sell","About = who you are","You have them backwards"],"cap":"Check yours tonight. It takes one minute.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"A structural thing most small business sites get wrong: the homepage and the About page have swapped jobs.\n\nThe homepage is busy telling your story. The About page is the only place with a product on it.\n\nIt should be the other way round. Homepage: what you sell, who for, what to do next. About page: who you are, why you started.\n\nSwap them. Same words. Different order. Different results.\n\nHave a look at yours and tell me which one has the product on it.","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D6-03","type":"Teach","topic":"The sentence a customer would say","why":"The fastest route to a headline that sounds human.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Your headline is hiding in something a customer already said to you.","beats":["Not your words","Theirs","The sentence they use to describe you","That is the headline"],"vo":"Your headline is already written. It is the sentence a customer uses to describe you to a friend. Not the words you chose, the words they used. Ask three customers: how would you describe what we do. Take the clearest answer and put it on the page. It will sound more like your business than anything you write about yourself.","cap":"Ask three customers how they describe you. Put the clearest answer on the page.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["Don't write it yourself","Ask a customer","\"How would you describe us?\"","Use their words","That is the headline"],"cap":"Your customers already wrote your headline. You just have not asked.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Your headline is probably already written. It is sitting in someone's chat history.\n\nAsk three customers: 'How would you describe what we do, to a friend?'\n\nTake the clearest answer and put it on your homepage, word for word. It will sound more like your business than anything you write about yourself, because you are too close to it.\n\nTry it this week. Three messages.\n\nWhat do you think they would say?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D6-04","type":"Entertain","topic":"'A wide range of services'","why":"Nails a phrase every Nigerian business uses and no customer believes.","tiktok":{"fmt":"Talking head, 19s","hook":"\"We offer a wide range of services\" means you are not sure.","beats":["A stranger reads it as not for me","It is a list, not a promise","Pick one","Then add the second"],"vo":"We offer a wide range of services means you are not sure what you are. A stranger reads that and hears not for me. It is a list, not a promise. Pick the one service that pays your rent, lead with it for a month, then add the second one.","cap":"\"Wide range\" is a shrug with extra words.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["\"Wide range of services\"","= not sure what you are","= not for me"],"cap":"Lead with the one that pays rent. Add the rest later.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"'We offer a wide range of services tailored to your needs.'\n\nThat sentence means the business is not sure what it is, and a stranger reads it as 'not for me'.\n\nIt is a list, not a promise.\n\nPick the one service that pays your rent. Lead with it for a month. Then add the second one once people know you for the first.\n\nWhat would you lead with if you had to choose one?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D6-05","type":"Entertain","topic":"One sentence doubled the enquiries","why":"The before and after makes the lesson impossible to dismiss.","tiktok":{"fmt":"Talking head, 31s","hook":"A man described his business in one sentence and his enquiries doubled.","beats":["He had been hiding it in paragraph four","We moved it to the top","Nothing else changed","Same site, same photos"],"vo":"A man described his business in one sentence and his enquiries doubled. The sentence already existed on his site, in paragraph four, under a photo. We moved it to the top, made it bigger, and changed nothing else. Same site, same photos, same price. It had been there the whole time, in the wrong place.","cap":"The sentence already existed. It was just in paragraph four.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["The sentence existed","It was in paragraph four","We moved it to the top","Nothing else changed"],"cap":"Most businesses do not need new words. They need the right words moved up.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A man described his business in one sentence and his enquiries doubled.\n\nThe sentence already existed. It was on his site, in paragraph four, under a photo of the team.\n\nWe moved it to the top, made it bigger, and changed nothing else. Same site, same photos, same prices.\n\nIt had been there the whole time, in the wrong place.\n\nGo and read your own paragraph four. Is that your headline?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D6-06","type":"Teach","topic":"One product, one price, one next step","why":"A starting point for businesses with nine products and no focus.","tiktok":{"fmt":"Kinetic type, 20s","hook":"If your page has nine products, pick one and hide the other eight.","beats":["For thirty days","One product, one price","One button","Then introduce the second"],"vo":"If your page has nine products, pick one and put the other eight below it. For thirty days, one product, one price, one button at the top. You are not deleting anything, you are choosing an order. The other eight are still there for people who scroll, and most of your new customers will not scroll.","cap":"You are not deleting the other eight. You are choosing what a stranger sees first.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["Nine products","Pick one","One price, one button","The rest below","Thirty days"],"cap":"Order is a decision. Most pages never make one.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"If your page has nine products, a stranger cannot pick one, so they pick none.\n\nFor thirty days, put one product at the top. One price. One button. Everything else sits below it.\n\nYou are not deleting anything. You are choosing an order, and order is the decision most pages never make.\n\nWhich one would you put at the top?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D6-07","type":"Entertain","topic":"Your name says nothing","why":"Reassurance plus a rule, which is the most saveable combination.","tiktok":{"fmt":"Kinetic type, 13s","hook":"Your business name does not say what you do. That is fine.","beats":["Most do not","The first line has to","Six words","Then it works"],"vo":"Your business name does not say what you do, and that is fine, because most do not. What has to say it is the first line under the name. Six words. Then the name works, because it is being explained by the only thing a stranger reads first.","cap":"Names are for memory. The first line is for understanding.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["The name doesn't explain","The first line must","Six words is enough"],"cap":"Nobody needs a new name. They need one line under it.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Your business name does not say what you do, and that is fine — most do not.\n\nWhat has to say it is the first line underneath. Six words.\n\n'Bread, baked at 6am, Agege.' 'Ankara tailoring, ready in five days.'\n\nThen the name works, because it is being explained by the only thing a stranger actually reads.\n\nWhat is your six words?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D6-08","type":"Entertain","topic":"I read them the homepage only","why":"The failure is measured in public, which makes it undeniable.","tiktok":{"fmt":"Street interview, 30s","hook":"I read people a homepage and asked what the business sells.","beats":["Two out of ten got it right","Three guessed a different business","Five said they did not know","That is the whole audit"],"vo":"I read ten people a homepage and asked what the business sells. Two got it right. Three guessed a completely different kind of business. Five said they did not know, and one asked whether it was a school. The owner had spent money on that page and this is the result. It is not a design problem. The page never says the thing.","cap":"Ten strangers. Two correct answers. That is your conversion rate, before anyone clicks.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["10 people","2 correct","3 guessed wrong","5 did not know"],"cap":"Read your homepage to ten strangers. You will learn more than any analytics tool will tell you.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I read ten people a homepage and asked what the business sells.\n\nTwo got it right. Three guessed a completely different type of business. Five said they did not know, and one asked if it was a school.\n\nThe owner had paid money for that page.\n\nIt is not a design problem. The page never says the thing. Read yours to ten people this week — not friends, strangers — and count the correct answers.\n\nWhat do you think yours would score?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D6-09","type":"Sell","topic":"For the first screen only","why":"Scoping the pack down makes it easier to say yes to.","tiktok":{"fmt":"Overhead shot, 27s","hook":"This pack fixes one thing: the first screen.","beats":["Not your whole site","Not your logo","First screen: what, who, next","One evening"],"vo":"This pack fixes one thing, and it is the first screen. Not your whole website, not your logo, not your traffic. What you say, who it is for, and what the button does. One evening of writing, no design skills needed. If your problem is somewhere else, do not buy it.","cap":"First screen only. ₦5,000, one evening. Message CLEAR on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["One screen","What you sell","Who it is for","What to do next","₦5,000 · CLEAR"],"cap":"Not your whole site. The first screen, which is where most sales are lost.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post","body":"This pack fixes exactly one thing: the first screen of your homepage.\n\nNot your whole site. Not your logo. Not your traffic.\n\nWhat you say, who it is for, and what the button does. One evening of writing. No design skills needed.\n\n₦5,000. Message CLEAR on WhatsApp: 0905 069 0837.\n\nIf your problem is traffic, hosting or speed, this is not the pack for you, and I would rather tell you now.\n\nWhich one is actually your problem?","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D6-10","type":"Entertain","topic":"The site with no prices at all","why":"A testable claim, which is rarer and more persuasive than an opinion.","tiktok":{"fmt":"Talking head, 47s","hook":"A client wanted a website with no prices anywhere.","beats":["He was sure it looked expensive","We built one page with prices first","Then the rest as he wanted","The priced page won"],"vo":"A client wanted a website with no prices anywhere, because he was sure prices made him look cheap. So we built one extra page, with prices on it, and kept all the others clean. Three weeks in, the page with prices had four times the enquiries. He did not change his mind about how it looked. The customers did.","cap":"He did not want prices on his site. So we tested it on one page instead of arguing.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["\"No prices anywhere\"","We built one page with them","Three weeks later","That page had 4x the enquiries"],"cap":"Argue with a client and you get one unhappy client. Test it and you get an answer.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"A client wanted his new website to have no prices anywhere, because he was sure that prices made a business look cheap.\n\nInstead of arguing, we built one extra page with prices on it and left the rest of the site exactly as he wanted.\n\nThree weeks later, the priced page had roughly four times the enquiries of the rest combined.\n\nHe did not change his mind about how it looked. His customers did.\n\nWhen you disagree with a client, do you argue or do you test?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D6-11","type":"Teach","topic":"Read it out loud","why":"A free test that surfaces every problem in ninety seconds.","tiktok":{"fmt":"Kinetic type, 18s","hook":"Read your homepage out loud to someone who does not know you.","beats":["Do not explain","Just read it","Watch their face","That is the audit"],"vo":"Read your homepage out loud to someone who does not know your business. Do not explain, do not add anything, just read it. Watch their face at the point where they stop following. That is the sentence to fix, and it is almost never the one you were worried about.","cap":"Watch their face, not their words. The polite ones will lie.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Read it out loud","Do not explain","Watch the face"],"cap":"Ten people, one page. You are looking for the sentence where the face changes.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Read your homepage out loud to someone who does not know your business.\n\nDo not explain anything. Do not add context. Just read it and watch their face.\n\nThere will be a point where they stop following. That is the sentence to fix, and it is almost never the one you were worried about.\n\nPoliteness will fool you if you ask them what they think. Faces do not lie.\n\nWho could you read yours to this week?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-06","day":6,"month":"Nov","year":2026,"weekday":"Friday","label":"Friday 6 Nov"},"short":"6 Nov"},{"day":7,"label":"Day 7 · Saturday","theme":"The receipts","offer":"PLAYBOOK","posts":[{"id":"D7-01","type":"Entertain","topic":"The worst page I saw this week","why":"A running series gives people a reason to come back tomorrow.","tiktok":{"fmt":"Screen recording, 24s","hook":"The worst page I saw this week has one button, below the fold, in grey.","beats":["Grey on grey","Below the fold","No instruction","Three fixes in twenty seconds"],"vo":"The worst page I saw this week has one button, and it is grey, and it is below the fold, and it says submit. Three fixes. Put it above the fold. Make it the darkest thing on the page. Say what happens when they press it. That is a morning's work and it is probably worth more than the rest of the page combined.","cap":"One button, grey, below the fold, called 'submit'. It was doing nothing and costing everything.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"5-slide carousel","slides":["Grey button","Below the fold","Called 'submit'","Three fixes","Morning's work"],"cap":"The smallest element on the page is usually doing the most important job.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"The worst page I saw this week had one button. Grey text on a pale grey shape. Below the fold. The label was 'submit'.\n\nThree fixes: move it above the fold, make it the darkest thing on the page, and say what happens when you press it.\n\n'Submit' is not a promise. 'Send my order' is.\n\nThe smallest element on the page is usually doing the most important job.\n\nWhat does your main button say?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D7-02","type":"Entertain","topic":"Week one, the real number","why":"Public honesty about a weak week is the most credible thing an account can do.","tiktok":{"fmt":"Talking head, 26s","hook":"Week one is done. Here is the real number, including the embarrassing part.","beats":["Read it off the sheet","Say the awkward bit first","Most posts did nothing","That is normal"],"vo":"Week one is done. I am going to read the number off the sheet, not off my memory, and I am going to say the awkward part first. Most posts did nothing. A few did almost everything. If you have been posting and feeling like a failure, that is not failure, that is the shape of every account in week one.","cap":"Say the awkward number first. It is the only part anyone believes.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"Carousel, 4:5","slides":["Week one","Most posts: nothing","A few: everything","That is the shape","Read your own sheet"],"cap":"The sheet is not a report card. It is a map of where to spend next week.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Week one is done, so here is the honest version.\n\nMost of what I posted did nothing. A small number of posts did almost all of the work. The same is true of almost every account in its first week, and it is the reason I keep a sheet instead of relying on how it felt.\n\nIf you are a week into posting and it feels like a failure, it is not. It is early, and the data is thin.\n\nWhat did your first week actually do?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D7-03","type":"Teach","topic":"The three posts people saved","why":"Saves are the closest thing to a public vote of usefulness.","tiktok":{"fmt":"Kinetic type, 23s","hook":"Three posts got saved this week and the other sixty did not. Here is the difference.","beats":["Saves are not likes","A save is a plan","All three were checklists","Make more checklists"],"vo":"Three posts got saved this week and the other sixty did not. The difference was not quality, it was use. A like means that was nice. A save means I will need this on Monday. All three saved posts were checklists you could act on in under a minute. So the plan for next week writes itself.","cap":"Likes measure taste. Saves measure usefulness. Only one of them pays.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Saves, not likes","A save is a plan","Make more checklists"],"cap":"If a post cannot be used on Monday, it will not be saved.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Three posts got saved this week and about sixty did not.\n\nThe difference was not how good they were. It was whether you could use them.\n\nA like means 'that was nice'. A save means 'I will need this on Monday'. All three saved posts were short checklists you could act on immediately.\n\nSo next week has more checklists and fewer opinions.\n\nWhat have you saved recently? That tells you what you actually want.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D7-04","type":"Entertain","topic":"Most posting advice is about reach","why":"A useful distinction that reframes the whole month's work.","tiktok":{"fmt":"Talking head, 20s","hook":"Almost every post you read about posting is about reach.","beats":["Reach is not revenue","Conversations are revenue","Nobody gives you a number for that","So count your own"],"vo":"Almost every post you read about posting is about reach, because reach is easy to screenshot. Reach is not revenue. Conversations are. Nobody is going to give you that number, because it lives in your WhatsApp, not in the analytics. So count it yourself, in one column, every Friday.","cap":"Reach is a screenshot. Conversations are money.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Reach: screenshot","Conversations: money","Count your own"],"cap":"The number that pays you is the one no platform will show you.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"Almost every post about posting is about reach, because reach is easy to screenshot.\n\nReach is not revenue. Conversations are.\n\nNobody will hand you that number, because it lives in your WhatsApp, not in the analytics. So count it yourself. One column, every Friday. How many strangers messaged you this week?\n\nThat single number will change what you post faster than any view count.\n\nWhat was yours this week?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D7-05","type":"Entertain","topic":"Ask for one sentence","why":"Turns a customer's message into the only proof a new studio can legally show.","tiktok":{"fmt":"Kinetic type, 20s","hook":"You do not have a testimonial yet. Ask for one sentence instead.","beats":["Not a review","One sentence","Why did you buy","Post only that"],"vo":"You do not have testimonials yet. You have customers, so ask them one question: why did you buy. Not a long review, one sentence. Then post the sentence and nothing else. No caption explaining it, no design around it. A real sentence from one person is worth more than a page of adjectives.","cap":"Ask three customers why they bought. Post the answer, unedited.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Ask: why did you buy?","One sentence","Post only that"],"cap":"No caption needed. The sentence is the post.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"If you do not have testimonials yet, you do not need to invent any. You need one sentence.\n\nAsk three customers: 'Why did you buy?'\n\nYou will get a real, slightly awkward, very specific answer. Post that sentence and nothing else. No caption explaining it. No design around it.\n\nOne real sentence from one person beats a whole page of adjectives you wrote about yourself.\n\nWhat do you think they would say?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D7-06","type":"Teach","topic":"What I would do starting again","why":"The cheapest authority content that exists. No client, no permission.","tiktok":{"fmt":"Talking head, 27s","hook":"If I started this again, I would post one format for thirty days.","beats":["Not four","Not chasing trends","One format","Until it works or I know it cannot"],"vo":"If I started this again I would pick one format and post it for thirty days. Not four platforms with four styles, not whatever is trending. One format, thirty repeats, with the subject changing. Because the first ten will be bad, and you need to get to the tenth before you are allowed to judge whether the format works.","cap":"You are not allowed to judge a format until you have posted it ten times.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["One format","Thirty days","Changing only the subject","Ten before any judgement","Then decide"],"cap":"Novelty is expensive. Repetition is the only thing that compounds.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"If I were starting this account again, I would pick one format and post it for thirty days.\n\nNot four platforms with four styles. Not whatever is trending this week. One format, repeating, with only the subject changing.\n\nBecause the first ten attempts will be bad and you need to reach the tenth before you are allowed to judge whether the format works.\n\nWhat is the one format you would pick?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D7-07","type":"Entertain","topic":"The post that died","why":"Publishing a failure buys more trust than publishing a win.","tiktok":{"fmt":"Talking head, 18s","hook":"This post died completely. Here it is, and here is why.","beats":["Show it","No hook in the first line","Explained before it interested","That is the whole post-mortem"],"vo":"This post died. Here it is. It opens with a sentence that explains instead of interests, it has no picture until the fourth second, and it asks for nothing. Nobody watched it because nothing in the first line gave them a reason to. I am keeping it up so I remember the lesson.","cap":"Most dead posts die in the first line. Mine did too.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["This post died","Here it is","First line explained, not interested"],"cap":"Watch your own flops. They are more instructive than your winners.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"This post died completely, and I am keeping it up.\n\nIt opens with a sentence that explains rather than interests. No picture until the fourth second. Nothing to stay for and nothing asked of anyone.\n\nMost dead posts die in the first line, not the middle.\n\nLook at your own worst post this week and read only the first sentence. You will see it immediately.\n\nWhat is the worst thing you have posted?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D7-08","type":"Entertain","topic":"What do you think we do?","why":"Testing your own bio in public is the most on-brand thing this account can do.","tiktok":{"fmt":"Street interview, 29s","hook":"I read strangers our own bio and asked what we do.","beats":["Two said websites","One said social media","Four did not know","We are fixing ours today"],"vo":"I read strangers our own bio and asked what we do. Two said websites. One said social media management. Four said they did not know. We are the people who write other people's homepages, and our own bio failed the test. So we are fixing it today, in public, and I will show you the new one tomorrow.","cap":"Our own bio failed the same test we run on everyone else. Fixed today.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["2 said websites","1 said social media","4 did not know","Our own bio failed"],"cap":"Run your own test before you charge anyone for the advice.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I read strangers our own Instagram bio and asked what they thought we do.\n\nTwo said websites. One said social media management. Four said they did not know.\n\nWe write other people's homepages for a living and our own bio failed the test.\n\nSo we are rewriting it today and I will show you the new one tomorrow, whether it works or not.\n\nWhen did you last read your own bio as a stranger?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D7-09","type":"Sell","topic":"The pack people actually asked about","why":"Letting the audience choose the product removes the feeling of being sold to.","tiktok":{"fmt":"Overhead shot, 25s","hook":"The pack people asked about most this week was not the one I expected.","beats":["Not the biggest one","The chat scripts","Because that is this week's pain","Follow the questions"],"vo":"The pack people asked about most this week was not the one I expected. It was the chat pack, thirty-six scripts for the awkward moments. Not because it is the best, because it matches the problem people had this week. Five thousand naira, and
