e counter, where you have about eight seconds and a queue behind them. Type exactly that. Then delete the first two sentences, because they are always throat clearing. What is left is the copy.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Say it at the counter","Type that","Delete the throat clearing"],"cap":"Type what you would say at the counter. Delete the first two sentences. Done.","body":"At the counter you have eight seconds and a queue behind them. Write that version, then delete the welcome and the thank you for visiting, because that is all the first two sentences ever are.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Write like you talk to a customer at the counter — where you have about eight seconds and a queue behind them.\n\nType exactly that. Then delete the first two sentences, because they are always throat clearing: 'Welcome', 'Thank you for visiting', 'We are a company that...'\n\nWhat is left is the copy.\n\nTry it on your homepage tonight.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D18-07","type":"Entertain","topic":"\"Kindly\" has never sold anything","why":"A small, funny, absolutely true observation.","tiktok":{"fmt":"Kinetic type, 14s","hook":"\"Kindly\" has never sold anything. Neither has \"we are pleased to inform you\".","beats":["Nobody talks like that","Nobody buys like that","It is a costume","Take it off"],"vo":"Kindly has never sold anything, and neither has we are pleased to inform you. Nobody talks like that, so it reads as a costume, and the customer can feel the costume. Write the way you would tell a friend where to buy something, because that is the voice people trust wi  his headline. We argued, then stopped arguing and tested it: two versions, same ad, one week.\n\nThe 'disruptive' version got fewer clicks and two comments asking what it meant.\n\nWe removed it and put back the plain sentence about delivery times.\n\nHe still says 'disruptive' in meetings. The page does not.\n\nWhat word would you bet on?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D18-11","type":"Teach","topic":"Read it out loud","why":"The cheapest possible quality check, stated as a habit.","tiktok":{"fmt":"Kinetic type, 20s","hook":"Read your homepage out loud. If you stumble, they will too.","beats":["Out loud","Not in your head","Every stumble is a comma problem","Or a lie"],"vo":"Read your homepage out loud, not in your head. Every place you stumble is either a sentence that is too long or a claim you do not believe. Both of those cost you customers, and both are free to fix. Six minutes, one room, your own voice, and you will hear things you have read past forty times.","cap":"Read it out loud. Every stumble is a long sentence or a lie.","body":"Read your homepage out loud, not in your head. Every place you stumble is either a sentence that is too long or a claim you do not believe. Both cost you customers and both are free to fix. Six minutes, one room, your own voice.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Read it out loud","Not in your head","Every stumble is a problem"],"cap":"Read it out loud. Every stumble is a long sentence or a lie.","body":"Every place you stumble is either a sentence that is too long or a claim you do not believe. Both cost you customers and both are free to fix tonight.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Read your homepage out loud. Not in your head — out loud.\n\nEvery place you stumble is either a sentence that is too long or a claim you do not believe.\n\nBoth cost you customers. Both are free to fix.\n\nSix minutes, one room, your own voice, and you will hear things you have read past forty times.\n\nTry it now and tell me what you heard.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-18","day":18,"month":"Nov","year":2026,"weekday":"Wednesday","label":"Wednesday 18 Nov"},"short":"18 Nov"},{"day":19,"label":"Day 19 · Thursday","theme":"Fix this Lagos","offer":"OFFER","posts":[{"id":"D19-01","type":"Entertain","topic":"Nine things, no lead","why":"The list itself is the joke and the diagnosis.","tiktok":{"fmt":"Screen recording, 24s","hook":"This business sells nine things and leads with none of them.","beats":["Catering","Laundry","Errands","Printing","Event decor","All in one menu, none first"],"vo":"This business sells nine things: catering, laundry, errands, printing, event decor, and four more, all listed at the same size on the same screen. A stranger cannot pick one, so they pick nothing. The list is not the problem, the flatness is, because everything at the same volume is silence.","cap":"Nine services, all the same size. A stranger cannot pick one, so they pick nothing.","body":"Nine services, all listed at the same size on the same screen. A stranger cannot pick one, so they pick nothing. The list is not the problem — the flatness is. Everything at the same volume is silence.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"5-slide carousel","slides":["Catering","Laundry","Errands","Printing","…and five more"],"cap":"Everything at the same volume is silence.","body":"Nine services at identical size, on one screen, in one voice. Nobody chooses from a list that refuses to choose. One of them has to be louder than the other eight.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A business I looked at sells nine things: catering, laundry, errands, printing, event decor and four more — all at the same size, on the same screen.\n\nA stranger cannot pick one, so they pick nothing.\n\nThe list is not the problem. The flatness is. Everything at the same volume is silence.\n\nWhat is the one thing you would want a stranger to remember?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D19-02","type":"Entertain","topic":"\"We do everything\"","why":"A line people repeat after hearing it once.","tiktok":{"fmt":"Kinetic type, 16s","hook":"\"We do everything\" means \"we are not first at anything\".","beats":["Everything is a category","Not an offer","Nobody searches for everything","They search for one thing"],"vo":"We do everything means we are not first at anything, and customers do not search for everything. They search for a thing, on a day, near them, at a price. Being one of nine is being none of the nine, and the person who is first at one of them gets the call.","cap":"Nobody searches for \"everything\". They search for one thing on one day.","body":"We do everything means we are not first at anything. Nobody searches for everything — they search for a thing, on a day, near them, at a price. Being one of nine is being none of the nine.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["\"We do everything\"","= we are first at nothing","Pick one and be first"],"cap":"One of nine is none of the nine.","body":"Every extra service you lead with divides the attention you needed for one. Being first at one thing beats being tenth at nine, and it is cheaper to advertise.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"'We do everything' means 'we are not first at anything'.\n\nNobody searches for everything. They search for a thing, on a day, near them, at a price.\n\nBeing one of nine is being none of the nine — and the person who is first at one of them gets the call.\n\nWhich one are you actually first at?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D19-03","type":"Teach","topic":"Lead with one offer for thirty days","why":"A time-boxed experiment, which is easy to agree to.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Lead with one offer for thirty days, then add the second.","beats":["One offer","Every post","Thirty days","Then you will know"],"vo":"Lead with one offer for thirty days. Same offer, every post, different angle. Not because the others are bad, but because thirty days is the shortest honest test of whether an offer can carry attention. After thirty days you will know whether to add the second one or fix the first, and you will know it from evidence instead of hope.","cap":"One offer, thirty days, then add the second. That is the whole test.","body":"One offer, same offer, thirty days, different angle. Not because the others are bad but because thirty days is the shortest honest test of whether an offer can carry attention. Then you will know what to add.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["One offer","Thirty days","Same offer, new angle","Then add the second"],"cap":"Thirty days is the shortest honest test there is.","body":"You do not need a new strategy, you need thirty days of the same offer so that the results mean something. Change the angle, not the offer.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Lead with one offer for thirty days. Same offer, every post, different angle.\n\nNot because the others are bad — because thirty days is the shortest honest test of whether an offer can carry attention.\n\nAfter that you will know whether to add the second one or fix the first.\n\nWhich offer would you choose for thirty days?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D19-04","type":"Entertain","topic":"A fear of losing the wrong customer","why":"Explains the psychology behind a common mistake.","tiktok":{"fmt":"Talking head, 20s","hook":"Broad offers are a fear of losing the wrong customer. So you lose the right one.","beats":["Keep everyone","Sound like no one","The right customer cannot see themselves","They leave first"],"vo":"Broad offers are a fear of losing the wrong customer, and the result is you lose the right one. When you try to be for everybody, nobody can see themselves in the sentence, and the person with a specific problem and money to solve it is the first to leave, because they need to be understood more than they need a bargain.","cap":"Trying to keep everyone loses the person who would have paid.","body":"Broad offers are a fear of losing the wrong customer. When nobody can see themselves in your sentence, the person with a real problem and money to solve it leaves first — because they need to be understood more than they need a bargain.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Fear: lose someone","Result: sound like no one","The paying customer leaves first"],"cap":"Being understood is worth more than being available.","body":"The customer you were afraid to lose was never going to buy. The one who would have bought needed to hear their specific problem named out loud.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"Broad offers are usually a fear of losing the wrong customer. The result is that you lose the right one.\n\nWhen nobody can see themselves in your sentence, the person with a specific problem and money to solve it leaves first — because they need to feel understood more than they need a bargain.\n\nWho are you actually for?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D19-05","type":"Entertain","topic":"The caterer who stopped doing events","why":"Narrowing looking like shrinking is a fear worth naming.","tiktok":{"fmt":"Talking head, 29s","hook":"A caterer stopped doing events and got more weddings.","beats":["She did everything","Then only weddings","Fewer enquiries","More bookings"],"vo":"A caterer removed everything except weddings from her page. Enquiries went down by about a third, and bookings went up, because the people who arrived were planning a wedding and she was obviously the wedding person. Narrowing looked like shrinking for six weeks, and then it looked like the only decision that mattered.","cap":"Fewer enquiries, more bookings. Narrowing looked like shrinking first.","body":"She took everything except weddings off her page. Enquiries fell by about a third. Bookings went up, because the people who arrived were planning weddings and she was obviously the wedding person. Narrowing looks like shrinking for about six weeks.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"4-slide carousel","slides":["Before: everything","After: weddings only","Enquiries: down a third","Bookings: up"],"cap":"The wrong enquiries are not a pipeline. They are a queue of people who will not buy.","body":"Fewer people asked her about events. More people asked her about weddings. The enquiries she lost were never going to become bookings, which is the part that took six weeks to believe.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A caterer took everything except weddings off her page.\n\nEnquiries went down by about a third. Bookings went up — because everyone who arrived was planning a wedding, and she was obviously the wedding person.\n\nNarrowing looked like shrinking for six weeks, then it looked like the only decision that mattered.\n\nWhat could you take off your page?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D19-06","type":"Teach","topic":"The 80/20 list","why":"A written exercise with a physical action attached.","tiktok":{"fmt":"Kinetic type, 23s","hook":"Write down everything you sell. Circle what actually pays. Then lead with that.","beats":["Everything you sell","Everything that pays","Two lists","Circle one"],"vo":"Write down everything you sell on the left, and everything that actually pays on the right. The right column will be shorter, and it will not match the order on your website. Circle one thing in the right column and lead with it for thirty days. That is the whole exercise, and most people have never done it because the left list is more fun.","cap":"Two lists: what you sell, and what pays. Circle one from the second.","body":"Write everything you sell, then everything that pays. The second list will be shorter and will not match your website's order. Circle one and lead with it for a month.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["List 1: what you sell","List 2: what pays","They do not match","Circle one"],"cap":"The list that pays is shorter and less interesting. Start there.","body":"Most businesses have never written the second list, because the first one is more fun and makes the business feel bigger than it is.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Write two lists tonight.\n\nLeft: everything you sell.\nRight: everything that actually pays.\n\nThe right column will be shorter, and it will not match the order on your website.\n\nCircle one thing in the right column and lead with it for thirty days.\n\nMost people have never done this, because the left list is more fun.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D19-07","type":"Entertain","topic":"Your cheapest offer is the loudest","why":"A profitability insight disguised as a design note.","tiktok":{"fmt":"Kinetic type, 17s","hook":"Your cheapest offer is the loudest thing on your page, and it is probably not paying you.","beats":["It gets the clicks","It takes the attention","It cannot pay the rent","Make it quiet"],"vo":"Your cheapest offer is the loudest thing on the page, because cheap things travel and expensive things sit still. That is fine if the cheap thing leads to the expensive one, and it is fatal if it does not, because you have rented your best real estate to the thing that cannot pay the rent.","cap":"Cheap things travel. Expensive things pay. Choose which one gets the top of the page.","body":"The cheapest thing you sell will always get the most attention, because cheap things travel. That is fine if it leads somewhere, and fatal if it does not — you have rented your best space to the thing that cannot pay rent.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Cheapest: loudest","Most attention","Least money","Fix the order"],"cap":"Attention and revenue are not the same axis.","body":"If the loudest thing on your page is also the least profitable, the page is arranged by accident rather than by intention. Reordering costs nothing.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Your cheapest offer is almost certainly the loudest thing on your page, because cheap things travel and expensive things sit still.\n\nThat is fine if the cheap thing leads to the expensive one. It is fatal if it does not, because you rented your best space to the thing that cannot pay the rent.\n\nWhat is at the top of yours?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D19-08","type":"Entertain","topic":"Nine services, repeated back","why":"The failure is total, which makes it memorable.","tiktok":{"fmt":"Street interview, 26s","hook":"I read people nine services. Not one could repeat a single one back.","beats":["Nine services","Thirty seconds","One recollection","It was catering, because she likes food"],"vo":"I read people a list of nine services and asked them to repeat one back. Not one person could, apart from one woman who remembered catering because she likes food. Nine services read aloud is noise. One service read aloud is a business, and you have about four seconds to be the second thing.","cap":"Nine services read aloud is noise. One is a business.","body":"Nine services, thirty seconds, one recolle old the sentence.","body":"Logo, colours, photos — six weeks of brand work for a business whose brand was fine and whose offer was the problem. We sold a one-page offer document instead. Cheaper for them, less for us, and the enquiries changed.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"4-slide carousel","slides":["Asked: full rebrand","Needed: one sentence","Sold: one-page offer","Enquiries changed"],"cap":"The most useful sale is sometimes the smallest one.","body":"A new logo would have made the same nine services look tidier. It would not have made anyone choose one, which was the entire problem.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone asked us to rebrand a nine-service business: logo, colours, photos, the full six weeks.\n\nWe said no. The brand was fine. The offer was the problem.\n\nWe sold them a one-page offer document instead, which cost a fifth as much and took four days.\n\nThey were annoyed for a week. Then the enquiries changed.\n\nWhen did a smaller job do more?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D19-11","type":"Teach","topic":"Write your one offer in a sentence","why":"Three fields, one breath. The day's takeaway.","tiktok":{"fmt":"Kinetic type, 21s","hook":"Write your one offer in a sentence: who, what, by when.","beats":["Who it is for","What they get","By when","One breath"],"vo":"Write your one offer in a sentence with three parts: who it is for, what they get, and by when. Small restaurants in Yaba, a one page site that works on a phone, in seven days. Who, what, by when. If you cannot fill in the by when, you do not have an offer, you have an interest.","cap":"Who · What · By when. One breath. If you cannot date it, it is not an offer.","body":"Who it is for, what they get, by when. If you cannot fill in the by-when, you do not have an offer yet — you have an interest, and interests do not sell.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["Who it is for","What they get","By when","Say it in one breath"],"cap":"No date means no offer, only an interest.","body":"A date is the part everyone leaves out, and it is the part that turns a description into something a customer can say yes to.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Write your one offer in a sentence with three parts: who it is for, what they get, and by when.\n\nExample: small restaurants in Yaba, a one-page site that works on a phone, in seven days.\n\nWho. What. By when.\n\nIf you cannot fill in the 'by when', you do not have an offer. You have an interest.\n\nWrite yours in the comments.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-19","day":19,"month":"Nov","year":2026,"weekday":"Thursday","label":"Thursday 19 Nov"},"short":"19 Nov"},{"day":20,"label":"Day 20 · Friday","theme":"Fix this Lagos","offer":"PROOF","posts":[{"id":"D20-01","type":"Entertain","topic":"\"Trusted by many\"","why":"A sentence everyone has written and nobody believes.","tiktok":{"fmt":"Screen recording, 23s","hook":"This site says trusted by many and shows nothing at all.","beats":["Trusted by many","Who","How many","Show one"],"vo":"This site says trusted by many, which is a sentence that has never persuaded anybody, because it is the same sentence a business with no customers would write. Vague trust is not weak trust, it is no trust, and it is doing damage, because it tells the reader you have nothing to show and decided to describe it instead.","cap":"\"Trusted by many\" is what a business with nothing to show writes.","body":"Trusted by many, loved by clients, quality guaranteed — sentences a business with no customers would also write. Vague trust is not weak trust. It is no trust, and it quietly tells the reader you had nothing to show.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"3-slide carousel","slides":["\"Trusted by many\"","By who?","Show one"],"cap":"If it would also be true of a business with no customers, delete it.","body":"The test is simple: could a business with zero customers write this sentence? If yes, it is decoration, and the reader knows it before you do.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A site I read this week says 'trusted by many' and shows nothing at all.\n\nThat is the sentence a business with no customers would write.\n\nVague trust is not weak trust. It is no trust — and it tells the reader you had nothing to show, so you described it instead.\n\nWhat could you show this week?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D20-02","type":"Entertain","topic":"No testimonials, not stuck","why":"Removes the excuse that blocks most new businesses.","tiktok":{"fmt":"Kinetic type, 17s","hook":"You have no testimonials and you are not stuck. You have process and photographs.","beats":["No clients yet","But you have hands","And a phone","Show the work"],"vo":"You have no testimonials and you are not stuck, because you have process and photographs. Show the fabric being cut, the dough being proved, the paint being mixed, the code being written. Process is proof when results are new, and it is more interesting than a quote from somebody nobody has heard of.","cap":"Process is proof when results are new. Photograph your hands.","body":"No clients yet does not mean no proof. Photograph the cutting, the proving, the mixing, the wiring. Process is proof when results are new, and it is more watchable than a quote.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["No testimonials yet","You have process","Show your hands"],"cap":"Show the work being done. That is a testimonial with no words.","body":"A photo of the actual process answers the question a testimonial is trying to answer: is this a real person who can do the thing?","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"You have no testimonials and you are not stuck.\n\nYou have process and photographs. The fabric being cut. The dough being proved. The paint being mixed. The wiring being finished.\n\nProcess is proof when results are new, and it is more convincing than a quote from someone nobody has heard of.\n\nWhat could you photograph tomorrow?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D20-03","type":"Teach","topic":"Show the work, not the praise","why":"A structural alternative to the testimonial section.","tiktok":{"fmt":"Kinetic type, 22s","hook":"A before and after beats a quote. Show the work, not the praise.","beats":["Before","After","Same angle","No adjectives"],"vo":"A before and after beats a quote, because a quote is a claim about you and a before and after is evidence. Same angle, same light, same corner of the room, and no adjectives anywhere. If you have not got a before photo, take one on the next job, before you touch anything, and you will have a year of proof by December.","cap":"Same angle, same light, no adjectives. That is a case study.","body":"A before and after is evidence. A quote is a claim. Take the before photo on your next job, before you touch anything, and you will have a year of proof by December.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["Before","After","Same angle","No adjectives"],"cap":"Start photographing the before. Most people only photograph the after.","body":"The before photo is the one everybody forgets, and it is the one that makes the after mean anything.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"A before and after beats a quote.\n\nA quote is a claim about you. A before and after is evidence, and it needs no adjectives at all — same angle, same light, same corner of the room.\n\nIf you have never taken a before photo, take one on the next job, before you touch anything.\n\nBy December you will have a year of proof.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D20-04","type":"Entertain","topic":"Honesty is your only proof","why":"Turns a limitation into a positioning strategy.","tiktok":{"fmt":"Talking head, 21s","hook":"Your honesty is currently your only proof. Use it instead of inventing one.","beats":["No results yet","But you can say what you will not do","Say what it costs","That is proof"],"vo":"Your honesty is currently your only proof, and it is a better one than you think. You can say what the pack will not do, what the price does not include, how long it will actually take, and who should not buy it. All four are checkable, and all four are rarer than a testimonial.","cap":"Saying what it will not do is proof. It is also rare, which makes it valuable.","body":"When you have no results, sell the things that are checkable: what it costs, what is not included, how long it takes, who should not buy it. Rarer than a testimonial, and harder to fake.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"4-slide carousel","slides":["No results yet","Say the price","Say the limit","Say who should not buy"],"cap":"Checkable beats impressive. Every time.","body":"Every limit you state is a small demonstration that you are not hiding anything, and customers read limits as competence even when they do not buy.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"When you have no results yet, your honesty is your only proof — and it is better than you think.\n\nYou can say what it will not do. What the price does not include. How long it will actually take. Who should not buy it.\n\nAll four are checkable. All four are rarer than a testimonial.\n\nWhich one are you hiding?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D20-05","type":"Entertain","topic":"A real chat beat a page of claims","why":"Permission and anonymising are part of the lesson.","tiktok":{"fmt":"Talking head, 30s","hook":"A screenshot of one real chat outsold a whole page of claims.","beats":["The page said quality","The chat said it is ₦8,000 and I can deliver Thursday","With permission","Names blocked"],"vo":"A screenshot of one real chat, with permission and the name blurred, did more than a whole page of claims about quality and service. Because the chat showed the actual thing: a price,  what is different now. Three sentences, in words, about a real job. Percentages are nice and almost nobody has them in month one.","cap":"Problem, action, what changed. No percentages needed.","body":"Three sentences about a real job: what was wrong, what you did, what is different now. The reader is looking for a shape, not a statistic.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Problem","What you did","What changed"],"cap":"A percentage is nice. A story is possible today.","body":"You can write this tonight about any finished job, even a small one, even the first one. Three sentences and a photo.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"A case study with no numbers is still a case study.\n\nWhat was the problem? What did you do? What is different now?\n\nThree sentences, in words, about a real job. That is it.\n\nReaders are looking for a shape, not a percentage. Percentages are nice and almost nobody has them in month one.\n\nWhich job would you write up?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D20-08","type":"Entertain","topic":"Seeing the work beat reviews","why":"Witnesses rank our own thesis above the obvious answer.","tiktok":{"fmt":"Street interview, 25s","hook":"I asked what would make people trust a new business. Seeing the work beat reviews.","beats":["Not the star rating","Not the follower count","Show me it being made","Then I believe you"],"vo":"I asked what would make people trust a business they had never used. Seeing the work came first, ahead of reviews, ahead of follower counts. Not the finished photo, the making of it, because a finished photo can be borrowed and a process cannot. That is the cheapest "},"facebook":{"fmt":"Text post","body":"Lagos rewards whoever answers, not whoever is best.\n\nWhich is good news if you are small. You cannot outspend the big shop, but you can reply in eleven minutes at nine at night — and almost nobody does that consistently.\n\nIt costs nothing, needs no budget, and cannot be bought by a competitor with more money.\n\nHow fast do you reply?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D21-05","type":"Entertain","topic":"A stranger fixed their listing","why":"Audience action is the only real proof of reach.","tiktok":{"fmt":"Talking head, 28s","hook":"Someone watched one of these videos and fixed their Google listing that night.","beats":["She commented","Two hours later","Photos and hours added","Then sent a screenshot"],"vo":"Someone watched the listing video, commented that hers was empty, and fixed it that night. Two hours later she sent a screenshot: photos, hours, the right number, a category. I do not know whether it brought her customers, and I am not going to pretend I do. What I know is that a video changed something real in a real business within two hours, which is rarer than a viral post.","cap":"She fixed her listing two hours after watching. That is the only proof that matters.","body":"Someone watched the listing video, fixed hers that night, and sent a screenshot: photos, hours, right number, category. I do not know if it brought customers. I know it changed something real within two hours.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"4-slide carousel","slides":["She watched","She commented","She fixed it that night","Screenshot, two hours later"],"cap":"One real action beats a thousand views you cannot verify.","body":"Reach is a number. One person changing something in their business two hours later is a result, a d who should not buy it. Nobody has to guess, and nobody has to be sold to.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Next week","Everything we sell","And who should not buy it"],"cap":"One honest selling week beats a month of hints.","body":"Hints are worse than prices. A price lets someone decide, and a decision is better for both of us than a vague hope.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Next week I am going to show you everything we sell, with prices, and who should not buy each one.\n\nThat is unusual for an account that mostly entertains people, and it is the whole point of the month: spend three weeks being useful, then say plainly what you make, once, so nobody has to guess.\n\nHints are worse than prices. A price lets someone decide.\n\nWhat would you want to see first?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-21","day":21,"month":"Nov","year":2026,"weekday":"Saturday","label":"Saturday 21 Nov"},"short":"21 Nov"},{"day":22,"label":"Day 22 · Sunday","theme":"The honest ad","offer":"BUNDLE","posts":[{"id":"D22-01","type":"Entertain","topic":"A deposit before a sentence","why":"The order of information is the whole lesson of the sell week.","tiktok":{"fmt":"Screen recording, 23s","hook":"This site wants a deposit before it tells you what it does.","beats":["Book a call","Pay a deposit","Then learn the price","Clarity should come first"],"vo":"This site opens with book a call, then pay a deposit, and somewhere after that it explains what they sell. The order is backwards. Price comes after clarity, always, because a customer who understands the offer will ask about the mone /* ---------------- state ---------------- */
var KEY_DONE = "eww_done_v2", KEY_NOTE = "eww_note_v2", KEY_DAY = "eww_day_v2",
    KEY_OPEN = "eww_open_v2", KEY_START = "eww_start_v2";
var done = {}, notes = {}, open = {}, dayIdx = 0, filter = "all", startDate = "";

var PLAT = {
  tiktok: { label: "TikTok", cls: "tt" },
  instagram: { label: "Instagram", cls: "ig" },
  facebook: { label: "Facebook", cls: "fb" },
  linkedin: { label: "LinkedIn", cls: "li" }
};
var WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
var WD_LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
var MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function load() {
  try { done = JSON.parse(localStorage.getItem(KEY_DONE) || "{}"); } catch (e) { done = {}; }
  try { notes = JSON.parse(localStorage.getItem(KEY_NOTE) || "{}"); } catch (e) { notes = {}; }
  try { open = JSON.parse(localStorage.getItem(KEY_OPEN) || "{}"); } catch (e) { open = {}; }
  try { var d = parseInt(localStorage.getItem(KEY_DAY), 10); if (!isNaN(d)) dayIdx = d; } catch (e) {}
  startDate = localStorage.getItem(KEY_START) || (DATA.meta && DATA.meta.startDate) || "2026-10-19";
  if (dayIdx < 0 || dayIdx >= DATA.days.length) dayIdx = 0;
}
function save() {
  localStorage.setItem(KEY_DONE, JSON.stringify(done));
  localStorage.setItem(KEY_NOTE, JSON.stringify(notes));
  localStorage.setItem(KEY_OPEN, JSON.stringify(open));
  localStorage.setItem(KEY_DAY, String(dayIdx));
  localStorage.setItem(KEY_START, startDate);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 1700);
}

/* ---------------- dates ---------------- */
function parseISO(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dateFor(i) { return addDays(parseISO(startDate), i); }
function dateLabel(d) { return WD_LONG[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MO[d.getMonth()] + " " + d.getFullYear(); }
function dateShort(d) { return d.getDate() + " " + MO[d.getMonth()]; }
function isoOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayIndex() {
  var t = new Date(); t.setHours(0, 0, 0, 0);
  for (var i = 0; i < DATA.days.length; i++) {
    if (dateFor(i).getTime() === t.getTime()) return i;
  }
  return -1;
}

/* ---------------- schedule ---------------- */
function slotsForDay(d) {
  var out = [], p, i, times = DATA.times;
  for (p in PLAT) {
    if (!PLAT.hasOwnProperty(p)) continue;
    var list = [];
    for (i = 0; i < d.posts.length; i++) if (d.posts[i][p]) list.push(d.posts[i]);
    list.forEach(function (post, idx) {
      var t = (times[p] && times[p][idx]) ? times[p][idx] : "";
      if (p === "linkedin" && post.liBonus) t = post.liBonus;
      out.push({ time: t, platform: p, post: post, key: post.id + ":" + p });
    });
  }
  out.sort(function (a, b) {
    return a.time < b.time ? -1 : a.time > b.time ? 1 : (a.platform < b.platform ? -1 : 1);
  });
  return out;
}
function minutes(t) { var a = t.split(":"); return (+a[0]) * 60 + (+a[1]); }
function nextUp(slots) {
  var now = new Date(), n = now.getHours() * 60 + now.getMinutes();
  for (var i = 0; i < slots.length; i++) if (!done[slots[i].key] && minutes(slots[i].time) >= n) return slots[i];
  for (var j = 0; j < slots.length; j++) if (!done[slots[j].key]) return slots[j];
  return null;
}

/* ---------------- copy ---------------- */
function copyText(text, label) {
  if (!text) { toast("Nothing to copy"); return; }
  var t = String(text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(
      function () { toast("Copied: " + label); },
      function () { fallbackCopy(t, label); }
    );
  } else fallbackCopy(t, label);
}
function fallbackCopy(t, label) {
  var ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  if (ok) { toast("Copied: " + label); }
  else {
    document.getElementById("dlgTitle").textContent = label;
    document.getElementById("dlgText").value = t;
    var d = document.getElementById("dlg");
    if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  }
}
function fullText(s) {
  var p = s.post, out = [];
  if (s.platform === "tiktok") {
    out.push(p.tiktok.hook, "---", p.tiktok.beats.join("\n"), "", "VOICEOVER:", p.tiktok.vo, "", "CAPTION:", p.tiktok.cap, p.tiktok.tags.join(" "));
  } else if (s.platform === "instagram") {
    out.push(p.instagram.slides.join("\n"), "", "CAPTION:", p.instagram.cap, p.instagram.tags.join(" "));
  } else if (s.platform === "facebook") {
    out.push(p.facebook.body);
  } else {
    out.push(p.linkedin.body);
  }
  return out.join("\n");
}
function copyPost(key) { var s = findSlot(key); if (s) copyText(fullText(s), PLAT[s.platform].label); }
function copyField(key, field) {
  var s = findSlot(key); if (!s) return;
  var p = s.post, v = "";
  if (field === "vo") v = p.tiktok.vo;
  else if (field === "cap") v = s.platform === "tiktok" ? p.tiktok.cap : p.instagram.cap;
  else if (field === "body") v = s.platform === "facebook" ? p.facebook.body : p.linkedin.body;
  else if (field === "slides") v = p.instagram.slides.join("\n\n");
  copyText(v, field);
}
function findSlot(key) {
  var slots = slotsForDay(DATA.days[dayIdx]);
  for (var i = 0; i < slots.length; i++) if (slots[i].key === key) return slots[i];
  return null;
}

/* ---------------- render: day ---------------- */
function renderToday() {
  var d = DATA.days[dayIdx], slots = slotsForDay(d), dt = dateFor(dayIdx);
  var doneCount = slots.filter(function (s) { return done[s.key]; }).length;
  document.getElementById("bar").style.width = (slots.length ? doneCount / slots.length * 100 : 0) + "%";
  document.getElementById("progTxt").textContent = doneCount + " of " + slots.length + " done";
  document.getElementById("dayTxt").textContent = dateLabel(dt);

  var h = "";
  h += '<div class="dayscroll">';
  var ti = todayIndex();
  DATA.days.forEach(function (dd, i) {
    var s = slotsForDay(dd), c = s.filter(function (x) { return done[x.key]; }).length;
    var cls = "daybtn" + (i === dayIdx ? " today" : "") + (c === s.length && s.length ? " done" : "");
    h += '<button class="' + cls + '" onclick="setDay(' + i + ')"><b>' + dateShort(dateFor(i)) + '</b>' +
      WD[(dateFor(i).getDay() + 6) % 7] + (i === ti ? ' <span class="dot"></span>' : "") +
      (c === s.length && s.length ? "<br>" + c + "/" + s.length : "") + "</button>";
  });
  h += "</div>";

  h += '<div class="chips">';
  ["all", "tiktok", "instagram", "facebook", "linkedin", "left"].forEach(function (f) {
    var nm = f === "all" ? "All " + slots.length : f === "left" ? "Not done" : PLAT[f].label;
    h += '<button class="chip' + (filter === f ? " on" : "") + '" onclick="setFilter(\'' + f + '\')">' + nm + "</button>";
  });
  h += "</div>";

  var nu = nextUp(slots);
  if (nu) {
    h += '<h2 class="sechead">Next up <small>' + nu.time + " · " + PLAT[nu.platform].label + "</small></h2>";
    h += cardHTML(nu);
  }
  h += '<h2 class="sechead">' + esc(d.theme) + " <small>" + esc(d.offer) + "</small></h2>";
  var shown = 0;
  slots.forEach(function (s) {
    if (filter !== "all" && filter !== "left" && s.platform !== filter) return;
    if (filter === "left" && done[s.key]) return;
    shown++; h += cardHTML(s);
  });
  if (!shown) h += '<p class="mini">Nothing here. Tap All to see everything for this day.</p>';
  document.getElementById("viewToday").innerHTML = h;
  bindNotes();
}

function cardHTML(s) {
  var p = s.post, isOpen = !!open[s.key], isDone = !!done[s.key];
  var h = '<div class="card' + (isOpen ? " open" : "") + (isDone ? " done" : "") + '" id="c_' + s.key.replace(/[^a-z0-9]/gi, "") + '">';
  h += '<div class="chead" onclick="toggleCard(\'' + s.key + '\')">';
  h += '<div style="min-width:0;flex:1">';
  h += '<div><span class="badge ' + PLAT[s.platform].cls + '">' + PLAT[s.platform].label + "</span> <span class=\"time\">" + s.time + (p.liOpt ? " · optional" : "") + "</span></div>";
  h += '<div class="ctitle">' + esc(p.topic) + "</div>";
  h += '<div class="ctype">' + esc(p.type) + " · post " + p.id.split("-")[1] + "</div>";
  h += "</div>";
  h += '<button class="tick' + (isDone ? " on" : "") + '" onclick="event.stopPropagation();toggleDone(\'' + s.key + '\')">' + (isDone ? "✓" : "") + "</button>";
  h += "</div>";
  if (isOpen) {
    h += '<div class="cbody">';
    h += '<div class="blk"><h4>Why this works</h4><p>' + esc(p.why) + "</p></div>";
    if (s.platform === "tiktok") {
      var t = p.tiktok;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(t.fmt) + "</p></div>";
      h += '<div class="blk"><h4>Hook (0-3s)</h4><p>' + esc(t.hook) + "</p></div>";
      h += '<div class="blk"><h4>On-screen beats</h4><ul class="beats">' + t.beats.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul></div>";
      h += '<div class="blk"><h4>Voiceover script</h4><p>' + esc(t.vo) + "</p></div>";
      h += '<div class="blk"><h4>Caption</h4><p>' + esc(t.cap) + "</p></div>";
      h += '<div class="blk"><h4>Hashtags</h4><p class="tags">' + esc(t.tags.join(" ")) + "</p></div>";
      h += '<div class="blk"><h4>Visual</h4><p>' + esc(t.asset) + "</p></div>";
    } else if (s.platform === "instagram") {
      var g = p.instagram;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(g.fmt) + "</p></div>";
      h += '<div class="blk"><h4>' + (/reel/i.test(g.fmt) ? "Script slides" : "Slide copy") + '</h4><ul class="beats">' + g.slides.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul></div>";
      h += '<div class="blk"><h4>Caption</h4><p>' + esc(g.cap) + "</p></div>";
      h += '<div class="blk"><h4>Hashtags</h4><p class="tags">' + esc(g.tags.join(" ")) + "</p></div>";
      h += '<div class="blk"><h4>Visual</h4><p>' + esc(g.asset) + "</p></div>";
    } else if (s.platform === "facebook") {
      var f = p.facebook;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(f.fmt) + "</p></div>";
      h += '<div class="blk"><h4>Post</h4><p>' + esc(f.body) + "</p></div>";
    } else {
      var l = p.linkedin;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(l.fmt) + "</p></div>";
      h += '<div class="blk"><h4>Post</h4><p>' + esc(l.body) + "</p></div>";
    }
    h += '<div class="copyrow">';
    h += '<button class="btn" onclick="copyPost(\'' + s.key + '\')">Copy all for ' + PLAT[s.platform].label + "</button>";
    if (s.platform === "tiktok") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'vo\')">Copy voiceover</button>';
    if (s.platform === "tiktok" || s.platform === "instagram") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'cap\')">Copy caption</button>';
    if (s.platform === "facebook" || s.platform === "linkedin") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'body\')">Copy post</button>';
    if (s.platform === "instagram") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'slides\')">Copy slides</button>';
    h += "</div>";
    h += '<div class="blk"><h4>Your note</h4><textarea class="note" data-note="' + s.key + '" placeholder="e.g. record this at 3pm, use the shop photo">' + esc(notes[s.key] || "") + "</textarea></div>";
    h += "</div>";
  }
  h += "</div>";
  return h;
}
function bindNotes() {
  var tas = document.querySelectorAll("textarea[data-note]");
  for (var i = 0; i < tas.length; i++) {
    tas[i].addEventListener("change", function (e) {
      notes[e.target.getAttribute("data-note")] = e.target.value;
      save(); toast("Note saved");
    });
  }
}
function toggleCard(key) {
  open[key] = !open[key]; save(); renderToday();
  setTimeout(function () {
    var el = document.getElementById("c_" + key.replace(/[^a-z0-9]/gi, ""));
    if (el) el.scrollIntoView({ block: "start" });
  }, 20);
}
function toggleDone(key) { if (done[key]) delete done[key]; else done[key] = 1; save(); renderToday(); }
function setDay(i) { dayIdx = i; save(); renderToday(); window.scrollTo(0, 0); }
function setFilter(f) { filter = f; renderToday(); }

/* ---------------- render: month ---------------- */
function renderMonth() {
  var tot = 0, td = 0, h = "";
  var daySlots = slotsForDay(DATA.days[0]).length;
  h += '<h2 class="sechead">The month <small>' + DATA.days.length + " days · " + DATA.days.length * daySlots + " posts</small></h2>";
  h += '<div class="monthgrid">';
  DATA.days.forEach(function (dd, i) {
    var s = slotsForDay(dd), c = s.filter(function (x) { return done[x.key]; }).length;
    tot += s.length; td += c;
    var dt = dateFor(i);
    var pct = s.length ? Math.round(c / s.length * 100) : 0;
    h += '<button class="mcell' + (i === dayIdx ? " on" : "") + '" onclick="setDay(' + i + ')">';
    h += '<span class="md">' + dateShort(dt) + "</span>";
    h += '<span class="mw">' + WD[(dt.getDay() + 6) % 7] + "</span>";
    h += '<span class="mbar"><i style="width:' + pct + '%"></i></span>';
    h += '<span class="mn">' + c + "/" + s.length + "</span>";
    h += "</button>";
  });
  h += "</div>";
  h += '<h2 class="sechead">Totals</h2><div class="grid2">';
  h += '<div class="tile"><b>' + td + "</b><span>posted</span></div>";
  h += '<div class="tile"><b>' + (tot - td) + "</b><span>left</span></div>";
  h += "</div>";

  h += '<h2 class="sechead">Plan start date <small>move the whole plan</small></h2>';
  h += '<div class="copyrow"><input type="date" class="datein" value="' + startDate + '" onchange="setStart(this.value)"></div>';
  h += '<p class="mini">Every day in the app and in the sheet shifts with this date. Set it to the Monday you want to start posting.</p>';

  h += '<h2 class="sechead">Backup <small>save or move your progress</small></h2>';
  h += '<div class="copyrow"><button class="btn" onclick="exportData()">Export progress (file)</button>';
  h += '<button class="btn ghost" onclick="document.getElementById(\'importFile\').click()">Import progress</button></div>';
  h += '<input type="file" id="importFile" class="hide" accept=".json" onchange="importData(this)">';
  h += '<p class="mini">Export writes a small JSON file. Save it to Google Drive so a new phone can pick up where this one stopped.</p>';
  h += '<h2 class="sechead">Reset</h2>';
  h += '<div class="copyrow"><button class="btn ghost" onclick="resetAll()">Clear all tick marks and notes</button></div>';
  document.getElementById("viewMonth").innerHTML = h;
}
function setStart(v) {
  if (!v) return;
  startDate = v; save(); renderMonth(); renderToday();
  toast("Plan now starts " + dateLabel(parseISO(v)));
}
function exportData() {
  var payload = { app: "easywurld-post-commander", v: 2, saved: new Date().toISOString(), done: done, notes: notes, day: dayIdx, start: startDate };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "easywurld-progress-" + isoOf(new Date()) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast("Exported. Save it to Drive.");
}
function importData(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var j = JSON.parse(rd.result);
      if (j.done) done = j.done;
      if (j.notes) notes = j.notes;
      if (j.start) startDate = j.start;
      save(); renderToday(); renderMonth(); toast("Progress imported");
    } catch (e) { toast("That file did not work"); }
  };
  rd.readAsText(f); inp.value = "";
}
function resetAll() {
  if (!confirm("Clear every tick mark and note on this phone?")) return;
  done = {}; notes = {}; save(); renderToday(); renderMonth(); toast("Cleared");
}

/* ---------------- nav ---------------- */
function setView(v) {
  ["Today", "Month", "Help"].forEach(function (x) {
    document.getElementById("view" + x).classList.toggle("hide", x.toLowerCase() !== v);
  });
  var bs = document.querySelectorAll("nav.tabs button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-v") === v);
  document.getElementById("hdRight").textContent =
    v === "today" ? "POST COMMANDER" : v === "month" ? "THE MONTH" : "HOW TO USE";
  if (v === "month") renderMonth();
  if (v === "help") renderHelp();
  window.scrollTo(0, 0);
}
document.addEventListener("DOMContentLoaded", function () {
  load();
  var ti = todayIndex();
  if (ti >= 0) dayIdx = ti;
  var bs = document.querySelectorAll("nav.tabs button");
  for (var i = 0; i < bs.length; i++) {
    (function (b) { b.addEventListener("click", function () { setView(b.getAttribute("data-v")); }); })(bs[i]);

});
