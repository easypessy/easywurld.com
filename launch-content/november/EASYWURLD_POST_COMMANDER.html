<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27473A">
<title>Easywurld Post Commander</title>
<style>
:root{
  --cream:#FAE7C7; --leaf:#27473A; --deep:#0A4937; --terra:#9E4E2C;
  --ink:#14170F; --paper:#FBF9F4; --line:rgba(39,71,58,.18);
  --ok:#2F6B4F; --card:#FBF9F4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:96px; overscroll-behavior-y:none;
}
.serif{font-family:Georgia,"Times New Roman",serif}
h1,h2,h3{margin:0;font-weight:700;color:var(--deep)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--deep)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{
  background:var(--leaf); color:var(--cream); padding:14px 0 12px;
  position:sticky; top:0; z-index:30; box-shadow:0 2px 0 rgba(0,0,0,.08);
}
header .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-family:Georgia,serif;font-size:19px;letter-spacing:.12em;font-weight:700}
.slogan{font-size:10px;letter-spacing:.16em;opacity:.75;margin-top:2px}
.hd-right{text-align:right;font-size:11px;opacity:.85}
.progress{height:6px;background:rgba(250,231,199,.22);border-radius:99px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--terra);width:0;transition:width .3s}
.pmeta{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;opacity:.9}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
  border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;background:none;border:0;padding:12px 4px 10px;font-size:12px;color:var(--ink);
}
nav.tabs button .ic{display:block;font-size:19px;line-height:1}
nav.tabs button.on{color:var(--deep);font-weight:700}
nav.tabs button.on .ic{color:var(--terra)}

.dayscroll{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.dayscroll::-webkit-scrollbar{display:none}
.daybtn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:7px 11px;font-size:12px;min-width:58px;text-align:center;line-height:1.25;
}
.daybtn b{display:block;font-size:13px;color:var(--deep)}
.daybtn.today{border-color:var(--terra);background:#fff}
.daybtn.done b::after{content:" ✓";color:var(--ok)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:99px;
  padding:6px 12px;font-size:12px;color:var(--deep)
}
.chip.on{background:var(--deep);color:var(--cream);border-color:var(--deep)}

h2.sechead{font-size:15px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
h2.sechead small{font:400 12px/1.3 -apple-system,system-ui,sans-serif;color:#5b6155}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin:10px 0;overflow:hidden
}
.card.done{opacity:.62}
.chead{display:flex;gap:10px;align-items:flex-start;padding:12px 13px}
.badge{
  font-size:10px;letter-spacing:.09em;padding:3px 7px;border-radius:6px;
  background:var(--leaf);color:var(--cream);white-space:nowrap;margin-top:2px
}
.badge.tt{background:#14170F}.badge.ig{background:#9E4E2C}.badge.fb{background:#1D4E89}.badge.li{background:#0A4937}
.time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#5b6155}
.ctitle{font-size:15px;font-weight:600;line-height:1.35;margin-top:3px}
.ctype{font-size:11px;color:#5b6155;margin-top:2px}
.tick{
  margin-left:auto;flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);
  width:30px;height:30px;border-radius:9px;font-size:15px;line-height:1;color:#8a9084
}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cbody{padding:0 13px 13px;border-top:1px dashed var(--line);margin-top:2px}
.blk{margin:12px 0 0}
.blk h4{
  margin:0 0 5px;font-size:11px;letter-spacing:.12em;color:var(--terra);text-transform:uppercase
}
.blk p{margin:0 0 6px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.blk ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.5}
.blk li{margin-bottom:3px}
.beats li{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.tags{font-size:13px;color:var(--deep);word-spacing:3px}
.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font:14px/1.45 inherit;
  background:#fff;resize:vertical;min-height:58px;margin-top:4px}
.copyrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.btn{
  border:1px solid var(--deep);background:var(--deep);color:var(--cream);
  border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600
}
.btn.ghost{background:transparent;color:var(--deep)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.wide{width:100%;text-align:center}
.mini{font-size:12px;color:#5b6155;margin-top:8px;line-height:1.45}
.card.open .cbody{display:block}
.hide{display:none!important}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-size:22px;color:var(--deep);font-family:Georgia,serif}
.tile span{font-size:12px;color:#5b6155}

.helplist{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.helplist li{margin-bottom:7px}
.kbd{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
dialog{border:0;border-radius:14px;padding:0;max-width:520px;width:92%;background:var(--paper)}
dialog::backdrop{background:rgba(10,73,55,.55)}
.dlg{padding:16px}
.dlg h3{font-size:16px;margin-bottom:8px}
.dlg textarea{width:100%;height:190px;border:1px solid var(--line);border-radius:10px;padding:10px;font:14px/1.5 ui-monospace,monospace;background:#fff}
#toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--deep);color:var(--cream);
  padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s
}
#toast.show{opacity:1}
footer{color:#5b6155;font-size:12px;text-align:center;padding:18px 0 4px;line-height:1.6}

.monthgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.monthgrid{grid-template-columns:repeat(3,1fr)}}
.mcell{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;
  text-align:left;display:grid;gap:3px;line-height:1.2
}
.mcell.on{border-color:var(--terra);background:#fff;box-shadow:inset 0 0 0 1px var(--terra)}
.mcell .md{font-weight:700;color:var(--deep);font-size:14px}
.mcell .mw{font-size:11px;color:#5b6155;text-transform:uppercase;letter-spacing:.08em}
.mcell .mn{font-size:11px;color:#5b6155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mbar{display:block;height:5px;border-radius:99px;background:rgba(39,71,58,.14);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.datein{
  border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;
  font:15px/1.2 inherit;color:var(--ink);min-width:170px
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:rgba(39,71,58,.08);padding:1px 5px;border-radius:5px}
.daybtn .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--terra);vertical-align:middle}

</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="row">
      <div>
        <div class="brand">EASYWURLD</div>
        <div class="slogan">SIMPLIFY. OPTIMIZE. GROW.</div>
      </div>
      <div class="hd-right" id="hdRight">POST COMMANDER</div>

    <div class="pmeta">
      <span id="progTxt">0 of 0 done</span>
      <span id="dayTxt">Day 1</span>
    </div>

</header>

<div class="wrap">
  <div id="viewToday"></div>

</div>

<nav class="tabs">
  <button data-v="today" class="on"><span class="ic">▦</span>Today</button>

    <button class="btn wide" onclick="document.getElementById('dlg').close()">Close</button>
  </div>
</dialog>

var DATA = {"meta":{"brand":"Easywurld","slogan":"Simplify. Optimize. Grow.","whatsapp":"0905 069 0837","waLink":"https://wa.me/2349050690837","site":"https://website-builder-portfolio.vercel.app","timezone":"Africa/Lagos (WAT, UTC+1)","startDate":"2026-11-01"},"times":{"tiktok":["07:00","09:15","11:30","13:45","15:00","16:30","18:00","19:00","20:00","20:45","21:30"],"instagram":["07:30","10:00","12:30","14:15","15:45","17:15","18:30","19:30","20:15","20:45","21:15"],"facebook":["08:00","10:30","12:00","13:30","15:00","16:30","18:00","19:30","20:15","21:00","21:45"],"linkedin":["08:15","12:15","16:15","17:15"]},"days":[{"day":1,"label":"Day 1 · Sunday","theme":"Everything you were told","offer":"The Clear Homepage Blueprint · CLEAR","posts":[{"id":"D1-01","type":"Entertain","topic":"This bakery's homepage says 'welcome'","why":"Recognition plus relief. They have seen this page a hundred times without being able to say what was wrong with it.","tiktok":{"fmt":"Screen recording + talking head, 26s","hook":"This bakery's whole first screen says 'Welcome to our website'.","beats":["Not ugly. Unclear","A stranger learns nothing in 4 seconds","Say what you sell, when it is ready","Then one button"],"vo":"This bakery's whole first screen says welcome to our website. Not ugly, unclear. A stranger lands, learns nothing in four seconds, and leaves. Say the thing only you can say. Bread out of the oven at 6am, Agege. Then one button: order for pickup. That is the whole page.","cap":"Not ugly. Unclear. The first screen has one job: tell a stranger what you sell and what to do next.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of a cream-toned fake bakery page, terracotta arrow on the headline."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["'Welcome to our website'","Is not a headline","It is a doormat","Say what you sell + when it is ready","Then one button"],"cap":"Most Lagos homepages open with a welcome. A stranger does not want to be welcomed. They want to know if you sell the thing they came for.\n\nWrite what you sell. Say when it is ready. Add one button.","tags":["#LagosSME","#WebDesignNigeria","#Easywurld","#SmallBusinessTips"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post, 90 words","body":"Open your homepage as if you have never seen it. Can you tell what they sell in four seconds?\n\nMost pages open with 'welcome to our website'. That is a doormat, not a headline. A stranger is standing in the doorway deciding whether to come in.\n\nTry this: name what you sell, say when it is ready, and give one button. 'Bread out of the oven at 6am, Agege. Order for pickup.'\n\nThat is the whole first screen.\n\nWhat does your first screen say right now?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D1-02","type":"Entertain","topic":"'Committed to excellence'","why":"A shared embarrassment everyone recognises in their own copy.","tiktok":{"fmt":"Kinetic type, 14s","hook":"Every Nigerian business is 'committed to excellence'. Nobody has ever felt excellence.","beats":["Excellence is not a promise","It is a Tuesday","Say the thing you do before 9am","That is the proof"],"vo":"Every Nigerian business is committed to excellence. Nobody has ever felt excellence. You cannot feel a commitment. You can feel that the order came in twenty minutes. Say the thing you actually do before nine a.m. and let that be the promise.","cap":"Excellence is a word. 'We confirm every order within 20 minutes' is a promise you can keep.","tags":["#LagosBusiness","#Relatable","#Easywurld","#SmallBusinessTips"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Committed to excellence","Said nobody's customer, ever","Say what happens, and when"],"cap":"If your About page could belong to any business in Nigeria, it is not describing your business.\n\nReplace one adjective with one promise.","tags":["#Copywriting","#LagosSME","#Easywurld"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post, 80 words","body":"'Committed to excellence since 2014.'\n\nNobody has ever felt excellence. They feel that their order was confirmed in twenty minutes, or that somebody picked up on the second ring.\n\nA promise you can check beats an adjective you cannot. Replace one line on your About page this week with something that happens on a normal Tuesday.\n\nWhat is one thing your business actually does, every single time?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D1-03","type":"Teach","topic":"The three-part price reply","why":"Relief. It gives them the exact fix for a moment they lived through this morning.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Your price reply ends with a question mark. That is where the sale dies.","beats":["Price","What it includes, one line","One question that moves forward","No question mark on the price"],"vo":"Someone asked how much. You said fifteen thousand, do you want it? That question hands the decision back to a person who was already deciding. Say the price, say what it includes in one line, then ask something that moves forward. Send your address and I will reserve one. One sentence. No question mark on the price.","cap":"Price. What it includes. One question that moves it forward. That is the whole reply.","tags":["#WhatsAppBusiness","#SmallBusinessNigeria","#Easywurld","#SalesTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["'How much?'","'₦15,000. Do you want it?'","That question is the problem","Say the price, then what happens next","₦15,000. Delivered Wednesday. Send your address."],"cap":"The question mark at the end of a price is where the chat goes quiet.\n\nSay the price. Say what happens next. Say nothing else.","tags":["#WhatsAppBusiness","#LagosSME","#Easywurld"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post, 100 words","body":"A customer asks how much. You reply '₦15,000, do you want it?' and the chat goes quiet.\n\nYou think they lost interest. They did not. You asked them a question they were not ready to answer, and gave them nothing to do next.\n\nTry this instead: '₦15,000. Delivered Wednesday. Send your address and I will reserve one.'\n\nPrice. What happens next. No question mark. That one change is worth more than most ad budgets.\n\nWhat is your standard price reply? Paste it and I will tell you what it is missing.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D1-04","type":"Entertain","topic":"Your logo is not the problem","why":"Relief from a worry they have been carrying.","tiktok":{"fmt":"Talking head, 18s","hook":"Your logo is not why nobody is buying.","beats":["It is line four on your page","Where you still say 'solutions'","Nobody can find the button","Fix that first"],"vo":"Your logo is not why nobody is buying. It is line four on your page, where you still say solutions. It is that nobody can find the button on a phone. Nobody has ever left a business because the logo was ordinary. They leave because they could not work out what to do next.","cap":"Nobody ever left a business because the logo was ordinary. They left because they could not tell what to do next.","tags":["#LagosBusiness","#HotTake","#Easywurld","#Branding"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Your logo is fine","Line four is not","'Solutions' is not a thing you sell"],"cap":"Spend the money on the words before the mark. Words are what a stranger reads at 11pm.","tags":["#Branding","#LagosSME","#Easywurld"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post, 85 words","body":"A new logo feels like progress because it is visible and it finishes in a week.\n\nMeanwhile line four of the homepage still says 'solutions', the button is invisible on a phone, and the prices are in a PDF.\n\nNobody has ever left a business because the logo was ordinary. They leave because they could not work out what to do next. Fix the reading order first. The mark can wait.\n\nIf a stranger read only your homepage, what would they think you sell?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D1-05","type":"Entertain","topic":"Forty packs a day, cracked screen","why":"Proof that speed beats polish, told as a story rather than a claim.","tiktok":{"fmt":"Talking head, 30s","hook":"She sells forty packs of jollof a day from a phone with a cracked screen.","beats":["No website","No logo","Four-minute replies","That is the whole system"],"vo":"She sells forty packs of jollof a day from a phone with a cracked screen. No website. No logo. She answers every message in about four minutes, and she knows your name by the second order. That is the whole system. We spend months on branding and she is beating us with a cracked screen and a fast reply.","cap":"The most sophisticated sales system in Lagos is a cracked screen and a four-minute reply.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["No website","No logo","Four-minute replies","Forty packs a day"],"cap":"Speed is a brand. Consistency is a brand. A cracked screen with a four-minute reply beats a beautiful site that answers tomorrow.","tags":["#LagosBusiness","#StoryTime","#Easywurld"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post, 95 words","body":"I know a woman who sells forty packs of jollof a day from a phone with a cracked screen.\n\nNo website. No logo. No 'committed to excellence'. She answers every message in about four minutes and remembers your name by the second order.\n\nWe spend months on the things you can photograph and skip the thing you cannot: how fast somebody hears back.\n\nIf you only fix one thing this month, fix the reply.\n\nHow long does a new customer wait before they hear from you?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D1-06","type":"Teach","topic":"The four-second test","why":"An action they can take in the next two minutes, on their own phone.","tiktok":{"fmt":"Screen recording, 20s","hook":"Open your website. Look away. Look back. Can you say what they sell?","beats":["Four seconds","No scrolling allowed","If you hesitate, they left","Rewrite the first line"],"vo":"Open your website. Look away for four seconds. Look back. Can you say what they sell without scrolling? If you hesitated, a stranger left. Not because the site is bad, but because the first screen is decoration. Rewrite one line today: what you sell, who for, what to do next.","cap":"Do it on your own site right now. Four seconds. No scrolling.","tags":["#WebsiteTips","#LagosSME","#Easywurld","#SmallBusinessTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["Look away for 4 seconds","Look back","Can you say what they sell?","No scrolling allowed","If you hesitated, so did they"],"cap":"The four-second test. Run it on your own homepage tonight. It is free and it is brutal.","tags":["#WebDesign","#LagosBusiness","#Easywurld"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post, 90 words","body":"Try this on your own site tonight.\n\nOpen the homepage. Look away for four seconds. Look back. Can you say what the business sells, who it is for, and what to do next, without scrolling?\n\nIf you hesitated, so did every stranger this month.\n\nIt is not a design problem. It is a first-sentence problem, and it costs one evening to fix.\n\nTell me what you sell in one sentence and I will tell you if a stranger could guess it.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D1-07","type":"Entertain","topic":"Make it pop","why":"A shared joke that lands with anyone who has ever been briefed badly.","tiktok":{"fmt":"Kinetic type, 12s","hook":"Client: make it pop. Designer: pop where?","beats":["Pop is not a direction","What should the visitor do?","Say that instead","Then it takes a day, not a month"],"vo":"Client says make it pop. Designer says pop where. Pop is not a direction. What should the visitor do when they land? Say that instead, and the job takes a day instead of a month of revisions nobody enjoys.","cap":"'Make it pop' has cost more money in this country than any other three words.","tags":["#Lagos","#Relatable","#Easywurld","#Design"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["'Make it pop'","Is not a brief","'Order for pickup by 6pm' is"],"cap":"The fastest way to end revisions: say what the visitor should do.","tags":["#DesignHumor","#LagosSME","#Easywurld"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post, 75 words","body":"'Just make it pop.'\n\nThree words that have cost Nigerian businesses more money than any other feedback. Pop is not a direction, so every designer guesses, and you pay for the guesses.\n\nTry: 'I want a stranger to press the order button.' Now it is a brief, and the job takes a day.\n\nWhat is the vaguest feedback you have ever received on your business?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D1-08","type":"Entertain","topic":"What does a website cost?","why":"Reach. It is funny, local, and every business owner has an opinion.","tiktok":{"fmt":"Street interview, 30s","hook":"I asked twelve Lagos traders what a website costs.","beats":["Nine did not know","Two said a number","One had one and hated it","Nobody knew what it should do"],"vo":"I asked twelve Lagos traders what a website costs. Nine said they did not know. Two gave me a number. One already had a website and told me it was useless, which turned out to mean nobody visited it. Not one of them told me what a website should do for them. That is the part nobody is selling.","cap":"Nobody in the market is confused about the price. They are confused about the point.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["12 traders","9 did not know","1 had one, hated it","0 knew what it was for"],"cap":"The price question is easy. The question underneath it is 'what will change?' Answer that and the price stops being a problem.","tags":["#LagosBusiness","#StreetInterview","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post, 100 words","body":"I asked twelve Lagos traders what a website costs.\n\nNine did not know. Two gave me a number. One already had a site and said it was useless, which turned out to mean nobody visited it.\n\nNot one of them told me what a website should do for them. That is the gap. The industry sells pages. Business owners are trying to buy customers, and nobody is connecting the two.\n\nIf you are thinking about a site, start with the change you want, not the page count.\n\nWhat would have to change for a website to be worth ₦150,000 to you?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D1-09","type":"Sell","topic":"Why you should not buy most of these","why":"The honesty is the ad. It earns the right to name a price.","tiktok":{"fmt":"Overhead shot of printed packs, 32s","hook":"Nine packs. ₦5,000 each. I am going to tell you not to buy most of them.","beats":["Start with the problem you had this week","Not the biggest pack","One pack, one problem","The bundle is for later"],"vo":"Nine packs, five thousand naira each, and I am telling you not to buy most of them. Pick the one that matches the problem you had this week. If that was a customer who never replied, take the chat one. If it was a website nobody understood, take the homepage one. One pack, one problem. The bundle is for people who want all nine, not for people starting.","cap":"Buy the one that matches this week's problem. Not the biggest. Not all nine.\n\n₦5,000 each. Message the keyword on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["Don't buy all nine","Buy the one for your problem","Replying too slowly? The chat pack","Site nobody understands? The homepage pack","One pack. One problem. ₦5,000"],"cap":"Every pack is ₦5,000 and every one of them is do-it-yourself. No consulting, no guarantees. If you want it done for you, that is a project, not a download.","tags":["#SmallBusinessNigeria","#LagosSME","#Easywurld"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post, 120 words","body":"I make nine resource packs. ₦5,000 each. Today I am going to talk you out of most of them.\n\nBuy the one that matches the problem you had this week. If a customer asked for a price and then vanished, that is the chat pack. If a stranger looked at your website and left, that is the homepage pack. If you are about to build a site and do not know what to decide first, that is the launch pack.\n\nOne pack. One problem. And to be honest about the limit: none of them will bring you customers. They give you the scripts and templates for the customers you already get.\n\nWhat was the actual problem this week? I will tell you which pack, or tell you you don't need one.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D1-10","type":"Entertain","topic":"The ₦180,000 we turned down","why":"Proof of character that cannot be faked, and the most shareable format we have.","tiktok":{"fmt":"Talking head, 55s","hook":"We turned down ₦180,000 last month.","beats":["A restaurant wanted a rebuild","Their site was fine","They answered DMs at 11pm","We spent the money on replies instead"],"vo":"We turned down a hundred and eighty thousand naira last month. A restaurant in Lekki wanted a full rebuild. We opened their site and it was fine. Slow, ugly, but it loaded, prices were there, the WhatsApp button worked. So we asked how many people who message you actually order. One in five, they said. Their site was not the problem. Their replies were. We told them to keep the site and spend the money on answering messages before nine a.m. Their site is still ugly. Orders went up.","cap":"We would rather tell you not to spend. It is better business, and it is the only marketing that cannot be faked.","tags":["#LagosBusiness","#Easywurld","#HonestBusiness","#SmallBusinessNigeria"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["They wanted a ₦180,000 rebuild","Their site was fine","Their replies were the problem","We said keep the site"],"cap":"A slow, ugly site that works beats a beautiful one that answers tomorrow. Tell us your problem and we will tell you honestly if you need us.","tags":["#LagosBusiness","#HonestBusiness","#Easywurld"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post, 130 words","body":"We turned down ₦180,000 last month.\n\nA restaurant in Lekki wanted a full rebuild. We opened their site. Slow, ugly, but it loaded, the prices were there, and the WhatsApp button worked. So we asked the only question that mattered: how many people who message you actually order?\n\nOne in five, they said.\n\nThe site was not the problem. The reply was. We told them to keep the site and spend the money on answering messages before 9am.\n\nTheir site is still ugly. Their orders went up.\n\nWe would rather tell you not to spend. It is better business, and it is the only marketing that cannot be faked.\n\nHave you ever paid for the wrong fix? Tell me what you bought and what the real problem turned out to be.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D1-11","type":"Teach","topic":"Follow up three times","why":"The single highest-value habit in the pack, given away free.","tiktok":{"fmt":"Kinetic type, 24s","hook":"Most sales in Nigeria happen after the third follow-up. Most businesses stop at one.","beats":["Day 1: the quote","Day 3: one useful line","Day 7: the close","Set the dates before you send"],"vo":"Most sales happen after the third follow-up. Most businesses stop at one because the second feels like begging. It is not begging if you add something. Day one, the quote. Day three, one useful line, a delivery date or a photo. Day seven, a close: should I keep this for you or release it? Set those three dates before you send the quote.","cap":"Day 1 the quote. Day 3 something useful. Day 7 the close. Three dates, set before you send.","tags":["#SalesTips","#SmallBusinessNigeria","#Easywurld","#WhatsAppBusiness"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["You sent the quote","And waited","Day 3: add something useful","Day 7: 'keep it or release it?'","Three follow-ups, not one"],"cap":"The second message is not begging if it carries something new. A date, a photo, a slot that is filling.","tags":["#SalesTips","#LagosSME","#Easywurld"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post, 105 words","body":"Most businesses send a quote and then wait. If nothing comes back, they assume the customer lost interest.\n\nUsually the customer just got busy, and the quote is now 40 messages up their chat list.\n\nThree follow-ups: day 1 the quote, day 3 something useful (a date, a photo, a slot that is filling), day 7 the close. 'Should I keep this for you or release it?'\n\nSet the three dates before you press send. It takes ten seconds and it is the cheapest thing in this post.\n\nHow many times do you follow up? Be honest.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-01","day":1,"month":"Nov","year":2026,"weekday":"Sunday","label":"Sunday 1 Nov"},"short":"1 Nov"},{"day":2,"label":"Day 2 · Monday","theme":"The chat is the shop counter","offer":"The Chat-to-Customer Playbook · PLAYBOOK","posts":[{"id":"D2-01","type":"Entertain","topic":"The WhatsApp profile that answers nothing","why":"Almost every viewer can check their own profile in ten seconds.","tiktok":{"fmt":"Screen recording, 25s","hook":"This business answers nothing before you even say hello.","beats":["No catalogue","No hours","No delivery info","Three taps to nowhere"],"vo":"This WhatsApp Business profile answers nothing before you say hello. No catalogue, no opening hours, no delivery information. So every customer has to ask the same four questions, and the owner answers them forty times a day. Set the greeting, the away message and one catalogue item. That is an afternoon, and it buys back an hour a day.","cap":"An unanswered profile is a shop with no sign. Set the greeting, the away message, one catalogue item.","tags":["#WhatsAppBusiness","#LagosBusiness","#Easywurld","#SmallBusinessTips"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"5-slide carousel","slides":["No catalogue","No hours","No delivery info","So they ask, every time","One afternoon fixes it"],"cap":"Every question you answer forty times a day is a question your profile should have answered already.","tags":["#WhatsAppBusiness","#LagosSME","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post, 95 words","body":"Check your WhatsApp Business profile as a stranger.\n\nIs there a catalogue? Opening hours? Delivery cost? Payment details?\n\nIf not, every single customer has to ask you the same four questions, and you answer them forty times a day. That is an hour of your life, every day, spent typing the same thing.\n\nSet the greeting message, the away message, and one catalogue item tonight. It is free and it is an afternoon's work.\n\nHow many times a day do you type the same answer?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D2-02","type":"Entertain","topic":"The 11pm message","why":"A nightly shared experience, framed as a business insight.","tiktok":{"fmt":"Kinetic type, 15s","hook":"The message that arrives at 11pm is the best customer you will get all week.","beats":["They are deciding right now","Nobody else is awake","An away message is a salesperson","That still answers"],"vo":"The message that arrives at eleven p.m. is your best customer of the week. They are deciding right now, and nobody else is awake. An away message that answers the four obvious questions is a salesperson who never sleeps. Set one tonight.","cap":"An away message is a salesperson who works at 11pm and never asks for a raise.","tags":["#WhatsAppBusiness","#LagosBusiness","#Easywurld","#SmallBusinessTips"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["11pm message","They are deciding now","Your away message is awake"],"cap":"Answer the four obvious questions in the away message. Price range, delivery, hours, how to order.","tags":["#WhatsAppBusiness","#LagosSME","#Easywurld"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post, 85 words","body":"The message that arrives at 11pm is often the best customer you will get all week.\n\nThey are awake, they are deciding, and nobody else in your line of business is answering.\n\nAn away message that says your price range, delivery time, opening hours and how to order is a salesperson who works all night and never asks for a raise.\n\nTen minutes to write. Free forever.\n\nDoes your away message answer anything, or just apologise?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D2-03","type":"Teach","topic":"'Let me think about it'","why":"The exact words for the hardest moment in a sales chat.","tiktok":{"fmt":"Kinetic type, 23s","hook":"'Let me think about it' is not an objection. It is a request for time you never gave.","beats":["Ask what they are weighing","Offer a smaller next step","Name the date","Then leave them alone"],"vo":"Let me think about it is not an objection. It is a request for time you never offered. So offer it. Ask what they are weighing, price or timing. Then give a smaller next step: I will hold one until Friday. Name the date, then leave them alone. The silence after a clear next step is not rejection.","cap":"'Let me think about it' usually means 'you did not give me a small enough next step'.","tags":["#SalesTips","#WhatsAppBusiness","#Easywurld","#SmallBusinessNigeria"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["'Let me think about it'","Is not a no","It is a request for time","Give a smaller next step","'I'll hold one until Friday'"],"cap":"Name a date. Then stop talking. The silence after a clear next step is not rejection.","tags":["#SalesTips","#LagosSME","#Easywurld"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post, 105 words","body":"'Let me think about it.'\n\nEvery seller hears this and treats it as a no. It is usually a request for time you never offered.\n\nOffer it. 'Of course. Are you weighing the price or the timing?' Then give a smaller next step: 'I can hold one until Friday, then I release it.'\n\nName the date. Then leave them alone. If they come back, they come back to a person who was not desperate at them.\n\nWhat do you normally reply when a customer says 'let me think about it'?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D2-04","type":"Entertain","topic":"Your website is not your shop","why":"A reframe that changes where they spend money.","tiktok":{"fmt":"Talking head, 20s","hook":"For most Lagos businesses the website is a business card. The shop is WhatsApp.","beats":["Site = proof you exist","Chat = where money happens","Most budgets go to the card","Reverse it"],"vo":"For most Lagos businesses the website is a business card and the shop is WhatsApp. The site proves you exist. The chat is where the money happens. Yet almost every naira goes to the card and almost no thought goes to the counter. Reverse that for one month and see what happens.","cap":"The site proves you exist. The chat is where the money is. Most budgets do the opposite.","tags":["#LagosBusiness","#HotTake","#WhatsAppBusiness","#Easywurld"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Website = business card","WhatsApp = shop counter","Where did your money go?"],"cap":"Spend the next month's budget on the counter instead of the card. Then tell me what happened.","tags":["#LagosSME","#WhatsAppBusiness","#Easywurld"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post, 90 words","body":"A hot take that will annoy some people: for most Lagos businesses, the website is a business card and WhatsApp is the shop.\n\nThe site proves you exist. The chat is where the money changes hands.\n\nYet almost every naira goes to the card and almost no thought goes to the counter.\n\nReverse it for one month. Fix your replies, your follow-up and your profile before you touch the website design.\n\nWhere do your actual sales happen: the site or the chat?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D2-05","type":"Entertain","topic":"The quote that was never followed up","why":"A story everyone has lived, told from the buyer's side.","tiktok":{"fmt":"Talking head, 32s","hook":"I asked a vendor for a price. He sent it and never spoke to me again.","beats":["I was going to buy","I got busy","He never followed up","Someone else did"],"vo":"I asked a vendor for a price. He sent it. Then he never spoke to me again. I was going to buy. I got busy, the message sank, and two days later I bought from someone who asked me one question on the third day. He did not lose a sale because of price. He lost it because he assumed silence meant no.","cap":"He did not lose the sale on price. He lost it on day three.","tags":["#Lagos","#StoryTime","#SalesTips","#Easywurld"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["I asked for a price","He sent it","Then never again","Someone else asked on day 3"],"cap":"Silence is not a no. It is usually a busy buyer with 40 newer messages. Follow up.","tags":["#SalesTips","#LagosBusiness","#Easywurld"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post, 110 words","body":"I asked a vendor for a price. He sent it and never spoke to me again.\n\nI was going to buy. Then work happened, the message sank down my chat list, and two days later I bought from someone else who asked me one question on the third day: 'Still need this for the weekend?'\n\nHe did not lose that sale to price. He lost it on day three.\n\nIf you send quotes, put the follow-up date in your phone the moment you send it. Not because you are desperate. Because they are busy.\n\nDo you follow up, or do you wait to be chased?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D2-06","type":"Teach","topic":"The 20-minute reply rule","why":"A single rule that is easy to adopt and changes revenue immediately.","tiktok":{"fmt":"Kinetic type, 21s","hook":"The first business to reply usually wins. Not the cheapest. The first.","beats":["Not the best price","Not the nicest logo","The first reply","Twenty minutes or less"],"vo":"The first business to reply usually wins the sale. Not the cheapest, not the one with the nicest logo. The first reply. Twenty minutes or less during work hours is the whole advantage. You do not need better copy. You need to be the one who was awake.","cap":"Not the cheapest. The first to reply. That is the advantage you already own.","tags":["#WhatsAppBusiness","#SalesTips","#LagosSME","#Easywurld"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Cheapest? no","Nicest logo? no","First to reply? yes"],"cap":"Twenty minutes during work hours. That is the whole competitive advantage and it costs nothing.","tags":["#SalesTips","#LagosBusiness","#Easywurld"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post, 85 words","body":"Customers do not compare ten vendors. They message three, and usually buy from whoever replies first while they are still interested.\n\nNot the cheapest. Not the one with the nicest logo. The first reply.\n\nTwenty minutes during work hours is the whole advantage, and you already own it.\n\nIf you cannot answer that fast, set an away message that at least tells them what happens next.\n\nWhat is your average reply time right now, honestly?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D2-07","type":"Entertain","topic":"'Check DM'","why":"The most relatable irritation in Nigerian social selling.","tiktok":{"fmt":"Kinetic type, 12s","hook":"'Check DM' is the Nigerian version of a locked shop door.","beats":["You came to buy","Now you must ask permission","Put the price in the caption","Watch what happens"],"vo":"Check DM is the Nigerian version of a locked shop door. Someone walked up ready to buy and you told them to knock. Put the price in the caption. The serious buyers will still message, and the rest stop wasting your time.","cap":"A locked door is a choice. Put the price where people can see it.","tags":["#Lagos","#Relatable","#SmallBusinessNigeria","#Easywurld"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["'Check DM'","= locked door","Put the price in the caption"],"cap":"You are not hiding the price from competitors. You are hiding it from customers.","tags":["#LagosBusiness","#Easywurld","#SocialMediaTips"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post, 80 words","body":"'Check DM.'\n\nIt is the Nigerian version of a locked shop door. Someone walked up ready to buy and you told them to knock.\n\nPut the price in the caption. The serious buyers will still message. The ones who were never going to buy stop wasting your evening.\n\nAnd you stop spending three hours a day typing the same number.\n\nDo you put your prices in captions? Why or why not?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D2-08","type":"Entertain","topic":"How long do you wait for a reply?","why":"The answers are the content. Viewers will argue in the comments.","tiktok":{"fmt":"Street interview, 28s","hook":"How long will you wait for a business to reply before you buy elsewhere?","beats":["Thirty minutes","One hour","Next day, I am gone","Nobody said a week"],"vo":"How long will you wait for a business to reply before you buy somewhere else? Thirty minutes, said one. An hour, said another. If it is tomorrow, I have already bought it, said the third. Nobody said a week. Nobody said two days. Your reply time is your shop being open.","cap":"Nobody in this street said they would wait a week. Your reply time is your shop being open.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["30 minutes","1 hour","Tomorrow? Gone","Nobody said a week"],"cap":"Ask your own customers this question. Then look at your reply time.","tags":["#LagosBusiness","#StreetInterview","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post, 95 words","body":"I asked people on the street: how long will you wait for a business to reply before you buy somewhere else?\n\nThirty minutes. An hour. 'If it is tomorrow, I have already bought it.'\n\nNobody said a week. Nobody even said two days.\n\nYour reply time is whether your shop is open or not. It matters more than your logo, your bio, and probably your price.\n\nHow long would you wait? Be honest.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D2-09","type":"Sell","topic":"The chat pack, and who should not buy it","why":"Selling by disqualifying. The limit doe e":"20:15"},{"id":"D2-10","type":"Entertain","topic":"We told a client to cancel","why":"A story that proves the studio will say the costly thing.","tiktok":{"fmt":"Talking head, 50s","hook":"We told a client to cancel their own project.","beats":["They had paid a deposit","The business had changed","The site was for a plan they dropped","We refunded and started over"],"vo":"We told a client to cancel their own project. They had paid a deposit. Halfway through, their business changed. The site we were building was for a plan they had quietly dropped. We could have finished it and taken the money. We refunded the deposit and started again in a different direction. It cost us a month. It is the reason they are still a client two years later.","cap":"We could have finished it and taken the money. We refunded instead.","tags":["#LagosBusiness","#HonestBusiness","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["They paid a deposit","Their business changed","We refunded","And started over"],"cap":"The most expensive thing we do is say the thing that costs us the job. It is also the only reason people come back.","tags":["#HonestBusiness","#LagosBusiness","#Easywurld"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post, 125 words","body":"We told a client to cancel their own project.\n\nThey had paid a deposit. Halfway through, their business changed direction and the site we were building was for a plan they had quietly dropped.\n\nWe could have finished it, delivered it, and taken the money. Nobody would have known for months.\n\nWe refunded the deposit and started again.\n\nIt cost us about a month of work. It is also the reason they still work with us.\n\nThe expensive thing is not honesty. The expensive thing is being found out later.\n\nHas a supplier ever told you not to spend? What did that do to your trust?","ta /* ---------------- state ---------------- */
var KEY_DONE = "eww_done_v2", KEY_NOTE = "eww_note_v2", KEY_DAY = "eww_day_v2",

var done = {}, notes = {}, open = {}, dayIdx = 0, filter = "all", startDate = "";

function load() {
  try { done = JSON.parse(localStorage.getItem(KEY_DONE) || "{}"); } catch (e) { done = {}; }

  try { open = JSON.parse(localStorage.getItem(KEY_OPEN) || "{}"); } catch (e) { open = {}; }
  try { var d = parseInt(localStorage.getItem(KEY_DAY), 10); if (!isNaN(d)) dayIdx = d; } catch (e) {}

  if (dayIdx < 0 || dayIdx >= DATA.days.length) dayIdx = 0;
}
function save() {
  localStorage.setItem(KEY_DONE, JSON.stringify(done));
  localStorage.setItem(KEY_NOTE, JSON.stringify(notes));
  localStorage.setItem(KEY_OPEN, JSON.stringify(open));
  localStorage.setItem(KEY_DAY, String(dayIdx));
  localStorage.setItem(KEY_START, startDate);

function esc(s) {

/* ---------------- schedule ---------------- */
function slotsForDay(d) {
  var out = [], p, i, times = DATA.times;
  for (p in PLAT) {
    if (!PLAT.hasOwnProperty(p)) continue;
    var list = [];
    for (i = 0; i < d.posts.length; i++) if (d.posts[i][p]) list.push(d.posts[i]);
    list.forEach(function (post, idx) {
      var t = (times[p] && times[p][idx]) ? times[p][idx] : "";
      if (p === "linkedin" && post.liBonus) t = post.liBonus;
      out.push({ time: t, platform: p, post: post, key: post.id + ":" + p });
    });
  }
  out.sort(function (a, b) {
    return a.time < b.time ? -1 : a.time > b.time ? 1 : (a.platform < b.platform ? -1 : 1);
  });

}
function minutes(t) { var a = t.split(":"); return (+a[0]) * 60 + (+a[1]); }

  return null;

/* ---------------- copy ---------------- */
function copyText(text, label) {
  if (!text) { toast("Nothing to copy"); return; }
  var t = String(text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(
      function () { toast("Copied: " + label); },
      function () { fallbackCopy(t, label); }
    );
  } else fallbackCopy(t, label);
}
function fallbackCopy(t, label) {
  var ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  if (ok) { toast("Copied: " + label); }
  else {
    document.getElementById("dlgTitle").textContent = label;
    document.getElementById("dlgText").value = t;
    var d = document.getElementById("dlg");
    if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  }
}
function fullText(s) {
  var p = s.post, out = [];

    out.push(p.tiktok.hook, "---", p.tiktok.beats.join("\n"), "", "VOICEOVER:", p.tiktok.vo, "", "CAPTION:", p.tiktok.cap, p.tiktok.tags.join(" "));
  } else if (s.platform === "instagram") {
    out.push(p.instagram.slides.join("\n"), "", "CAPTION:", p.instagram.cap, p.instagram.tags.join(" "));
  } else if (s.platform === "facebook") {
    out.push(p.facebook.body);

}
function copyPost(key) { var s = findSlot(key); if (s) copyText(fullText(s), PLAT[s.platform].label); }

  else if (field === "body") v = s.platform === "facebook" ? p.facebook.body : p.linkedin.body;

}
function findSlot(key) {

function setView(v) {
  ["Today", "Month", "Help"].forEach(function (x) {
    document.getElementById("view" + x).classList.toggle("hide", x.toLowerCase() !== v);
  });
  var bs = document.querySelectorAll("nav.tabs button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-v") === v);
  document.getElementById("hdRight").textContent =
    v === "today" ? "POST COMMANDER" : v === "month" ? "THE MONTH" : "HOW TO USE";
  if (v === "month") renderMonth();
  if (v === "help") renderHelp();
  window.scrollTo(0, 0);
}
document.addEventListener("DOMContentLoaded", function () {
  load();
  var ti = todayIndex();
  if (ti >= 0) dayIdx = ti;
  var bs = document.querySelectorAll("nav.tabs button");
  for (var i = 0; i < bs.length; i++) {
    (function (b) { b.addEventListener("click", function () { setView(b.getAttribute("data-v")); }); })(bs[i]);
  }
  renderToday(); renderMonth(); renderHelp();
  setView("today");
});
