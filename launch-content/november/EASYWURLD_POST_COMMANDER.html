. They took the one page, and it is the only site they have ever had enquiries from.","cap":"We refused five pages and sold one. It was the honest answer.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["Asked: 5 pages, ₦40k","Said: no","Offered: 1 page, done properly","They took it"],"cap":"A smaller promise you can keep beats a bigger one you cannot.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone asked for a five-page website for ₦40,000.\n\nWe said no. And then we said what ₦40,000 actually buys: one page, done properly. Real copy. Works on a phone. A contact button that works.\n\nFive pages at that price is five templates nobody reads.\n\nThey took the one page. It is the first site they have ever had enquiries from.\n\nWould you rather have five pages or one that works?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D11-11","type":"Teach","topic":"Write down who owns what","why":"A five-minute task with permanent consequences.","tiktok":{"fmt":"Kinetic type, 21s","hook":"Write down who owns your domain and hosting. If it is not your name, fix it this week.","beats":["One note","Domain, host, logins","Who to call","Then you cannot be held hostage"],"vo":"Write down who owns your domain and your hosting, in one note on your phone, including the login email. If either is in someone else's name, fix it this week while it is calm, not in six months when you have fallen out. This is the least interesting task in your business and the only one that can end it.","cap":"One note: domain, hosting, logins, who to call. Do it tonight.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["Domain owner","Hosting owner","Login email","Who to call"],"cap":"The least interesting task in your business is the one that can end it.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Write down who owns your domain and your hosting. One note on your phone:\n\nDomain — registered in whose name?\nHosting — paid by whom?\nLogin email — which one?\nWho do I call if it breaks?\n\nIf any of those is in someone else's name, fix it this week while everything is calm, not in six months when you have fallen out with them.\n\nDo you know your answers right now?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-11","day":11,"month":"Nov","year":2026,"weekday":"Wednesday","label":"Wednesday 11 Nov"},"short":"11 Nov"},{"day":12,"label":"Day 12 · Thursday","theme":"The follow-up week","offer":"HOMEPAGE","posts":[{"id":"D12-01","type":"Entertain","topic":"A spinning logo","why":"Every viewer has waited through this exact site.","tiktok":{"fmt":"Screen recording, 22s","hook":"This site opens with a video of a spinning logo. Six seconds of nothing, on mobile data.","beats":["Six seconds","No words","On data","The customer has left"],"vo":"This site opens with a video of a spinning logo. Six seconds, no words, no product, loading on mobile data at the customer's expense. In the time it takes that logo to finish spinning, the customer has decided you are slow. The animation is not the brand, it is the delay.","cap":"Six seconds of spinning logo. Nobody has ever bought because of it.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"4-slide carousel","slides":["A spinning logo","6 seconds","On their data","For nothing"],"cap":"The first thing on the page should be the offer, not the animation.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"This site opens with a video of a spinning logo.\n\nSix seconds. No words. No product. Loading on the customer's mobile data at the customer's expense.\n\nBy the time that logo finishes spinning, they have already decided you are slow.\n\nPut the offer first and let the logo be small and still.\n\nWhat does your page do in the first three seconds?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D12-02","type":"Entertain","topic":"Nobody buys because of a loading animation","why":"A line that is impossible to argue with.","tiktok":{"fmt":"Kinetic type, 12s","hook":"Nobody has ever bought anything because of a loading animation.","beats":["Not once","People leave because of them","Speed is the feature","Delete it"],"vo":"Nobody has ever bought anything because of a loading animation. Not once, in the history of commerce. People leave because of them all the time. Speed is invisible when you have it and fatal when you do not, and the fix is usually deletion, not optimisation.","cap":"Nobody bought because of it. People leave because of it.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Bought because of animation: 0","Left because of it: lots","Delete it"],"cap":"Speed is invisible when you have it and fatal when you don't.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Nobody has ever bought anything because of a loading animation.\n\nPeople leave because of them constantly.\n\nSpeed is invisible when you have it and fatal when you do not. Which means the fix is often deletion, not optimisation — and deletion is free.\n\nWhat could you delete from your homepage tonight?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D12-03","type":"Teach","topic":"The first line has three jobs","why":"One rule with three options, easy to apply today.","tiktok":{"fmt":"Kinetic type, 24s","hook":"Your first line has three jobs and can only do one of them.","beats":["What you sell","Who it is for","What to do next","Pick the strongest"],"vo":"Your first line has three jobs and it can only do one. Say what you sell, say who it is for, or say what to do next. Most homepages try all three at once and end up saying nothing. Pick the strongest one for your customer and write it in ten words or fewer, then leave it alone for a week.","cap":"Say what you sell, who for, or what to do. Not all three.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["What you sell","Who it is for","What to do next","Pick one"],"cap":"Ten words or fewer. Then leave it alone for a week.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Your first line has three possible jobs and can only do one of them well:\n\n1. Say what you sell.\n2. Say who it is for.\n3. Say what to do next.\n\nMost homepages attempt all three and say nothing.\n\nPick the strongest one for your customer, write it in ten words or fewer, and leave it alone for a week.\n\nWhat is your current first line?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D12-04","type":"Entertain","topic":"Design is reading order","why":"Reframes design from taste to function, which suits a non-designer owner.","tiktok":{"fmt":"Talking head, 20s","hook":"Design is not decoration. Design is reading order.","beats":["What do they see first","Second","Where does the eye go","Then the button"],"vo":"Design is not decoration. Design is reading order. What do they see first, what do they see second, and where does the eye go when they get bored. If the answer is anywhere but the button, the design is decorative and it is costing you. You do not need taste for this, you need to squint at your own page.","cap":"Squint at your homepage. Whatever you see first is what you are selling.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"4-slide carousel","slides":["First","Second","Third","Button: last?"],"cap":"Squint at your own page. What survives the blur is the message.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"Design is not decoration. Design is reading order.\n\nWhat does the customer see first? Second? Where does their eye go when they get bored?\n\nIf the answer is anywhere other than the thing you want them to do, the design is decorative and it is costing you money.\n\nYou do not need taste to check this. Squint at your own page. Whatever survives the blur is what you are actually selling.\n\nWhat do you see first?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D12-05","type":"Entertain","topic":"Better by deleting","why":"Removal is the cheapest improvement available, so the story is actionable.","tiktok":{"fmt":"Talking head, 29s","hook":"A page got four times better by deleting the top half.","beats":["Two hundred words about the founder","Gone","One line left","Enquiries went up"],"vo":"A page got four times better by deleting the top half of it. Two hundred words about the founder and the vision, replaced with one line about what they sell and to whom. Nothing was added. Nothing was designed. The line that had been hiding at the bottom was suddenly the headline, and it turned out to be the best sentence on the site.","cap":"Nothing added. Half the page deleted. Four times the enquiries.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["Top half: 200 words about us","Deleted","Best line was at the bottom","4× the enquiries"],"cap":"The best sentence on your site is probably already there, buried.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A homepage got four times better by deleting the top half of it.\n\nTwo hundred words about the founder and the vision, replaced with one line about what they sell and who they sell it to.\n\nNothing was added. Nothing was redesigned. The sentence that had been buried at the bottom became the headline, and it turned out to be the best writing on the site.\n\nWhat is buried at the bottom of yours?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D12-06","type":"Teach","topic":"Put the proof next to the claim","why":"A structural fix, not a copywriting opinion.","tiktok":{"fmt":"Kinetic type, 21s","hook":"Put the proof next to the claim, not four screens below it.","beats":["Claim: fast delivery","Proof: the date on the last job","Together","Otherwise it is a slogan"],"vo":"Put the proof next to the claim. If you say fast delivery, put the delivery date of your last job on the same line. If you say quality, put the photo of the actual product beside it. A claim on its own is a slogan. A claim with evidence attached is a fact, and facts are the only things that move money.","cap":"A claim alone is a slogan. A claim with evidence is a fact.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Claim: \"fast delivery\"","Proof: Tuesday","Same line"],"cap":"Every adjective needs a receipt beside it.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Put the proof next to the claim.\n\n'Fast delivery' — with the date of your last job on the same line.\n'Quality you can trust' — with a photo of the actual product beside it.\n\nA claim on its own is a slogan. A claim with evidence attached is a fact, and facts are the only thing that moves money.\n\nWhich of your claims has no receipt?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D12-07","type":"Entertain","topic":"Your best photo is at the bottom","why":"Nearly universal, and instantly checkable.","tiktok":{"fmt":"Screen recording, 16s","hook":"Your best photo is at the bottom of the page, where nobody decides anything.","beats":["Top: a stock photo","Bottom: the real thing","Swap them","Free improvement"],"vo":"Your best photo is at the bottom of the page. The top is a stock image of people shaking hands, and the bottom is a real photo of the real thing you actually sell. Swap them. That is a free improvement that takes ninety seconds and does more than a redesign.","cap":"Swap your stock photo for your real one. Ninety seconds.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Top: stock handshake","Bottom: your real product","Swap"],"cap":"The real thing beats the beautiful thing every time.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Your best photo is almost certainly at the bottom of the page, where nobody makes a decision.\n\nThe top has a stock image of people shaking hands. The bottom has a real photo of the real thing you sell.\n\nSwap them. It takes ninety seconds and it does more than a redesign.\n\nWhat is at the top of your homepage right now?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D12-08","type":"Entertain","topic":"The last shop you actually bought from","why":"Witnesses describing their own behaviour is the proof.","tiktok":{"fmt":"Street interview, 25s","hook":"I asked people why they bought from the last shop they used.","beats":["Not design","Not the logo","I saw the price straight away","That was it"],"vo":"I asked people why they bought from the last shop they used. Almost nobody mentioned design. One person said I saw the price straight away and I knew it was for me, and that was the whole reason. Which means the price and the first line are doing almost all the work, and everything else is decoration.","cap":"\"I saw the price straight away.\" That was the entire conversion.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["Why did you buy there?","Not the design","Not the logo","\"The price was there\""],"cap":"The price and the first line are doing almost all the work.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people why they bought from the last shop they used.\n\nAlmost nobody mentioned design. One person said: 'I saw the price straight away and I knew it was for me.' That was the whole reason.\n\nWhich means the price and the first line do almost all of the work. Everything else is decoration.\n\nWhy did you buy from the last shop you used?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D12-09","type":"Sell","topic":"The blueprint writes the first ten seconds","why":"Frames the product as a decision document, not a design file.","tiktok":{"fmt":"Overhead shot, 26s","hook":"The homepage blueprint is for the first ten seconds of your site, and it is words, not pixels.","beats":["First line","Second line","The button","Five thousand naira, no design skills"],"vo":"The homepage blueprint is about the first ten seconds of your site, and it is words, not pixels. The first line, the second line, and what the button says. It will not make your page beautiful. It will make it understandable, which is the part that was costing you money. Five thousand naira, and no design skill needed to use it.","cap":"Words, not pixels. ₦5,000. Message HOMEPAGE on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["First 10 seconds","Line 1","Line 2","The button","₦5,000 · HOMEPAGE"],"cap":"It will not make your page pretty. It will make it understood.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post","body":"The Homepage Blueprint is about the first ten seconds of your site, and it is words, not pixels.\n\nYour first line. Your second line. What your button says.\n\nIt will not make your page beautiful. It will make it understandable, which is the part that was actually costing you money.\n\n₦5,000. No design skill needed to use it. Message HOMEPAGE on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D12-10","type":"Entertain","topic":"Auto-playing sound","why":"A refusal everyone has suffered from as a visitor.","tiktok":{"fmt":"Talking head, 30s","hook":"A client wanted sound to play automatically. We said no.","beats":["It is not a mute button","It is a close button","Especially on a bus","They agreed"],"vo":"A client wanted music to play the moment the site loaded. We said no. On a phone, in public, with the volume up, that is not a feature, it is an exit. They argued for a day, we built it without sound, and the enquiries went up. The fastest way to lose someone on mobile is to make a noise they did not ask for.","cap":"On a phone with the volume up, sound is not a feature. It is an exit.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"3-slide carousel","slides":["Wanted: auto-play sound","On a phone, in public","That is a close button"],"cap":"Never make a noise the visitor did not ask for.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"A client wanted music to play automatically when their site loaded.\n\nWe said no. On a phone, in public, with the volume up, that is not a feature. It is an exit.\n\nThey argued about it for a day. We built it without sound. Enquiries went up.\n\nThe fastest way to lose someone on mobile is to make a noise they did not ask for.\n\nWhat would make you close a site immediately?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D12-11","type":"Teach","topic":"Print your homepage","why":"A physical test that bypasses design opinion entirely.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Print your homepage. Circle the first thing you read. If it is your logo, start again.","beats":["Print it","Squint","Circle the first thing","Logo means start again"],"vo":"Print your homepage and put it on the table. Squint. Circle the first thing you read. If it is your logo, start again, because your logo is your name and your name is not your offer. If it is your offer, good. If it is a stock photo, delete it. This takes four minutes and you already have a printer or a phone screen.","cap":"Print it, squint, circle the first thing. That is your real homepage.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["Print it","Squint","Circle the first thing","Logo? Start again"],"cap":"Four minutes. No printer? Squint at your phone instead.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Print your homepage and put it on the table. Squint. Circle the first thing you read.\n\nIf it is your logo, start again. Your logo is your name, and your name is not your offer.\n\nIf it is your offer, good. If it is a stock photo, delete it.\n\nFour minutes. No printer? Screenshot it and squint at your phone.\n\nWhat did you circle?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-12","day":12,"month":"Nov","year":2026,"weekday":"Thursday","label":"Thursday 12 Nov"},"short":"12 Nov"},{"day":13,"label":"Day 13 · Friday","theme":"The follow-up week","offer":"BUNDLE","posts":[{"id":"D13-01","type":"Entertain","topic":"Seven CTAs in forty words","why":"Everyone has written this caption, so the shame lands as recognition.","tiktok":{"fmt":"Screen recording, 22s","hook":"This post has seven calls to action in forty words. That means it has none.","beats":["Link in bio","DM me","Comment","Call","Book","Save","Share","Nobody does anything"],"vo":"This post has seven calls to action in forty words. Link in bio, DM me, comment below, call this number, book a slot, save it, share it. When you ask for seven things, the reader does nothing, because choosing is work. One post, one ask. Everything else is noise you paid attention to write.","cap":"Seven asks is not ambition. It is indecision, published.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"4-slide carousel","slides":["Link in bio","DM me","Comment · call · book","Seven asks = no ask"],"cap":"Ask for one thing. The other six are why nobody did anything.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A caption I saw this week had seven calls to action in forty words: link in bio, DM me, comment below, call, book, save, share.\n\nSeven asks is not ambition. It is indecision, published.\n\nWhen you ask for seven things, the reader does nothing, because choosing is work.\n\nOne post, one ask. Write the other six down for another day.\n\nWhat is the one thing you want people to do?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D13-02","type":"Entertain","topic":"One post, one job","why":"The simplest rule in the whole month, stated flatly.","tiktok":{"fmt":"Kinetic type, 13s","hook":"One post, one job: entertain, teach, or sell. Pick one.","beats":["Not two","Not three","One","Then post it"],"vo":"One post, one job. Entertain, teach, or sell. Pick one and commit to it, because the post that tries to do two does neither well. The one that entertains and then asks for money loses the entertainment. The one that teaches and then sells loses the teaching. Pick one job and let the next post do the other.","cap":"A post that does two jobs does neither.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Entertain","Teach","Sell","Pick one"],"cap":"Three jobs, eleven posts a day, one job each.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"One post, one job.\n\nEntertain. Teach. Or sell.\n\nPick one and commit, because a post that tries to do two does neither well. The one that entertains and then asks for money loses the entertainment. The one that teaches and then sells loses the teaching.\n\nYour next post can do the other job.\n\nWhich of the three do you default to?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D13-03","type":"Teach","topic":"The one-word CTA","why":"A copyable mechanic, not advice.","tiktok":{"fmt":"Kinetic type, 20s","hook":"Use one word as your call to action. Not four sentences of them.","beats":["One word","In capitals","It is a key","They type it, then everything else happens"],"vo":"Use one word as your call to action. Not link in bio, DM me, call, comment. One word in capitals: BUNDLE. They type it in the chat and a person replies. That word is a key, and a key is easier to turn than a paragraph of instructions. Test it for a week and count the messages.","cap":"One word in capitals. They type it. A human replies. That is the whole funnel.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Not: link in bio · DM · call","Yes: BUNDLE","One word is a key"],"cap":"A key is easier to turn than a paragraph.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Use one word as your call to action.\n\nNot 'link in bio, DM me, call, comment'. One word, in capitals: BUNDLE.\n\nThey type it in the chat, a person replies, and the conversation starts properly. That word is a key, and a key is far easier to turn than a paragraph of instructions.\n\nTry it for a week and count the messages.\n\nWhat would your one word be?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D13-04","type":"Entertain","topic":"\"Only 2 left\" with 40 left","why":"Names a practice the audience has caught others doing.","tiktok":{"fmt":"Talking head, 21s","hook":"\"Only two left\" when there are forty left is the end of your credibility.","beats":["People check","They always check","Now nothing you say is true","Including the price"],"vo":"Only two left, when there are forty left, is the end of your credibility. People check. They always check, because they have been lied to before. And once one number on your page is invented, every other number becomes a guess, including the price, which was true. Fake scarcity does not create urgency, it creates suspicion.","cap":"One invented number makes every true number look invented.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["\"Only 2 left\"","There are 40","They checked"],"cap":"Fake scarcity does not create urgency. It creates suspicion.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"'Only two left', when there are forty left, is the end of your credibility.\n\nPeople check. They always check, because they have been lied to before.\n\nAnd once one number on your page is invented, every other number becomes a guess — including the price, which was true.\n\nFake scarcity does not create urgency. It creates suspicion.\n\nHave you ever caught a shop doing this?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D13-05","type":"Entertain","topic":"Six packs, no price in the caption","why":"A mechanic with a real result attached, and no overclaiming.","tiktok":{"fmt":"Talking head, 28s","hook":"A post sold six packs with no price in the caption at all.","beats":["Pinned comment had it","Because the caption is for everyone","The comment is for the ready","Two audiences, one post"],"vo":"A post sold six packs with no price in the caption. The price was in the pinned comment. That was the whole trick. The caption stayed useful to the people who were never going to buy, and the people who were ready found the number one tap away. Same post, two audiences, nobody annoyed.","cap":"Price in the pinned comment. Six sales. The caption stayed readable.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["Caption: no price","Pinned comment: the number","6 packs sold"],"cap":"Serve the ready without lecturing everyone else.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A post sold six packs with no price in the caption. The price was in the pinned comment.\n\nThat was the entire trick.\n\nThe caption stayed useful to the people who were never going to buy. The people who were ready found the number one tap away.\n\nSame post, two audiences, nobody annoyed.\n\nWhat is in your first comment usually?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D13-06","type":"Teach","topic":"Sell the limit","why":"The most transferable idea of the week, usable outside our packs.","tiktok":{"fmt":"Kinetic type, 23s","hook":"Sell the limit, not the dream. \"It will not get you customers\" sells better than a promise.","beats":["Every ad promises","Promises sound like ads","A limit sounds like a person","Then they trust the rest"],"vo":"Sell the limit, not the dream. It will not get you customers, it will stop you losing the ones you have. That sentence sells better than any promise, because every ad promises and almost none admit a boundary. A limit sounds like a person telling the truth, and once they trust the limit, they trust the price.","cap":"A limit sounds like a person. A promise sounds like an ad.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Promises sound like ads","Limits sound like people","Lead with the limit"],"cap":"Say what it will not do. That is where trust starts.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Sell the limit, not the dream.\n\n'It will not get you customers — it will stop you losing the ones you already have.'\n\nThat sentence outsells any promise, because every ad promises and almost none admit a boundary. A limit sounds like a person telling the truth. Once they trust the limit, they trust the price.\n\nWhat is the honest limit of what you sell?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D13-07","type":"Entertain","topic":"The caption for people who already want it","why":"Splits the audience in a way people have never considered.","tiktok":{"fmt":"Kinetic type, 17s","hook":"Your caption explains the offer to the people who already want it.","beats":["They do not need the paragraph","They need the link","The paragraph is for the others","So write both, in order"],"vo":"Your caption explains the offer to the people who already want it. They do not need explaining. They need the link, in the first three lines, so they can act before their attention drifts. The explanation is for the ones who are not sure yet, and it can come after. Two groups, one order: price, then paragraph.","cap":"Price first. Paragraph second. Two groups, one order.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Already want it: need the link","Not sure: need the why","Price first, both served"],"cap":"Stop explaining to people who already decided.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Your caption usually explains the offer to the people who already want it.\n\nThey do not need explaining. They need the link, in the first three lines, before their attention drifts.\n\nThe explanation is for the people who are not sure yet, and it can come after.\n\nTwo groups, one order: price first, paragraph second.\n\nWhich group do you write for?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D13-08","type":"Entertain","topic":"What made you buy the last thing online?","why":"Unprompted witnesses saying the same thing as our teaching.","tiktok":{"fmt":"Street interview, 26s","hook":"I asked what made people buy the last thing they bought online.","beats":["Not the copy","Not the design","I could see what it was","And what it cost"],"vo":"I asked what made people buy the last thing they bought online. Nobody said the copywriting. Nobody said the design. Two things came up again and again: I could see what it was, and I could see what it cost. That is the entire job of a page, and it is smaller than most people's websites.","cap":"\"I could see what it was and what it cost.\" Nothing else came up.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["\"I could see what it was\"","\"And what it cost\"","That is the whole page"],"cap":"Visibility and price. Everything else is decoration you chose.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people what made them buy the last thing they bought online.\n\nNobody said the copywriting. Nobody said the design.\n\nTwo answers came up again and again: 'I could see what it was' and 'I could see what it cost'.\n\nThat is the entire job of a page, and it is far smaller than most people's websites.\n\nCan a stranger do both on yours in five seconds?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D13-09","type":"Sell","topic":"The bundle buys nothing new","why":"The most counterintuitive honest ad of the month.","tiktok":{"fmt":"Overhead shot, 25s","hook":"The bundle is thirty-five thousand naira and it buys you nothing new.","beats":["Same nine packs","Ten thousand cheaper","One decision instead of nine","That is the product"],"vo":"The bundle is thirty five thousand naira and it buys you nothing new. Same nine packs, ten thousand naira cheaper than buying them separately, and one decision instead of nine. That is the whole offer. It is not a course, not a community, not a call. If you only need one pack, buy one pack, because the bundle is for people who want all of it.","cap":"₦35,000. Same nine packs, one decision. Buy one pack if you need one. BUNDLE on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["₦35,000","Nothing new inside","Same 9 packs","₦10,000 less","One decision"],"cap":"If you need one pack, buy one pack. The bundle is for the undecided.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post","body":"The bundle is ₦35,000 and it buys you nothing new.\n\nSame nine packs, ₦10,000 cheaper than buying them separately, and one decision instead of nine.\n\nThat is the whole offer. Not a course, not a community, not a call.\n\nIf you only need one pack, buy one pack. The bundle is for people who want all of it and would rather decide once.\n\nBUNDLE on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D13-10","type":"Entertain","topic":"Promising results in the ad","why":"Explains why our copy reads the way it does, which builds trust in all of it.","tiktok":{"fmt":"Talking head, 31s","hook":"Someone asked us to promise results in the ad. We said no and wrote the limit instead.","beats":["Promises convert","Then they refund","Or they resent you","A limit filters and keeps"],"vo":"Someone asked us to write a promise into an ad. We said no. Promises convert, then they refund, then they resent you, and in a small market the resentment is more expensive than the sale. So we wrote the limit instead: this will not get you customers, it will stop you losing the ones you have. Fewer clicks. Better customers.","cap":"Promises convert once and cost you twice.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"3-slide carousel","slides":["\"Promise results\"","We said no","Wrote the limit instead"],"cap":"A promise sells the first time and ruins the second.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone asked us to write a promise into an ad.\n\nWe said no. Promises convert, then they refund, then they resent you — and in a small market the resentment is more expensive than the sale ever was.\n\nSo we wrote the limit instead: this will not get you customers, it will help you keep the ones you have.\n\nFewer clicks. Better customers. No refunds.\n\nWould you rather be believed or clicked?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D13-11","type":"Teach","topic":"Price in the first three lines","why":"Concrete and immediately testable on tonight's post.","tiktok":{"fmt":"Kinetic type, 21s","hook":"Put the price in the first three lines of the caption. Always.","beats":["Because they scroll","They will not find line nine","The rest of the caption","Is for everyone else"],"vo":"Put the price in the first three lines of the caption. Always. Not because everyone is ready, but because the ones who are ready will not scroll to line nine to find it, and the rest of the caption is for everyone else anyway. Hiding the price does not create curiosity, it creates a search.","cap":"Three lines. Price in one of them. The rest is for the curious.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Line 1","Line 2","Line 3: the price","Everything after: for the curious"],"cap":"Hiding the price creates a search, not curiosity.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Put the price in the first three lines of your caption.\n\nAlways.\n\nNot because everyone is ready, but because the people who are ready will not scroll to line nine to find it. The rest of the caption is for everyone else anyway.\n\nHiding the price does not create curiosity. It creates a search.\n\nLook at your last post. Which line was the price on?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-13","day":13,"month":"Nov","year":2026,"weekday":"Friday","label":"Friday 13 Nov"},"short":"13 Nov"},{"day":14,"label":"Day 14 · Saturday","theme":"The receipts","offer":"PLAYBOOK","posts":[{"id":"D14-01","type":"Entertain","topic":"The worst follow-up of the fortnight","why":"Closes the follow-up week with the image it opened on.","tiktok":{"fmt":"Screen recording, 23s","hook":"The worst follow-up I saw this fortnight: nine messages, all of them hello.","beats":["Nine hellos","No information","Then a discount","Then silence"],"vo":"The worst follow-up I saw this fortnight was nine messages long and every single one said hello. No price, no date, no photograph, nothing to reply to. Then, on the ninth, a discount, which is the sound of someone giving up. Nine chances to be useful and not one of them carried anything.","cap":"Nine hellos, then a discount. That is not follow-up, that is fading out loud.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"5-slide carousel","slides":["hello?","Hello","Any update?","10% off?","…"],"cap":"If none of your messages carry information, none of them are follow-ups.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"The worst follow-up I saw this fortnight was nine messages long and every one said hello.\n\nNo price. No date. No photo. Nothing to reply to. Then on the ninth message, a discount — which is the sound of someone giving up.\n\nNine chances to be useful, and not one of them carried anything.\n\nWhat does your follow-up usually say?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D14-02","type":"Entertain","topic":"Two weeks in, the honest number","why":"A public ledger is the most defensible content an account can post.","tiktok":{"fmt":"Talking head, 25s","hook":"Two weeks in. Here is the number, read off the sheet, including the boring parts.","beats":["Views are not the point","Conversations are","Most posts did little","The few did most"],"vo":"Two weeks in, and here is the number read off the sheet. Most posts did very little. A few did most of the work. The conversations that came from it were fewer than the views by a factor of about a thousand, which is normal and is the part nobody posts about. That is the honest state of it, and I would rather show you the flat line than sell you a hockey stick.","cap":"Two weeks, read off the sheet. Mostly a flat line, a few spikes, and a thousand views per conversation.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"Carousel, 4:5","slides":["Two weeks","Most posts: little","A few: most of it","Views ÷ 1000 = conversations","That is normal"],"cap":"The flat line is the honest part. Most accounts never show it.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Two weeks in, and here is the honest number, read off the sheet.\n\nMost posts did very little. A few did most of the work. The conversations that came out of it were roughly a thousand views per conversation, which is normal and is the part nobody posts about.\n\nI would rather show you the flat line than sell you a hockey stick.\n\nWhat does your own sheet say?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D14-03","type":"Teach","topic":"The lesson that got the most saves","why":"Re-runs the winner with new material instead of repeating it.","tiktok":{"fmt":"Kinetic type, 24s","hook":"The most saved lesson of the fortnight, again, with a different story.","beats":["People save checklists","This one is five lines","New example","Same shape"],"vo":"The most saved thing I posted this fortnight was the five lines every quote needs. So here it is again with a different example. What it is. How much. By when. What is included. What is not. On a catering quote: jollof for forty, this much, Saturday by noon, plates and serving included, drinks not included. Same five lines, different business.","cap":"What · How much · By when · Included · Not included. Again, because you saved it.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["What it is","How much","By when","Included","Not included"],"cap":"The same five lines, applied to catering. Use whichever example is yours.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"The most saved lesson of the last fortnight, again, with a different example.\n\nWhat it is. How much. By when. What is included. What is not included.\n\nOn a catering quote: jollof for forty people, this much, Saturday by noon, plates and serving included, drinks not included.\n\nSame five lines. Different business. Works every time.\n\nWhich one do you leave out?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D14-04","type":"Entertain","topic":"Half of content strategy is answering people","why":"Cheap to act on, and quietly deflates the mystique of strategy.","tiktok":{"fmt":"Talking head, 19s","hook":"Half of what people call content strategy is just answering messages.","beats":["Answer the same question","Publicly","Again","That is the strategy"],"vo":"Half of what people call content strategy is just answering messages in public. Someone asks a question in your chat, you answer it in a post, someone else has the same question, and you have just saved a conversation. Do that forty times and you have a content strategy, a website, and an FAQ, and you did not need a framework.","cap":"Answer the same question in public forty times. That is the strategy.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["They asked in DM","Answer it in public","40 times","= a strategy"],"cap":"Your inbox is a content calendar you keep ignoring.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"Half of what people call content strategy is just answering messages in public.\n\nSomeone asks a question in your chat. You answer it in a post. Someone else has the same question and now you have saved a conversation.\n\nDo that forty times and you have a content strategy, a website and an FAQ — and you never needed a framework.\n\nWhat did someone ask you this week?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D14-05","type":"Entertain","topic":"The best thing anyone said to us this fortnight","why":"Quoting a customer honestly, with no embellishment.","tiktok":{"fmt":"Talking head, 27s","hook":"The best thing anyone said to us this fortnight, quoted exactly.","beats":["Not a compliment","A correction","You told me the price in the first line","That is why I messaged"],"vo":"The best thing anyone said to us this fortnight was not a compliment. It was this: you told me the price in the first line, and that is why I messaged you. Which is not flattering, it is a mechanic. But it was the first proof that the thing we had been writing about all week was doing what we said it did, and it came from a stranger, which is the only place proof counts.","cap":"\"You told me the price in the first line. That is why I messaged.\"","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["\"You told me the price\"","\"In the first line\"","\"That is why I messaged\""],"cap":"Not a compliment. A mechanic, confirmed by a stranger.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"The best thing anyone said to us this fortnight:\n\n'You told me the price in the first line, and that is why I messaged you.'\n\nNot flattering. Just a mechanic, confirmed by a stranger — which is the only place proof actually counts.\n\nWe had been writing about that all week, and there it was in the inbox.\n\nWhat is the last thing a customer told you that you did not expect?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D14-06","type":"Teach","topic":"What I got wrong this week","why":"A correction with no lesson attached is rarer and more credible.","tiktok":{"fmt":"Talking head, 22s","hook":"What I got wrong this week, with no lesson attached.","beats":["I said follow up three times","I did not follow up once","Because I was busy","That is it"],"vo":"What I got wrong this week. I told you to follow up within three days, and then I did not follow up with a single person who messaged me, because I was busy, which is exactly what every customer of yours says. No lesson attached. I just got it wrong, and the advice is still right, which is the uncomfortable part.","cap":"Told you to follow up in three days. Did not follow up once. No lesson attached.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["I said: follow up in 3 days","I followed up: 0 times","Advice still stands"],"cap":"\"Do as I say\" is weaker when you admit you did not.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"What I got wrong this week.\n\nI told you to follow up within three days. Then I did not follow up with a single person who messaged me, because I was busy — which is exactly what every customer of yours says.\n\nNo lesson attached. I just got it wrong. The advice is still right, which is the uncomfortable part.\n\nWhere are you not doing the thing you tell other people to do?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D14-07","type":"Entertain","topic":"The post I deleted","why":"Transparency about editing builds trust in everything published.","tiktok":{"fmt":"Talking head, 20s","hook":"I wrote a post this week and deleted it before publishing. Here is why.","beats":["It was a joke at someone's expense","At a real business","They would know","So it went"],"vo":"I wrote a post this week and deleted it before publishing. It was a teardown of a real business and the joke was at their expense, and they would have recognised themselves, which makes it bullying with a screenshot attached. It would have done well. It went in the bin.","cap":"It would have performed. It would have been cruel. It went in the bin.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Wrote it","It would have done numbers","Deleted it"],"cap":"If they would recognise themselves, it is not a teardown. It is a joke at their expense.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"I wrote a post this week and deleted it before publishing.\n\nIt was a teardown of a real business and the joke was at their expense. They would have recognised themselves. That makes it bullying with a screenshot attached.\n\nIt would have done numbers.\n\nIt went in the bin.\n\nWhat have you not posted because it was true but unkind?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D14-08","type":"Entertain","topic":"Our own bio, round two","why":"Pays off the promise made on day 7.","tiktok":{"fmt":"Street interview, 28s","hook":"We rewrote our own bio after strangers could not tell what we do. Round two.","beats":["New bio","Still vague","Round two said: the people who write your homepage","Better, not perfect"],"vo":"We rewrote our bio after strangers ous to write down.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A bakery I looked at this week had four paragraphs about quality and tradition.\n\nThe actual reason anyone goes there: bread out of the oven at six in the morning, in Agege.\n\nThat is a headline. What it is, where it is, why it is different — in eleven words.\n\nThe paragraphs cost them money. The line would have made them some.\n\nWhat is the too-obvious sentence about your business?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D15-02","type":"Entertain","topic":"One sentence away","why":"The thesis of the whole week in one line.","tiktok":{"fmt":"Kinetic type, 15s","hook":"Every Lagos business is one sentence away from being understood.","beats":["Never the sentence they chose","Always the plain one","Twelve words","Then everything else works"],"vo":"Every Lagos business is one sentence away from being understood, and it is never the sentence they chose. It is never the one about excellence or the vision. It is the plain one: we fix generators in Surulere, same day. Twelve words, and then the phone rings, because the customer finally knows what you are.","cap":"\"We fix generators in Surulere, same day.\" Twelve words. Then the phone rings.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Not the vision","Not the excellence","The plain sentence"],"cap":"One sentence away. Always the plain one.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Every Lagos business is one sentence away from being understood.\n\nAnd it is never the sentence they chose. It is never the one about excellence or the vision. It is the plain one: 'We fix generators in Surulere, same day.'\n\nTwelve words. Then the phone rings, because the customer finally knows what you are.\n\nWhat is your twelve words?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D15-03","type":"Teach","topic":"Rewrite a competitor in three lines","why":"Doing it on someone else's page removes the ego from the exercise.","tiktok":{"fmt":"Kinetic type, 23s","hook":"Rewrite a competitor's homepage in three lines, then do yours in ten minutes.","beats":["What they sell","Who for","What to do","That is the whole exercise"],"vo":"Find a competitor's homepage and rewrite it in three lines. What they sell, who it is for, what to do next. It takes four minutes because you do not care about being clever. Then do yours, and notice how much harder it is, because now your ego is involved. The exercise is easier on someone else for exactly that reason.","cap":"Three lines: what, who, next. Do a competitor first. Yours is harder.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["Pick a competitor","Line 1: what they sell","Line 2: who for","Line 3: what to do"],"cap":"Yours will be harder. That is the point of practising on theirs.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Exercise for tonight, and it takes ten minutes.\n\nFind a competitor's homepage. Rewrite it in three lines: what they sell, who it is for, what to do next.\n\nIt is easy, because you do not care about being clever about their business.\n\nThen do yours. Notice how much harder it is, because now your ego is involved.\n\nThat difficulty is the whole reason your homepage reads the way it does.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D15-04","type":"Entertain","topic":"A clarity problem and a marketing budget","why":"Reframes spending as a symptom.","tiktok":{"fmt":"Talking head, 20s","hook":"Lagos businesses do not have a marketing problem. They have a clarity problem and a marketing budget.","beats":["The budget is the symptom","Not the cure","Spending on an unclear page","Buys more people who leave"],"vo":"Lagos businesses do not have a marketing problem, they have a clarity problem and a marketing budget. The budget is the symptom, not the cure. Spending money to send more people to a page that does not explain what you do does not double your business, it doubles the number of people who leave confused, and it does it faster.","cap":"More traffic to an unclear page is a more expensive version of the same problem.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Not a marketing problem","A clarity problem","With a marketing budget"],"cap":"The budget is the symptom. Not the cure.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"Lagos businesses do not have a marketing problem. They have a clarity problem and a marketing budget.\n\nThe budget is the symptom, not the cure.\n\nSpending money to send more people to a page that does not explain what you do does not double your business. It doubles the number of people who leave confused, faster.\n\nFix the sentence first. Then spend.\n\nWhich one have you been doing?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D15-05","type":"Entertain","topic":"A trader outsold a shop with a sign","why":"Local, humble, and makes the point without a website at all.","tiktok":{"fmt":"Talking head, 30s","hook":"A market trader outsold a shop with a sign, and she had no sign at all.","beats":["The shop had a sign","The trader had a price","She said it before anyone asked","That was the whole advantage"],"vo":"A market trader outsold a shop that had a sign, a glass front and a generator. She had a table and a voice, and she said the price before anybody asked. That is it. The shop made people come in to find out, and most people will not come in to find out. She removed the question and got the sale.","cap":"She said the price before anyone asked. The shop with the sign did not.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["Shop: sign, glass, generator","Trader: table and a voice","She said the price first","She sold more"],"cap":"Removing the question beats decorating the answer.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A market trader outsold a shop with a sign, a glass front and a generator.\n\nShe had a table and a voice, and she said the price before anybody asked.\n\nThat is it. The shop made people come in to find out. Most people will not come in to find out.\n\nShe removed the question. That was the whole advantage.\n\nWhere are you making people ask?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D15-06","type":"Teach","topic":"The one-sentence description","why":"A fill-in-the-blank tool is the most shareable format there is.","tiktok":{"fmt":"Kinetic type, 24s","hook":"One sentence: we do this, for who, so they can do that.","beats":["Fill it in","Say it out loud","If it is long","It is two sentences"],"vo":"The sentence is: we do this, for these people, so they can do that. We build one page websites for Lagos small businesses so they can stop explaining themselves in every chat. Fill it in for your business, say it out loud, and if it takes more than one breath, you have written two sentences and you need to pick the better one.","cap":"We [do this] for [who] so they can [result]. One breath or it is two sentences.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["We [do this]","for [who]","so they can [result]","One breath"],"cap":"Screenshot this and fill it in with a pen. Not a keyboard.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"The one-sentence description:\n\n'We [do this] for [who] so they can [result].'\n\nExample: 'We build one-page websites for Lagos small businesses so they can stop explaining themselves in every chat.'\n\nFill it in. Say it out loud. If it takes more than one breath, you have written two sentences and you need to pick the better one.\n\nWhat is yours? Put it in the comments.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D15-07","type":"Entertain","topic":"A beautiful shop, an empty listing","why":"Points at free money most owners have never claimed.","tiktok":{"fmt":"Screen recording, 17s","hook":"Your shop is beautiful. Your Google listing is empty. That is where the search happens.","beats":["No photos","No hours","No category","And it is free to fix"],"vo":"Your shop is beautiful and your Google listing is empty: no photos, no hours, no category, sometimes the wrong phone number. When someone searches for what y  because she was asked at pickup, at the counter, holding the thing she had just paid for. The email would have arrived three days later, and she would have ignored it like everyone ignores it. Ask at the moment gratitude peaks.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"4-slide carousel","slides":["Asked by email: ignored","Asked at the counter: reviewed","Holding the thing she paid for","Timing beats politeness"],"cap":"Ask at the moment gratitude peaks. Which is not three days later, by email.","body":"She left the review because she was asked at pickup, holding the thing she had just paid for. The email three days later would have been ignored, like all of them are.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A customer left a review because she was asked at pickup. At the counter. Holding the thing she had just paid for.\n\nThe email would have come three days later and she would have ignored it, like everyone ignores those emails.\n\nReviews are not about asking nicely. They are about asking at the moment gratitude is highest — about forty seconds after delivery.\n\nWhen do you ask?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D17-06","type":"Teach","topic":"Ask for the review at the moment of delivery","why":"A one-line habit change with a visible effect.","tiktok":{"fmt":"Kinetic type, 20s","hook":"Ask for the review at the moment of delivery. Not later. Then.","beats":["While the box is open","One sentence","A link","That is the whole system"],"vo":"Ask for the review at the moment of delivery, while the box is still open and the joy has not worn off. One sentence, one link, and then stop asking. The reason most businesses have eleven reviews after six years is not that customers are stingy, it is that they ask on a Tuesday, by email, three days after everyone stopped caring.","cap":"One sentence at delivery. One link. Then never mention it again.","body":"Ask for the review at the moment of delivery, while the box is still open and the joy has not worn off. One sentence, one link, then stop asking. Most businesses have eleven reviews after six years because they ask on a Tuesday, by email, three days late.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["The box is still open","One sentence","One link, then never again"],"cap":"One sentence at delivery. One link. Then never mention it again.","body":"Most businesses have eleven reviews after six years because they ask on a Tuesday, by email, three days late. Ask at the door, while the joy has not worn off.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Ask for the review at the moment of delivery. While the box is still open and the joy has not worn off.\n\nOne sentence. One link. Then never mention it again.\n\nThe reason most businesses have eleven reviews after six years is not stingy customers. It is that they ask on a Tuesday, by email, three days after everyone stopped caring.\n\nTry asking at the door this week and count.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D17-07","type":"Entertain","topic":"One bad review answered well","why":"Turns a fear into a strategy.","tiktok":{"fmt":"Kinetic type, 17s","hook":"One bad review answered well beats ten good ones.","beats":["Because it is public","Because it is calm","Because it was hard","Everybody is watching how you handle it"],"vo":"One bad revie nd nobody finds it, this is the pack. If you do not have a site yet, start with the homepage one instead.\n\n₦5,000. Message LAUNCH on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D17-10","type":"Entertain","topic":"We refused to buy reviews","why":"The one irreversible mistake is worth a whole post.","tiktok":{"fmt":"Talking head, 30s","hook":"Someone offered to get us reviews. We said no, and here is why it is the worst thing you can buy.","beats":["They are cheap","They are traceable","They never go away","You cannot delete a pattern"],"vo":"Someone offered to get us reviews for a small fee. We said no, because bought reviews are the only mistake in this business you cannot undo. A fake review can be reported, and the pattern of them can be spotted, and when it is, every real review you have becomes suspect too. You are trading six years of trust for eleven numbers.","cap":"Bought reviews are the only mistake here you cannot undo.","body":"Someone offered to get us reviews for a small fee. We said no. Bought reviews are the only mistake in this business you cannot undo: a fake can be reported, the pattern can be spotted, and when it is, every real review you have becomes suspect too.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"3-slide carousel","slides":["Bought reviews: cheap","Fakes get reported","Then every real one is suspect"],"cap":"Bought reviews are the only mistake here you cannot undo.","body":"A fake review can be reported and the pattern of them can be spotted. When it is, every genuine review you have becomes suspect too. You traded years of trust for eleven numbers.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone offered to get us reviews for a small fee. We said no.\n\nBought reviews are the only mistake in this business you cannot undo. One fake can be reported. The pattern of them can be spotted. And when it is, every real review you have becomes suspect too.\n\nYou would be trading six years of trust for eleven numbers.\n\nHave you ever suspected a shop of this?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D17-11","type":"Teach","topic":"Area in the caption, every time","why":"Repeats the day's simplest mechanic at the end, when it is easiest to act.","tiktok":{"fmt":"Kinetic type, 19s","hook":"Put your area in the caption every single time. Search reads captions.","beats":["Not hashtags","The words","Yaba","One word"],"vo":"Put your area in the caption every single time, in words. Not a hashtag, the actual word: Yaba, Ikeja, Wuse. Search reads the words you wrote, and it reads them long before it reads your hashtags. One word, every post, and you are findable by the people who are already near you.","cap":"Yaba is a keyword. Put it in the caption, in words, every post.","body":"Put your area in the caption every single time, in words. Not a hashtag, the actual word: Yaba, Ikeja, Wuse. Search reads the words you wrote before it reads your hashtags, and one word per post makes you findable to people who are already near you.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Not a hashtag","The word itself","Yaba, every post"],"cap":"Yaba is a keyword. Put it in the caption, in words, every post.","body":"Search reads the words you wrote before it reads your hashtags. One place name per post makes you findable by people who are already near you, which is the cheapest audience there is.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Put your area in the caption every single time, in words.\n\nNot a hashtag. The actual word: Yaba, Ikeja, Wuse, Surulere.\n\nSearch reads the words you wrote, long before it reads your hashtags. One word per post makes you findable by people who are already near you.\n\nWhich word should be in yours?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-17","day":17,"month":"Nov","year":2026,"weekday":"Tuesday","label":"Tuesday 17 Nov"},"short":"17 Nov"},{"day":18,"label":"Day 18 · Wednesday","theme":"Fix this Lagos","offer":"MESSAGE","posts":[{"id":"D18-01","type":"Entertain","topic":"\"Bespoke\" four times","why":"A specific, funny, checkable failure.","tiktok":{"fmt":"Screen recording, 23s","hook":"This page says bespoke four times and never tells you what they actually make.","beats":["Bespoke","Tailored","Curated","Then no noun at all"],"vo":"This page says bespoke four times, tailored twice, and curated once, and it never once tells you what they make. Fancy words are a hiding place, because a specific word can be argued with and a fancy one cannot. The customer is not impressed by bespoke. They are looking for the noun.","cap":"Bespoke ×4, tailored ×2, curated ×1, and no noun anywhere.","body":"This page says bespoke four times, tailored twice, and curated once, and never tells you what they actually make. Fancy words are a hiding place, because a specific word can be argued with and a fancy one cannot. The customer is looking for the noun.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"4-slide carousel","slides":["Bespoke ×4","Tailored ×2","Curated ×1","Noun: none"],"cap":"Bespoke ×4, tailored ×2, curated ×1, and no noun anywhere.","body":"Fancy words are a hiding place, because a specific word can be argued with and a fancy one cannot. The customer is not impressed by bespoke. They are looking for the noun.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A page I read this week says 'bespoke' four times, 'tailored' twice and 'curated' once, and never tells you what they actually make.\n\nFancy words are a hiding place, because a specific word can be argued with and a fancy one cannot.\n\nThe customer is not impressed by 'bespoke'. They are looking for the noun.\n\nWhat is your noun?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D18-02","type":"Entertain","topic":"If it could be on any site","why":"A deletion test that takes thirty seconds.","tiktok":{"fmt":"Kinetic type, 15s","hook":"If a word could appear on any site, it belongs on none.","beats":["Quality","Passion","Excellence","Delete and see what is left"],"vo":"If a word could appear on any site in the world, it belongs on none. Quality, passion, excellence, world class. Delete them all and read what is left. If the page still says something, you had a page. If it says nothing, you had adjectives with a logo on top.","cap":"Delete every word that could be on any site. Read what is left.","body":"If a word could appear on any site in the world, it belongs on none. Quality, passion, excellence, world class. Delete them all and read what is left. If the page still says something, you had a page. If it says nothing, you had adjectives with a logo on top.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Quality","Passion","Excellence","Delete all three"],"cap":"Delete every word that could be on any site. Read what is left.","body":"If the page still says something, you had a page. If it says nothing once the adjectives are gone, you had a logo with decoration on top.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"If a word could appear on any site in the world, it belongs on none.\n\nQuality. Passion. Excellence. World class.\n\nDelete them all and read what is left. If the page still says something, you had a page. If it says nothing, you had adjectives with a logo on top.\n\nWhat survives on your page?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D18-03","type":"Teach","topic":"One adjective into one number","why":"The most directly useful copy edit in the month.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Replace one adjective with one number. Fast becomes within twenty minutes.","beats":["Fast is a claim","Twenty minutes is a fact","Cheap becomes this price","Reliable becomes four years"],"vo":"Replace one adjective with one number. Fast becomes within twenty minutes. Affordable becomes from twelve thousand. Reliable becomes four years without a missed delivery. Adjectives are claims and numbers are evidence, and you already know your numbers, you just did not think they were marketing.","cap":"Fast → within 20 minutes. Affordable → from ₦12,000. Reliable → 4 years.","body":"Replace one adjective with one number. Fast becomes within twenty minutes. Affordable becomes from ₦12,000. Reliable becomes four years without a missed delivery. Adjectives are claims and numbers are evidence, and you already know your numbers.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4- one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Draft: three sentences","Best line: the last one","Delete the first two"],"cap":"Your best line was the last sentence. Delete the two before it.","body":"Copywriting is removal. The first draft is three sentences, the best line is one of them, and it is almost always the last. Ship that one.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"Copywriting is not cleverness. It is removal.\n\nYour first draft is three sentences. The best line is one of them — usually the last. Delete the first two and you are done.\n\nIt will be better than the version you were proud of, which is annoying and reliable in equal measure.\n\nWhat could you cut from your homepage tonight?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D18-05","type":"Entertain","topic":"Halved headline, doubled clicks","why":"A before-and-after with one number and no exaggeration.","tiktok":{"fmt":"Talking head, 27s","hook":"A headline halved in length doubled the clicks. Nobody reads the second clause.","beats":["Twenty two words","Eleven","Second clause deleted","Clicks doubled"],"vo":"A headline was twenty two words long, so we cut it to eleven by deleting the second clause. The meaning did not change, because the second clause was repeating the first in a politer voice. Clicks doubled. Nobody reads the second clause. They read the first four words and decide, which is why every word after those has to earn its place.","cap":"Twenty-two words to eleven. The meaning did not change. Clicks doubled.","body":"A headline was twenty-two words, so we cut it to eleven by deleting the second clause. The meaning did not change, because the second clause was repeating the first in a politer voice. Clicks doubled. Nobody reads
