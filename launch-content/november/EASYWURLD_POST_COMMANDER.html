:["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"3-slide carousel","slides":["Nothing to refuse","I could invent one","Then none of these are real"],"cap":"The series only works because it can be empty.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"This is the slot where I normally tell you something we refused to do. Nothing happened this week.\n\nI could invent one. You would never know. And then every other story in this series would be worth nothing, including the true ones.\n\nSo: nothing to report. Back next week, and I hope it stays boring.\n\nHave you ever caught a business making up a story?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D7-11","type":"Teach","topic":"Next week is follow-up week","why":"Announcing the arc gives people a reason to return.","tiktok":{"fmt":"Kinetic type, 19s","hook":"Next week is follow-up week. Every post, one lesson, all on the same problem.","beats":["Same subject for seven days","Learn it properly","Then do it","Follow to get the week"],"vo":"Next week is follow-up week. Seven days, one subject: the message you send after the one that got ignored. By Friday you will have the whole system, and you can run it on Monday. Follow if you want the week, because the posts will be in order and the first one matters most.","cap":"Seven days, one subject. That is how a lesson sticks.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Next week","Follow-up","Seven days, one subject"],"cap":"A themed week beats seven unrelated tips. Come back tomorrow.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Next week is follow-up week.\n\nSeven days, one subject: the message you send after the first one gets ignored. By Friday you will have the whole system and can run it from Monday.\n\nSeven related posts teach something. Seven unrelated tips are just noise, and you forget all of them.\n\nWhat is the one thing you keep meaning to fix in your business?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-07","day":7,"month":"Nov","year":2026,"weekday":"Saturday","label":"Saturday 7 Nov"},"short":"7 Nov"},{"day":8,"label":"Day 8 · Sunday","theme":"The follow-up week","offer":"PLAYBOOK","posts":[{"id":"D8-01","type":"Entertain","topic":"Eleven unanswered 'hello?'","why":"The visual of a screen of one-word messages is painful and true.","tiktok":{"fmt":"Screen recording, 25s","hook":"This chat is eleven messages long and nine of them say hello.","beats":["Same customer","Getting more polite","Then gone","A reply on day one fixes all of it"],"vo":"This chat is eleven messages long and nine of them say hello. Same customer, getting more polite each time, then gone. Nobody was rude. Nobody was ignored on purpose. But from the customer's side, this is a business that does not answer, and they told ten friends.","cap":"Nine hellos is one customer being patient, publicly, until they stop.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"5-slide carousel","slides":["hello?","Hello??","Hello","...","Gone"],"cap":"Every unanswered hello is a story they will tell about you.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A chat I saw this week: eleven messages long, nine of them variations of 'hello?'\n\nSame customer, being polite each time, then gone.\n\nNobody was rude. Nobody ignored them on purpose. But from the customer's side, that is a business that does not answer, and they will tell ten people.\n\nOne reply on day one would have fixed all eleven messages.\n\nHow long do messages sit in your inbox?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D8-02","type":"Entertain","topic":"Twice is not harassment","why":"Names the fear that stops people following up at all.","tiktok":{"fmt":"Kinetic type, 14s","hook":"Following up twice is not harassment. It is a reminder.","beats":["They are not annoyed","They forgot","Start from their side","Then send it"],"vo":"Following up twice is not harassment. Harassment is the fifth message with nothing in it. A reminder, sent once, three days later, with something useful attached, is what a good supplier does. The customer is not annoyed. The customer is at work.","cap":"You are not bothering them. You are reminding them.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Twice","Is a reminder","Five times with nothing in it","Is harassment"],"cap":"The difference is whether the message carries something.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"A lot of people do not follow up because they are afraid of being a nuisance.\n\nFollowing up twice is not harassment. Harassment is the fifth message with nothing in it.\n\nA reminder, sent three days later, with one useful thing attached, is exactly what a good supplier does. The customer is not annoyed. The customer is at work and forgot.\n\nWhen did you last send a second message?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D8-03","type":"Teach","topic":"The day-three message, word for word","why":"Giving the exact words removes the last excuse.","tiktok":{"fmt":"Kinetic type, 24s","hook":"Here is the exact message to send on day three. Steal it.","beats":["Name the thing","Assume nothing","Ask a yes/no","No apology"],"vo":"Here is the day three message, word for word. Hi Ada, the ankara set you asked about is still available. We have two slots left for Friday delivery. Should I keep one for you? That is it. No apology, no just checking in, no question mark on the price. One line of information and one question they can answer with one word.","cap":"Information first, question second, apology never.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["Name the thing","Add real information","Ask a yes/no question","No apology","Send on day 3"],"cap":"Copy it, put your own product in it, send it on Thursday.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"The day-three message, word for word:\n\n'Hi Ada, the ankara set you asked about is still available. We have two slots left for Friday delivery. Should I keep one for you?'\n\nThat is it. Information first, one question second, no apology, and nothing that sounds like begging.\n\nCopy it, put your own product in it, and send it on Thursday to anyone who went quiet this week.\n\nTell me what happens.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D8-04","type":"Entertain","topic":"'If they wanted it, they would reply'","why":"Attacks a belief that quietly costs people their income.","tiktok":{"fmt":"Talking head, 21s","hook":"\"If they wanted it, they would have replied\" is the most expensive sentence in small business.","beats":["They were at work","Then it sank","Then they felt awkward","So they did not reply"],"vo":"If they wanted it they would have replied is the most expensive sentence in small business. They did want it. Then they were at work. Then your message sank under forty others. Then it was three days later and they felt awkward about replying, so they did not. Nobody changed their mind. The chat just went stale.","cap":"They did not change their mind. The message just sank.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["\"They would have replied\"","They were at work","Then it sank","Then it was awkward"],"cap":"Silence has more causes than disinterest. Usually it is just Tuesday.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"'If they wanted it, they would have replied.'\n\nI think this is the most expensive sentence in small business.\n\nThey did want it. Then they were at work. Then your message sank under forty newer ones. Then it was three days later and it felt awkward to reply, so they did not.\n\nNobody changed their mind. The chat just went stale.\n\nWhich of your quotes has gone quiet this week?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D8-05","type":"Entertain","topic":"The job closed on the fourth message","why":"One number makes the whole case for persistence.","tiktok":{"fmt":"Talking head, 33s","hook":"A two hundred and fifty thousand naira job closed on the fourth message.","beats":["The first three were ignored","None were pushy","Each carried something new","The fourth got the yes"],"vo":"A two hundred and fifty thousand naira job closed on the fourth message. The first three were ignored, and none of them were pushy. One gave a delivery date. One gave a photo of the previous job. One said the slot was going to be released. The fourth got a yes in eleven minutes. Persistence without information is nagging. With it, it is service.","cap":"Three messages, three pieces of information, one yes.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["Message 1: ignored","Message 2: a date","Message 3: a photo","Message 4: the yes"],"cap":"If each message teaches them something, it is not nagging.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A ₦250,000 job closed on the fourth message.\n\nThe first three were ignored. None of them were pushy. One carried a delivery date. One carried a photo of a previous job. One said the slot would be released at the end of the week.\n\nThe fourth got a yes in eleven minutes.\n\nPersistence with no information is nagging. Persistence with information is service.\n\nHow many messages do you send before you give up?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D8-06","type":"Teach","topic":"Release the stock, out loud","why":"A real deadline is more persuasive than any adjective.","tiktok":{"fmt":"Kinetic type, 21s","hook":"You do not need fake scarcity. You need a real deadline.","beats":["\"I'll release it Friday\"","True if you would","Then release it","The truth is the pressure"],"vo":"You do not need to invent scarcity. You need a real deadline. I will release this slot on Friday and give it to the next person. That is true, because the slot is worth money and you cannot hold it forever. The moment you say it, and mean it, the customer has a reason to decide this week without you pretending there is a queue.","cap":"A real deadline does the work that fake scarcity pretends to do.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["Fake: \"only 2 left\"","Real: \"I'll release it Friday\"","Then actually release it"],"cap":"Invent a deadline once and every future deadline stops working.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"You do not need to invent scarcity. You need a real deadline.\n\n'I will release this slot on Friday and offer it to the next person.'\n\nThat is true, because the slot is worth money and you cannot hold it indefinitely. Say it once, then actually do it on Friday.\n\nThe difference between that and 'only 2 left' is that one of them survives being checked.\n\nDo you have a real deadline you could name today?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D8-07","type":"Entertain","topic":"Your quote is forty messages up","why":"A physical image that makes the abstract problem concrete.","tiktok":{"fmt":"Kinetic type, 13s","hook":"Your quote is forty messages up their chat list, behind a group chat.","beats":["Invisible to them","Visible to you","That asymmetry is the problem","Remind them"],"vo":"Your quote is forty messages up their chat list, behind a family group and two deliveries. To you it is the most important message you sent this week. To them it is invisible. That gap is the whole reason follow-up exists, and it has nothing to do with whether they like you.","cap":"You are not being ignored. You are being buried.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["To you: the big message","To them: 40 messages down","Remind, do not resent"],"cap":"Assume every message you send is invisible a week later.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"Your quote is forty messages up their chat list, behind a family group and two delivery notifications.\n\nTo you, it is the most important thing you sent this week. To them, it is invisible.\n\nThat gap is the entire reason follow-up exists, and it has nothing to do with whether they like you.\n\nYou are not being ignored. You are being buried.\n\nWhen did you last assume your message was invisible?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D8-08","type":"Entertain","topic":"Do you read the second message?","why":"The answer contradicts most people's fear of following up.","tiktok":{"fmt":"Street interview, 27s","hook":"I asked: do you reply to a vendor's second message?","beats":["Most said yes","Because it reminded them","The first was the problem","Second messages work"],"vo":"I asked people whether they reply to a vendor's second message. Most said yes, and almost all said the same reason: the first one arrived when I was busy. So the second message is not annoying, it is the one that actually lands. Most businesses never send it, which is remarkable when you think about it.","cap":"The second message works because the first one arrived at the wrong moment.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["\"Do you reply to the 2nd message?\"","Most: yes","Because the 1st came at work","Most businesses never send it"],"cap":"The follow-up is not the annoying one. It is the effective one.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people: do you reply to a vendor's second message?\n\nMost said yes, and nearly all gave the same reason. The first one arrived when they were busy.\n\nSo the second message is not annoying. It is the one that actually lands, and most businesses never send it.\n\nIf you are worried about being a nuisance, the data says you are worrying about the wrong thing.\n\nWhat stops you sending it?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D8-09","type":"Sell","topic":"The tracker is the unglamorous half","why":"Selling the boring part builds credibility for everything else.","tiktok":{"fmt":"Overhead shot, 28s","hook":"The most useful thing in this pack is a spreadsheet, and nobody buys it for the spreadsheet.","beats":["36 scripts get all the attention","The tracker is what gets used","Dates, not feelings","Five thousand naira"],"vo":"The most useful thing in this pack is a spreadsheet, and nobody buys it for the spreadsheet. The scripts get all the attention, but the tracker is what makes the follow-ups happen, because it shows you who is due today. Five thousand naira for the whole thing. It will not bring you customers. It stops you losing the ones you already have.","cap":"Scripts get the credit. The tracker does the work. ₦5,000. Message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["36 scripts","Get all the attention","A spreadsheet","Does the actual work","₦5,000 · PLAYBOOK"],"cap":"The boring half of any system is the half that runs.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post","body":"The most useful thing in the Chat-to-Customer Playbook is a spreadsheet, and almost nobody buys it for the spreadsheet.\n\nThe 36 scripts get all the attention. The tracker is what actually makes follow-ups happen, because it tells you who is due today instead of leaving it to memory.\n\n₦5,000 for the whole thing. No consulting, no guarantees, no new customers. It just stops you losing the ones already in your inbox.\n\nMessage PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D8-10","type":"Entertain","topic":"Automating the first message","why":"A principle stated as a line you can actually hold.","tiktok":{"fmt":"Talking head, 40s","hook":"Someone asked us to set up auto-replies on every channel. We said no.","beats":["Auto-reply is a promise","A bot cannot keep a specific promise","So it reads as a wall","One typed line, then automate"],"vo":"Someone asked us to put auto-replies on every channel. We said no, for one reason. An automatic reply is a promise, and a promise you cannot make specific reads as a wall. The first message in a sale has to be typed by a person who can say something only true for that customer. Automate the tenth message, not the first.","cap":"The first reply is the one place a human is worth more than software.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["Auto-reply everything?","No","The first message is a promise","A bot can't make it specific"],"cap":"Automate the tenth message. The first one is the one that counts.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone asked us to put automatic replies on every channel.\n\nWe said no, for one reason. An automatic reply is a promise, and a promise you cannot make specific reads as a wall.\n\nThe first message of a sale has to be typed by a person who can say something true about that one customer.\n\nAutomate the tenth message. Not the first.\n\nWhere is the line for you?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D8-11","type":"Teach","topic":"Three dates before you press send","why":"A habit that converts good intentions into a working system.","tiktok":{"fmt":"Kinetic type, 23s","hook":"Before you send a quote, put three dates in your phone.","beats":["Day 1","Day 3","Day 7","Then the system runs itself"],"vo":"Before you press send on a quote, put three dates in your phone. Day one, the quote goes out. Day three, one useful thing and a question. Day seven, the close: should I keep this or release it. Three reminders, ten seconds, and the whole follow-up problem disappears because it stopped depending on you remembering.","cap":"Three calendar reminders. Ten seconds. That is the entire follow-up system.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["Before you send","Day 1: the quote","Day 3: something useful","Day 7: the close","Put all three in your phone"],"cap":"Systems beat memories. Every time.","body":"Before you press send on a quote, put three dates in your phone. Day 1: quote out. Day 3: something useful and a question. Day 7: keep it or release it.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Before you press send on a quote, put three dates in your phone.\n\nDay 1: the quote goes out.\nDay 3: one useful thing and a question.\nDay 7: the close — keep it or release it.\n\nThree reminders. Ten seconds of work.\n\nThe follow-up problem is not a discipline problem. It is a calendar problem, and calendars are easy.\n\nDo you do this already?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-08","day":8,"month":"Nov","year":2026,"weekday":"Sunday","label":"Sunday 8 Nov"},"short":"8 Nov"},{"day":9,"label":"Day 9 · Monday","theme":"The follow-up week","offer":"PLAYBOOK","posts":[{"id":"D9-01","type":"Entertain","topic":"Six questions, answered nowhere","why":"Every business has an FAQ they have never written down.","tiktok":{"fmt":"Screen recording, 26s","hook":"This site answers six questions nowhere. Price, delivery, hours, location, returns, payment.","beats":["Six questions","Every customer asks them","None are on the page","That is six conversations each"],"vo":"This site answers six questions nowhere. Price. Delivery. Opening hours. Where they are. Returns. How to pay. Every customer asks at least four of those before buying, which means every customer costs you a conversation you did not need to have. Put the six answers on the page and the conversations become orders.","cap":"Six questions. Every customer asks them. Nowhere on the page.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"6-slide carousel","slides":["Price?","Delivery?","Hours?","Where are you?","Returns?","How do I pay?"],"cap":"All six are already typed in your inbox. Screenshot them and put them on the site.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"Count the questions your customers ask before they buy. For most businesses it is four to six:\n\nPrice. Delivery. Opening hours. Location. Returns. How to pay.\n\nMost of those are answered nowhere on the website, which means every single customer costs you a conversation you did not need to have.\n\nThe answers are already sitting in your inbox. Search one word and you will find them typed out fifty times.\n\nWhich one do you answer most?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D9-02","type":"Entertain","topic":"You have typed this 400 times","why":"Turns an annoyance into an obvious, cheap fix.","tiktok":{"fmt":"Kinetic type, 15s","hook":"You have typed the same answer four hundred times this year.","beats":["Four hundred","Same words","Same customer type","That is not service, that is a missing page"],"vo":"You have typed the same answer four hundred times this year. Same words, different customers, all day. That is not good service. That is a missing page on your website, and it is costing you the hours you would have spent actually making the thing you sell.","cap":"If you have typed it more than twenty times, it belongs on the page.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["You typed it 400 times","Same words","Same answer","It belongs on a page"],"cap":"Your thumbs are doing work your website should do.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"If you have typed the same answer more than twenty times this year, it does not belong in the chat. It belongs on the page.\n\nSame words, different customers, all day. That is not good service. That is a missing page, and it is costing you the hours you would have spent making the thing you actually sell.\n\nWhat is the sentence you type most often?\n\nPut it on your website tonight and count the difference by Friday.","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D9-03","type":"Teach","topic":"The away message","why":"A free fix, doable in one minute, on the platform they already use.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Put your four answers in your WhatsApp away message. You just hired a night shift for free.","beats":["Price","Delivery","Hours","Payment detail","It answers at 11pm"],"vo":"Put your four answers in your WhatsApp away message. One line for the price, one for delivery, one for hours, one for how to pay. Then when someone messages at eleven at night, they get an answer instead of silence, and you wake up to a conversation that has already started properly. That is a night shift for free.","cap":"Four lines in an away message. It answers when you are asleep.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["Away message","Price","Delivery","Hours + payment","Answers at 11pm"],"cap":"You cannot hire a night shift for ₦0. Except here.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Put your four most common answers in your WhatsApp away message.\n\nOne line for price. One for delivery. One for opening hours. One for how to pay.\n\nThen when someone messages at 11pm, they get information instead of silence, and you wake up to a conversation that has already started properly.\n\nFour lines. About ninety seconds of typing. It answers while you sleep.\n\nWhat would your four lines say?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D9-04","type":"Entertain","topic":"An FAQ is not lazy","why":"Reverses the standard objection in one line.","tiktok":{"fmt":"Talking head, 18s","hook":"An FAQ page is not lazy. Your inbox is lazy.","beats":["Answer once","Publicly","Forever","That is the whole point"],"vo":"An FAQ page is not lazy. Your inbox is lazy. If you answer the same question in a chat, one person learns it once. If you answer it on a page, everyone learns it forever, including the people who would never have messaged you, which is most of them.","cap":"Answering in a chat helps one person. Answering online helps everyone.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Chat: 1 person learns","Page: everyone learns","Including the silent ones"],"cap":"The people who never messaged are the ones an FAQ wins.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"An FAQ page is not lazy. Answering the same question in ten separate chats is the lazy option, because it only helps ten people.\n\nAnswer it once, on a page, and it helps everyone who reads it forever — including the people who would never have messaged you. Which is most of them.\n\nWhat question are you answering over and over that should be written down?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D9-05","type":"Entertain","topic":"Three hundred deliveries","why":"A number that makes the wasted effort physically obvious.","tiktok":{"fmt":"Talking head, 31s","hook":"A vendor typed the word \"delivery\" three hundred times in one month.","beats":["Three hundred","Same answer","Two lines of catalogue","Would have saved all of it"],"vo":"A vendor typed the word delivery three hundred times in one month. Same answer every time: yes we deliver, it is this much, it takes this long. Two lines in the catalogue would have saved every one of those replies. That is not a marketing problem, it is a filing problem, and it is free to fix.","cap":"Three hundred replies to one question. Two lines would have done it.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["300 × \"delivery?\"","300 identical answers","2 lines in a catalogue","0 of them necessary"],"cap":"Count your most-repeated sentence this month. That number is your wasted hours.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A vendor typed the word 'delivery' three hundred times in one month.\n\nEvery time, the same answer: yes we deliver, it costs this much, it takes this long.\n\nTwo lines in their catalogue would have saved all three hundred replies.\n\nThat is not a marketing problem. It is a filing problem, and it is free to fix this evening.\n\nWhat is your most-repeated sentence?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D9-06","type":"Teach","topic":"The saved reply you should write tonight","why":"One action, tonight, that they will actually do.","tiktok":{"fmt":"Kinetic type, 20s","hook":"Tonight, write one saved reply: the answer you typed most this week.","beats":["Find it in your chat","Copy it once","Save it as a shortcut","Use it forever"],"vo":"Tonight, write one saved reply. Go into your chat, scroll up, find the answer you typed most this week, copy it exactly as you wrote it, and save it as a shortcut on your phone. Not a template from a book, your own words. Tomorrow it takes two taps instead of twenty.","cap":"Your own words, saved once, used forever. Tonight, two minutes.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["Scroll up","Find your most-typed answer","Copy your own words","Save as a shortcut"],"cap":"Do not use a template. Use the sentence you already know works.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Tonight's task, and it takes two minutes.\n\nOpen your chat. Scroll up. Find the answer you typed most this week. Copy it exactly as you wrote it — your own words, not a template from a book — and save it as a shortcut on your phone.\n\nTomorrow that reply takes two taps instead of twenty seconds of thought.\n\nWhat is yours? Write it in the comments and I will tell you if it is clear.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D9-07","type":"Entertain","topic":"\"Is it available?\" is the whole conversation","why":"A blunt, memorable reframe of what a product page is for.","tiktok":{"fmt":"Kinetic type, 16s","hook":"\"Is it available?\" is the entire conversation, and it should not exist.","beats":["Not the price","Not the quality","Availability","Show stock"],"vo":"Is it available is the entire conversation, and it should not exist. Nobody asks whether a price is nice or a fabric is soft first. They ask whether it is there. So show what is there: a photo, a count, a colour, a size. Stock is more persuasive than any adjective you can write.","cap":"Show stock, not adjectives.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["\"Is it available?\"","First question, always","So answer it before they ask"],"cap":"A photo of the actual item in the actual size does more than a paragraph.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"The first question almost every customer asks is not about price or quality. It is 'is it available?'\n\nSo show what is there. A photo, a count, a colour, a size, a date it can be collected.\n\nStock is more persuasive than any adjective you can write about the product.\n\nDo your customers have to ask?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D9-08","type":"Entertain","topic":"What do you ask before buying from a new shop?","why":"The answer surprises almost everyone selling online.","tiktok":{"fmt":"Street interview, 28s","hook":"I asked what people ask before buying from a shop they have never used.","beats":["Not the price","Not quality","Where are you","Then whether it is real"],"vo":"I asked what people ask before buying from a shop they have never used. It was not the price. It was not the quality. It was where are you, and then, is this a real business. Trust comes before money in every single answer, which is why the location line and the photo of your actual shop matter more than your logo.","cap":"\"Where are you?\" came first. Not price. Trust, then money.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["\"Where are you?\"","\"Is this real?\"","\"Who else bought?\"","Price comes 4th"],"cap":"Nobody buys from a stranger without checking they exist.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people what they check before buying from a shop they have never used.\n\nThe order was consistent:\n1. Where are you?\n2. Is this a real business?\n3. Has anyone else bought?\n4. How much?\n\nPrice came fourth. Trust comes before money every time, which is why an address, a photo of the actual shop, and one real customer sentence matter more than any logo.\n\nWhat do you check first?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D9-09","type":"Sell","topic":"The four-answer profile setup","why":"Sells a specific deliverable, not a vague improvement.","tiktok":{"fmt":"Overhead shot, 24s","hook":"The chat pack includes a four-answer profile setup. It takes one afternoon.","beats":["What it is","Price, delivery, hours, payment","One afternoon","Five thousand naira"],"vo":"The chat pack includes a four answer profile setup, and it is the least exciting page in the whole thing. Price, delivery, hours, payment. Four lines on your profile and in your away message. It takes one afternoon and it answers most of the questions you answer by hand. Five thousand naira for the pack. It will not bring you customers. It stops you losing hours.","cap":"Four lines, one afternoon, most of your repeated replies gone. ₦5,000. Message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"instagram":{"fmt":"Carousel, 4:5","slides":["Four-answer setup","Price · Delivery · Hours · Payment","One afternoon","₦5,000 · PLAYBOOK","No consulting included"],"cap":"The least exciting page is the one that keeps the most hours.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld","#WhatsAppBusiness"],"asset":"Nine printed packs fanned on a table, shot from above."},"facebook":{"fmt":"Text post","body":"The least exciting part of the Chat-to-Customer Playbook is the four-answer profile setup.\n\nPrice. Delivery. Opening hours. How to pay.\n\nFour lines in your bio and your away message. One afternoon of work. It removes most of the questions you currently answer by hand, one customer at a time.\n\n₦5,000 for the pack. Message PLAYBOOK on WhatsApp: 0905 069 0837. No consulting, no guarantees, no new customers — just fewer wasted hours.","tags":["#SmallBusinessNigeria","#LagosBusiness","#Easywurld"]},"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D9-10","type":"Entertain","topic":"Hide the delivery cost","why":"A principle with an obvious cost attached.","tiktok":{"fmt":"Talking head, 32s","hook":"Someone asked us to hide the delivery cost until checkout. We said no.","beats":["It is legal","It is also expensive","Surprise fees cost more than the fee","Show it early"],"vo":"Someone asked us to keep the delivery cost out of sight until checkout. We said no. It is legal and it works, briefly, and then it costs more than the fee itself, because the customer feels caught rather than served. Show delivery early, even when it is ugly. The ones who stay are the ones who can pay, which is the only kind you want.","cap":"A surprise fee costs more than the fee. Every time.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"3-slide carousel","slides":["Hide delivery till checkout","We said no","The surprise costs more than the fee"],"cap":"Filters out the buyers who cannot pay, which is a kindness to both sides.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone asked us to keep the delivery cost out of sight until checkout.\n\nWe said no. It is legal, and it works briefly, and then it costs more than the fee itself — because the customer feels caught rather than served. They abandon, and they tell people why.\n\nShow delivery early, even when it is ugly. The ones who stay are the ones who can actually pay, which is the only kind of customer worth chasing.\n\nWould you rather lose them early or late?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D9-11","type":"Teach","topic":"One catalogue item beats none","why":"Removes the excuse of not being ready.","tiktok":{"fmt":"Kinetic type, 19s","hook":"One item beats a catalogue you have not built yet.","beats":["Start with the one that sells most","Photo, price, size","One page","Add the second next week"],"vo":"One catalogue item beats a catalogue you have not built. Start with the one that sells most, not your favourite one. A photo, a price, a size, and one sentence about who it is for. Put it on a page. Then add the second item next week. Ten pages built one at a time is a website. A plan for ten pages is still a plan.","cap":"Start with the item that sells most. Not your favourite.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["One item","Your best seller","Photo, price, size, one sentence","Add the second next week"],"cap":"Ten pages built one at a time is a website. A plan is still a plan.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"One catalogue item beats a catalogue you have not built yet.\n\nStart with the one that sells most, not your favourite. A photo, a price, a size, and one sentence about who it is for. Put it on a page.\n\nAdd the second item next week.\n\nTen pages built one at a time is a website. Ten pages you are planning is still a plan.\n\nWhat is your single best seller?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-09","day":9,"month":"Nov","year":2026,"weekday":"Monday","label":"Monday 9 Nov"},"short":"9 Nov"},{"day":10,"label":"Day 10 · Tuesday","theme":"The follow-up week","offer":"PROPOSAL","posts":[{"id":"D10-01","type":"Entertain","topic":"A quote that is one line","why":"Recognisable to anyone who has ever sent a quote.","tiktok":{"fmt":"Screen recording, 24s","hook":"This quote is one line: one hundred and eighty thousand naira, let me know.","beats":["No scope","No date","No reason","Three things missing"],"vo":"This quote is one line. One hundred and eighty thousand naira, let me know. No scope, so they do not know what they are buying. No date, so they cannot plan. No reason, so it is a number with no story. The price was not the problem. The other three lines were missing.","cap":"Three words were missing, and none of them was the price.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"4-slide carousel","slides":["\"₦180,000, let me know\"","No scope","No date","No reason"],"cap":"A number without a story is just a hurdle.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A quote I saw this week was one line: '₦180,000, let me know.'\n\nNo scope, so the customer does not know what they are buying. No date, so they cannot plan. No reason, so the number has nothing holding it up.\n\nThe price was not the problem. Three lines were missing around it.\n\nWhat does your quote usually look like?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D10-02","type":"Entertain","topic":"A quote with no date is a question","why":"The sharpest reframe in the day.","tiktok":{"fmt":"Kinetic type, 14s","hook":"A quote with no date is not a quote. It is a question.","beats":["They cannot say yes","They cannot plan","So they ask more questions","Give them a date"],"vo":"A quote with no date is not a quote, it is a question, because the customer cannot answer it. They do not know whether yes means next week or December, so they ask more questions, and every question is another chance for the sale to die. Give them a date and they can say yes.","cap":"A date turns a number into a decision.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["No date","= a question","= they cannot say yes"],"cap":"Every unanswerable sentence in a quote is a delay you cannot afford.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"A quote with no date is not a quote. It is a question.\n\nThe customer cannot answer it, because they do not know whether yes means next week or December. So they ask more questions, and every question is another chance for the sale to quietly die.\n\nGive them a date and the sentence becomes answerable.\n\nWhen will you deliver? Write it in your next quote.","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D10-03","type":"Teach","topic":"Five lines every quote needs","why":"The most saveable post of the week.","tiktok":{"fmt":"Kinetic type, 25s","hook":"Five lines every quote needs. Copy these labels.","beats":["What","How much","By when","What's included","What's not"],"vo":"Five lines every quote needs. What it is. How much. By when. What is included. And what is not included. That is the entire format, in that order, on one screen, in the message itself. The last line is the one that wins work, and it is the one almost nobody writes.","cap":"What · How much · By when · Included · Not included. In that order.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"5-slide carousel","slides":["What it is","How much","By when","What's included","What's not included"],"cap":"Save this and use it on your next quote, today.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Five lines every quote needs, in this order:\n\n1. What it is\n2. How much\n3. By when\n4. What is included\n5. What is not included\n\nOne screen, in the message itself, no attachment needed.\n\nThe fifth line is the one that wins work, and it is the one almost nobody writes.\n\nWhich of the five do you usually skip?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D10-04","type":"Entertain","topic":"The exclusions line","why":"Counterintuitive and immediately usable.","tiktok":{"fmt":"Talking head, 20s","hook":"The \"what's not included\" line wins more jobs than the price does.","beats":["It sounds honest","Because it is","It prevents the argument","Nobody else does it"],"vo":"The what is not included line wins more jobs than the price does. It sounds honest, because it is, and because almost nobody writes it. It also prevents the argument in week three about whether the frame was part of it. One line, written before the problem exists, is worth more than a discount.","cap":"Write the awkward line early and you never have the awkward conversation.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["Everyone lists: included","Almost nobody lists: excluded","That is the trust"],"cap":"The exclusions line is the cheapest trust you can buy.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"The line that wins more jobs than the price is the one that says what is not included.\n\nIt sounds honest, because it is. Almost nobody writes it. And it prevents the argument in week three about whether the frame, the delivery, or the revision was part of the deal.\n\nOne line written before the problem exists is worth more than a discount.\n\nHave you ever had that argument?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D10-05","type":"Entertain","topic":"A date beat a cheaper price","why":"Directly attacks the assumption that price always wins.","tiktok":{"fmt":"Talking head, 28s","hook":"A quote with a date beat a quote that was cheaper.","beats":["Fifteen thousand cheaper","No date on it","The customer could not plan","So they paid more for certainty"],"vo":"A quote with a delivery date beat a quote that was fifteen thousand naira cheaper. The cheaper one had no date on it at all, so the customer could not plan their own week, and went with the one that told them exactly when it would be done. Certainty was worth fifteen thousand, and it cost the other vendor nothing to give it.","cap":"Certainty sold for ₦15,000 more, and it cost the winner nothing.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["Quote A: ₦15k cheaper","No date","Quote B: dated","B won"],"cap":"The cheaper quote lost because it could not be planned around.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A quote with a delivery date beat one that was ₦15,000 cheaper.\n\nThe cheaper quote had no date on it. The customer could not plan their own week around it, so they went with the one that told them exactly when the job would be done.\n\nCertainty was worth ₦15,000. It cost the winning vendor nothing to give it.\n\nWhat are you holding back that costs you nothing?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D10-06","type":"Teach","topic":"Never a PDF first","why":"A small, specific, instantly obeyed rule.","tiktok":{"fmt":"Kinetic type, 21s","hook":"Never send a PDF as your first contact with a customer.","beats":["They will not open it","Or they open it at work","Put the price in the message","PDF after interest"],"vo":"Never send a PDF as your first contact. They will not open it, or they will open it in a queue and close it. Put the number in the message itself, one screen, no scrolling. Send the PDF after they have asked a second question, because then it is information instead of homework.","cap":"A PDF is homework. A message is a decision.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["First contact","No PDF","Price in the message","PDF after question two"],"cap":"Your quote is competing with forty notifications. Make it one screen.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Never send a PDF as your first contact with a customer.\n\nThey will not open it. Or they will open it in a queue and close it before page two.\n\nPut the number in the message itself. One screen. No scrolling.\n\nSend the PDF after they have asked a second question — by then it is information rather than homework.\n\nHow do you send quotes?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D10-07","type":"Entertain","topic":"\"Let me know if you're interested\"","why":"Names the exact sentence most people end quotes with.","tiktok":{"fmt":"Kinetic type, 15s","hook":"\"Let me know if you are interested\" is homework for the customer.","beats":["They have to decide alone","With no deadline","No next step","So nothing happens"],"vo":"Let me know if you are interested is homework. You have handed the customer a decision, no deadline, and no next step, and then you have left the room. Give them one question instead: shall I book the slot for Thursday. It has a date in it, so it can be answered.","cap":"End with a question that has a date inside it.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["\"Let me know if interested\"","= decide this alone, forever","\"Shall I book Thursday?\""],"cap":"Never end a message with an instruction to feel something.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"'Let me know if you're interested' is homework for the customer.\n\nYou have handed them a decision, no deadline and no next step, and then left the room.\n\nEnd with one question that has a date inside it: 'Shall I book the slot for Thursday?'\n\nThat can be answered with one word. The other one cannot be answered at all.\n\nWhat do you usually end with?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D10-08","type":"Entertain","topic":"What makes you trust a quote?","why":"Witnesses validate the whole week's thesis.","tiktok":{"fmt":"Street interview, 26s","hook":"I asked what makes people trust a quote. Nobody said the price.","beats":["One said detail","One said date","One said the exclusions line","Price was not mentioned once"],"vo":"I asked what makes people trust a quote. Nobody said the price. One said the detail, one said the date, and one said the line that told her what would not be done, because it was the only part that sounded like a person rather than a template. That is what you are competing on.","cap":"\"They told me what they would not do.\" Not one person said price.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["\"What makes you trust a quote?\"","Detail","A date","The exclusions line","Price: not once"],"cap":"Trust is built in the lines around the number, not in the number.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people what makes them trust a quote. Not one person said the price.\n\nOne said the detail. One said the delivery date. One said the line that told her what would not be done, because it was the only part that sounded like a person rather than a template.\n\nThat is what you are actually competing on.\n\nWhat made you trust the last quote you accepted?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D10-09","type":"Sell","topic":"Who the Proposal Pack is for","why":"Disqualifying buyers builds trust and reduces refunds.","tiktok":{"fmt":"Overhead shot, 26s","hook":"The Proposal Pack is ","We could not","So we told the truth","And lost the job"],"vo":"Someone asked us to quote a job for three weeks. We could not do it in three weeks without rushing something that would show. So we quoted six. They went with someone who said three, and I hope that person could actually do it. We lost the job and kept the standard, and I would do it again, which is easy to say and was not easy at the time.","cap":"We quoted the truth, lost the job, and would do it again.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"instagram":{"fmt":"Reel + caption","slides":["Asked for: 3 weeks","Could do: 6","Said: 6","Lost the job"],"cap":"The fastest quote is not the same as the honest one.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HonestBusiness"],"asset":"Talking head, plain cream wall, no cuts except on the turn."},"facebook":{"fmt":"Text post","body":"Someone asked us to quote a job for three weeks.\n\nWe could not do it in three weeks without rushing something that would show. So we quoted six.\n\nThey went with the person who said three. We lost the job and kept the standard.\n\nI would do it again, which is easy to say now and was not easy at the time.\n\nHave you ever lost work by being accurate?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D10-11","type":"Teach","topic":"End with a yes-shaped question","why":"One small habit with an outsized effect on replies.","tiktok":{"fmt":"Kinetic type, 20s","hook":"End every quote with one question: \"Shall I book the slot?\"","beats":["Yes-shaped","One word to answer","Has a date in it","Then stop typing"],"vo":"End every quote with one question: shall I book the slot. It is yes shaped, it takes one word to answer, and it implies there is a slot with value. Then stop typing. No second paragraph, no let me know, no thank you so much for your time. One question, and then silence, which is where the answer comes from.","cap":"One question. Then stop typing.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"3-slide carousel","slides":["End with a question","Yes-shaped","Then stop typing"],"cap":"\"Shall I book the slot?\" is the most answerable sentence in a quote.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"End every quote with one question: 'Shall I book the slot?'\n\nIt is yes-shaped. It takes one word to answer. It implies the slot has value and a date.\n\nThen stop typing. No second paragraph. No 'let me know'. No thank you for your time.\n\nOne question, then silence — which is where the answer actually comes from.\n\nTry it on your next quote and tell me what happens.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-11-10","day":10,"month":"Nov","year":2026,"weekday":"Tuesday","label":"Tuesday 10 Nov"},"short":"10 Nov"},{"day":11,"label":"Day 11 · Wednesday","theme":"The follow-up week","offer":"PLAYBOOK","posts":[{"id":"D11-01","type":"Entertain","topic":"Forty pages, no enquiries","why":"The number contrast is the whole argument.","tiktok":{"fmt":"Screen recording, 25s","hook":"This site cost twenty-five thousand naira, has forty pages, and has never had one enquiry.","beats":["Forty pages","Zero enquiries","Because pages are not a funnel","One page would beat it"],"vo":"This site cost twenty five thousand naira, has forty pages, and in eight months has had no enquiries. Forty pages is not forty chances. It is forty places for the customer to get lost. One page that answers six questions and asks for one action would outperform the entire thing, and it would take an afternoon.","cap":"Forty pages, zero enquiries. Pages are not a funnel.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"instagram":{"fmt":"4-slide carousel","slides":["40 pages","₦25,000","0 enquiries","1 page beats it"],"cap":"Volume of pages is not the same as a path to buying.","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria","#Easywurld"],"asset":"Screen recording of the page, cream frame, one terracotta arrow on the problem."},"facebook":{"fmt":"Text post","body":"A site I looked at this week: ₦25,000, forty pages, zero enquiries in eight months.\n\nForty pages is not forty chances. It is forty places for a customer to get lost.\n\nOne page that answers six questions and asks for one clear action would beat the whole thing, and it takes an afternoon to write.\n\nHow many pages does your site have, and how many enquiries?","tags":["#LagosBusiness","#WebsiteDesign","#SmallBusinessNigeria"]},"ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D11-02","type":"Entertain","topic":"The cheapest quote is a payment plan","why":"A reframe that sticks because it is financially literal.","tiktok":{"fmt":"Kinetic type, 16s","hook":"The cheapest quote is a payment plan for a second project.","beats":["You pay once now","Then again in six months","The second one costs more","So it was never cheaper"],"vo":"The cheapest quote is a payment plan for a second project. You pay the small number now, then you pay a bigger number later to fix what the small number could not do, and you lose six months in between. Which means the cheap option is not cheap, it is just earlier.","cap":"You will pay twice. The first payment is just quieter.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Cheap now","Rebuild later","Two payments, six months apart"],"cap":"Cheap work is a deposit on the work you actually needed.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"The cheapest quote is usually a payment plan for a second project.\n\nYou pay the small number now. Then you pay a bigger number later to fix what the small number could not do. And you lose six months in between, which is the part nobody puts in the invoice.\n\nSo it was never cheaper. It was just earlier.\n\nHave you paid twice for anything?","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D11-03","type":"Teach","topic":"Ask what happens after launch","why":"One question that exposes most cheap quotes instantly.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Before you accept any web quote, ask what happens after launch.","beats":["Most stop at delivery","Who updates it","Who fixes the form","Who answers in March"],"vo":"Before you accept any web quote, ask one question: what happens after launch. Ask who updates the price list, who fixes the contact form when it breaks, and who answers the message in March. Most cheap quotes stop at delivery, which is why they are cheap, and then you discover the cost in the third month when you need one line changed.","cap":"The quote ends at launch. The business does not.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["\"What happens after launch?\"","Who updates it?","Who fixes the form?","Who answers in March?"],"cap":"Ask this before you pay anyone for a website. Save it.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Before you accept any website quote, ask one question: what happens after launch?\n\nWho updates the price list? Who fixes the contact form when it breaks? Who answers you in March?\n\nMost cheap quotes stop at delivery. That is why they are cheap, and you find out the real cost in the third month when you need one line changed.\n\nThe quote ends at launch. Your business does not.\n\nWhat would you ask?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D11-04","type":"Entertain","topic":"I'll do it myself with AI","why":"Speaks directly to a real 2026 objection.","tiktok":{"fmt":"Talking head, 23s","hook":"\"I'll do it myself with AI\" costs two months and one relaunch.","beats":["The tool is free","The decisions are not","Which photo, in what order","Two months later you pay someone"],"vo":"I will do it myself with AI costs two months and one relaunch. The tool is free. The decisions are not. Which photo goes first, what the price says, which of six headlines is true, what to delete. Two months in you still have not chosen, so you pay someone to choose, and the free tool turns out to be the most expensive part.","cap":"The tool is free. Deciding what to say is the work.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"instagram":{"fmt":"3-slide carousel","slides":["The tool: free","The decisions: not","Two months, one relaunch"],"cap":"AI will write you six options. It will not pick one for your customer.","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria","#HotTake"],"asset":"Talking head to camera, one jump cut on the disagreement."},"facebook":{"fmt":"Text post","body":"'I'll just do it myself with AI' costs about two months and one relaunch.\n\nThe tool is free. The decisions are not. Which photo goes first. What the price says. Which of six headlines is actually true. What to delete.\n\nTwo months in, you still have not chosen, so you pay someone to choose — and the free tool turns out to be the expensive part.\n\nWhat is the decision you keep avoiding?","tags":["#LagosBusiness","#Easywurld","#SmallBusinessNigeria"]},"ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D11-05","type":"Entertain","topic":"Paid twice for the same website","why":"A concrete case with a real number, labelled as our client's story.","tiktok":{"fmt":"Talking head, 30s","hook":"A business paid twice for the same website. The first one was thirty thousand naira.","beats":["Thirty thousand","Unusable on a phone","Eighteen months gone","Then paid properly"],"vo":"A business paid twice for the same website. The first one was thirty thousand naira and it did not work on a phone, which is where all their customers were. Eighteen months of nobody buying later, they paid properly, and the second site cost three times the first. The first quote was not cheap. It was a deposit.","cap":"₦30,000, then ₦90,000 for the same site. The first quote was a deposit.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"instagram":{"fmt":"Reel + caption","slides":["₦30,000 site","Broken on mobile","18 months, no sales","Then paid properly"],"cap":"The cheapest version of a thing is often the most expensive way to get it.","tags":["#Lagos","#StoryTime","#Easywurld","#SmallBusinessNigeria"],"asset":"Talking head, slow zoom out, no music under the first 10 seconds."},"facebook":{"fmt":"Text post","body":"A business we worked with paid twice for the same website.\n\nThe first one was ₦30,000 and did not work on a phone, which is where all of their customers were. Eighteen months of nobody buying later, they paid properly for the second one.\n\n₦30,000 plus ₦90,000 plus eighteen months equals the most expensive website in this story.\n\nThe first quote was not cheap. It was a deposit.\n\nWhat have you paid twice for?","tags":["#Lagos","#StoryTime","#Easywurld"]},"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D11-06","type":"Teach","topic":"Three questions for any web quote","why":"A takeaway they can use on someone else's pitch today.","tiktok":{"fmt":"Kinetic type, 23s","hook":"Three questions to ask any web quote. Who owns the domain, who fixes it, who pays for hosting.","beats":["The domain is your name","Not theirs","Who fixes it in six months","Get it in writing"],"vo":"Three questions to ask any web quote. Who owns the domain, in whose name, in writing. Who fixes it when it breaks in six months, and how much do they charge. And who pays for hosting every year. If any of those answers is vague, walk away now, because all three become emergencies at the worst possible time.","cap":"Domain, fixes, hosting. Ask all three before you pay anyone.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"instagram":{"fmt":"4-slide carousel","slides":["Who owns the domain?","In whose name?","Who fixes it in 6 months?","Who pays for hosting?"],"cap":"If you cannot answer all three, you do not own your website.","tags":["#SmallBusinessTips","#LagosSME","#Easywurld","#MarketingTips"],"asset":"Kinetic type on cream, one line at a time, mark bottom-right."},"facebook":{"fmt":"Text post","body":"Three questions to ask any website quote:\n\n1. Who owns the domain, in whose name, in writing?\n2. Who fixes it when it breaks in six months, and at what cost?\n3. Who pays for hosting, and how much is it each year?\n\nIf any answer is vague, walk away now. All three become emergencies at the worst possible time.\n\nCan you answer all three about your own site today?","tags":["#SmallBusinessTips","#LagosSME","#Easywurld"]},"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D11-07","type":"Entertain","topic":"A cheap logo is fine. A cheap domain is not.","why":"Separates the thing you can skimp on from the thing you cannot.","tiktok":{"fmt":"Kinetic type, 15s","hook":"A cheap logo is fine. A cheap domain is not.","beats":["Logo can change","Domain is your address","If it is not in your name","You can lose your business"],"vo":"A cheap logo is fine, because you can change a logo in a week. A cheap domain is not, because it is your address. If it is registered in someone else's name, they can take your whole business off the internet with one email, and you have no recourse. Never let anyone else own your name.","cap":"Your logo can change. Your address cannot be taken.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"instagram":{"fmt":"3-slide carousel","slides":["Logo: changeable","Domain: your address","Register it in your name"],"cap":"Do not let a vendor hold the keys to your business.","tags":["#Lagos","#Relatable","#Easywurld","#LagosBusiness"],"asset":"Flat print-style card, one large serif line, one terracotta accent."},"facebook":{"fmt":"Text post","body":"A cheap logo is fine. You can change a logo in a week.\n\nA cheap domain is not fine. It is your address, and if it is registered in someone else's name, they can take your entire business off the internet with one email and you have no recourse.\n\nCheck today: whose name is on your domain?\n\nIf it is not yours, fix it this week. It takes about twenty minutes.","tags":["#Lagos","#Relatable","#Easywurld"]},"ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D11-08","type":"Entertain","topic":"Cheapest or the one who asked questions","why":"Unanimity is the strongest possible evidence.","tiktok":{"fmt":"Street interview, 24s","hook":"I asked: cheapest quote, or the person who asked you the most questions?","beats":["Everyone chose questions","Because questions mean attention","Cheap means template","Same answer every time"],"vo":"I asked people whether they would take the cheapest quote or the one from the person who asked them the most questions. Everyone chose the questions. Every single person. Because being asked questions feels like being understood, and a cheap quote feels like a template. That is what you are competing with, not the number.","cap":"Everyone chose the one who asked questions. Every single person.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"instagram":{"fmt":"Reel + caption","slides":["Cheapest? ","Or asked questions?","Everyone: questions","Unanimous"],"cap":"Questions signal attention. Price signals nothing.","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria","#Easywurld"],"asset":"Handheld, market or street background, real sound, captions burned in."},"facebook":{"fmt":"Text post","body":"I asked people: would you take the cheapest quote, or the one from the person who asked you the most questions?\n\nEveryone chose the questions. Every single person.\n\nBeing asked questions feels like being understood. A cheap quote feels like a template, because it usually is one.\n\nThat is what you are competing with. Not the number.\n\nWhat questions do you ask before quoting?","tags":["#Lagos","#StreetInterview","#SmallBusinessNigeria"]},"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D11-09","type":"Sell","topic":"Cheap on purpose","why":"Owning the low price honestly is more credible than justifying it.","tiktok":{"fmt":"Overhead shot, 27s","hook":"Five thousand naira is cheap on purpose, and here is the honest limit of it.","beats":["It is a template","Not a service","No one will build it for you","That is why it is five"],"vo":"Five thousand naira is cheap on purpose, and here is the limit. It is a template, not a service. Nobody will build anything for you, nobody will answer questions about your specific business, and if you get stuck there is no call. That
