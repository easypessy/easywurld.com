<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27473A">
<title>Easywurld Post Commander</title>
<style>
:root{
  --cream:#FAE7C7; --leaf:#27473A; --deep:#0A4937; --terra:#9E4E2C;
  --ink:#14170F; --paper:#FBF9F4; --line:rgba(39,71,58,.18);
  --ok:#2F6B4F; --card:#FBF9F4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:96px; overscroll-behavior-y:none;
}
.serif{font-family:Georgia,"Times New Roman",serif}
h1,h2,h3{margin:0;font-weight:700;color:var(--deep)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--deep)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{
  background:var(--leaf); color:var(--cream); padding:14px 0 12px;
  position:sticky; top:0; z-index:30; box-shadow:0 2px 0 rgba(0,0,0,.08);
}
header .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-family:Georgia,serif;font-size:19px;letter-spacing:.12em;font-weight:700}
.slogan{font-size:10px;letter-spacing:.16em;opacity:.75;margin-top:2px}
.hd-right{text-align:right;font-size:11px;opacity:.85}
.progress{height:6px;background:rgba(250,231,199,.22);border-radius:99px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--terra);width:0;transition:width .3s}
.pmeta{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;opacity:.9}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
  border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;background:none;border:0;padding:12px 4px 10px;font-size:12px;color:var(--ink);
}
nav.tabs button .ic{display:block;font-size:19px;line-height:1}
nav.tabs button.on{color:var(--deep);font-weight:700}
nav.tabs button.on .ic{color:var(--terra)}

.dayscroll{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.dayscroll::-webkit-scrollbar{display:none}
.daybtn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:7px 11px;font-size:12px;min-width:58px;text-align:center;line-height:1.25;
}
.daybtn b{display:block;font-size:13px;color:var(--deep)}
.daybtn.today{border-color:var(--terra);background:#fff}
.daybtn.done b::after{content:" ✓";color:var(--ok)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:99px;
  padding:6px 12px;font-size:12px;color:var(--deep)
}
.chip.on{background:var(--deep);color:var(--cream);border-color:var(--deep)}

h2.sechead{font-size:15px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
h2.sechead small{font:400 12px/1.3 -apple-system,system-ui,sans-serif;color:#5b6155}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin:10px 0;overflow:hidden
}
.card.done{opacity:.62}
.chead{display:flex;gap:10px;align-items:flex-start;padding:12px 13px}
.badge{
  font-size:10px;letter-spacing:.09em;padding:3px 7px;border-radius:6px;
  background:var(--leaf);color:var(--cream);white-space:nowrap;margin-top:2px
}
.badge.tt{background:#14170F}.badge.ig{background:#9E4E2C}.badge.fb{background:#1D4E89}.badge.li{background:#0A4937}
.time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#5b6155}
.ctitle{font-size:15px;font-weight:600;line-height:1.35;margin-top:3px}
.ctype{font-size:11px;color:#5b6155;margin-top:2px}
.tick{
  margin-left:auto;flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);
  width:30px;height:30px;border-radius:9px;font-size:15px;line-height:1;color:#8a9084
}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cbody{padding:0 13px 13px;border-top:1px dashed var(--line);margin-top:2px}
.blk{margin:12px 0 0}
.blk h4{
  margin:0 0 5px;font-size:11px;letter-spacing:.12em;color:var(--terra);text-transform:uppercase
}
.blk p{margin:0 0 6px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.blk ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.5}
.blk li{margin-bottom:3px}
.beats li{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.tags{font-size:13px;color:var(--deep);word-spacing:3px}
.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font:14px/1.45 inherit;
  background:#fff;resize:vertical;min-height:58px;margin-top:4px}
.copyrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.btn{
  border:1px solid var(--deep);background:var(--deep);color:var(--cream);
  border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600
}
.btn.ghost{background:transparent;color:var(--deep)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.wide{width:100%;text-align:center}
.mini{font-size:12px;color:#5b6155;margin-top:8px;line-height:1.45}
.card.open .cbody{display:block}
.hide{display:none!important}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-size:22px;color:var(--deep);font-family:Georgia,serif}
.tile span{font-size:12px;color:#5b6155}

.helplist{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.helplist li{margin-bottom:7px}
.kbd{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
dialog{border:0;border-radius:14px;padding:0;max-width:520px;width:92%;background:var(--paper)}
dialog::backdrop{background:rgba(10,73,55,.55)}
.dlg{padding:16px}
.dlg h3{font-size:16px;margin-bottom:8px}
.dlg textarea{width:100%;height:190px;border:1px solid var(--line);border-radius:10px;padding:10px;font:14px/1.5 ui-monospace,monospace;background:#fff}
#toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--deep);color:var(--cream);
  padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s
}
#toast.show{opacity:1}
footer{color:#5b6155;font-size:12px;text-align:center;padding:18px 0 4px;line-height:1.6}

.monthgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.monthgrid{grid-template-columns:repeat(3,1fr)}}
.mcell{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;
  text-align:left;display:grid;gap:3px;line-height:1.2
}
.mcell.on{border-color:var(--terra);background:#fff;box-shadow:inset 0 0 0 1px var(--terra)}
.mcell .md{font-weight:700;color:var(--deep);font-size:14px}
.mcell .mw{font-size:11px;color:#5b6155;text-transform:uppercase;letter-spacing:.08em}
.mcell .mn{font-size:11px;color:#5b6155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mbar{display:block;height:5px;border-radius:99px;background:rgba(39,71,58,.14);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.datein{
  border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;
  font:15px/1.2 inherit;color:var(--ink);min-width:170px
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:rgba(39,71,58,.08);padding:1px 5px;border-radius:5px}
.daybtn .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--terra);vertical-align:middle}

</style>
</head>

the person leaves, and they leave quietly, so you never find out you had a visitor.\n\nEverything else is decoration around those three answers. The story about why you started, the list of everything you can do, the mission statement, all of it is decoration. It is not what they asked.\n\nThe Clear Message Workbook is a guided process for writing that one clear sentence, and it includes what to do when your answer keeps changing every month. ₦5,000.\n\nMessage MESSAGE on WhatsApp: 0905 069 0837","tags":[]},"linkedin":{"fmt":"Text post, 08:15","body":"Most positioning problems are not positioning problems. They are missing sentences.\n\nAsk any small business owner what they do and you will get a list: this and that, also this, for those who need that, and occasionally something about their values. Nobody can repeat it back to you. Which means nobody can repeat it to a customer.\n\nStrip it to three answers. What you do. Who it is for. What they should do next. If a customer can say all three after ten seconds, you have a message. If they cannot, no amount of brand work will help.\n\nThe Clear Message Workbook (₦5,000) is a guided process for those three answers, including the part everybody skips: what to do when the answer genuinely changes every month.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liTime":"08:15","ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D6-02","type":"Meme","topic":"Changing your business name every quarter","why":"Belonging. It names the exact behaviour the audience laughs at in themselves.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"Me changing my business name again: NEW NAME, SAME BUSINESS.","beats":["January: new logo","April: new name","July: 'rebranding'","October: back to the first name","Nobody noticed except me"],"vo":"Me changing my business name again. NEW NAME, SAME BUSINESS. January, new logo. April, new name. July, rebranding. October, back to the first name. Nobody noticed except me, and that is nd not like a template\n4. A one-year message review, so you know when to change and when to leave it alone\n\n₦5,000. Digital download. Do it yourself.\n\nMessage MESSAGE on WhatsApp: 0905 069 0837","tags":[]},"linkedin":null,"ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D6-04","type":"Honest","topic":"Nobody is buying your values, they are buying the result","why":"A useful jolt. Separates the emotional belief from what actually converts.","tiktok":{"fmt":"Kinetic type, 24s","hook":"Nobody is buying your values. They are buying the result.","beats":["'We care deeply about quality' is not a reason to buy","Your customer is solving a problem today","Say what the problem is, then say what changes","Values can live on the about page","The first screen has to be about them"],"vo":"Nobody is buying your values. They are buying the result. 'We care deeply about quality' is not a reason to buy anything. Your customer is trying to solve a problem today, probably a small annoying one. Say what the problem is, then say what changes after you help. Your values can live on the about page, where people go once they already like you. The first screen has to be about them.","cap":"Values live on the about page.\nThe first screen has to be about them.","tags":["#HonestBusiness","#MarketingClarity","#Easywurld","#NoHype","#LagosBusiness"],"asset":"Cream, one line at a time, terracotta underline on the last line."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["Nobody is buying your values. They are buying the result.","'We care deeply about quality' is not a reason to buy","Your customer is solving a problem today","Say the problem, then say what changes","Values live on the about page"],"cap":"The first screen has to be about them, not about you.\n\nThe Clear Message Workbook gives you the sentence, and the twenty versions you need to get there, ₦5,000. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#HonestBusiness","#MarketingClarity","#Easywurld","#LagosSME","#NoHype"],"asset":"Plain type on cream, terracotta rule on the last slide."},"facebook":{"fmt":"Feed post","body":"Honest answer, because this one is uncomfortable.\n\nNobody is buying your values. They are buying the result.\n\n'We care deeply about quality' is not a reason to buy anything. 'We are passionate about sustainability' is not a reason to buy anything. Your customer is trying to solve a problem today, usually a small annoying one, and they want to know it goes away.\n\nSo say what the problem is, then say what changes after you help. That is the message.\n\nYour values are not worthless, they are just for the about page, where people go once they already like you. The first screen has to be about them.\n\nThe Clear Message Workbook is the sentence and the twenty versions it takes to get there, ₦5,000.\n\nMessage MESSAGE on WhatsApp: 0905 069 0837","tags":[]},"linkedin":{"fmt":"Text post, 12:15","body":"There is a line in every small business website that makes it worse, and it usually contains the word 'passionate'.\n\nValues do not sell to a stranger. Nobody browsing on a phone is buying your belief system. They are buying the removal of a problem, and they want to know it goes away.\n\nThis is not a case for removing your values from the business. It is a case for putting them where they can do their job, which is the about page, and putting the outcome where the customer is actually standing, which is the first screen.\n\n'Web design for Lagos food businesses' beats 'a team passionate about digital excellence'. The first one has a customer in it. The second one has a feeling.\n\nThe Clear Message Workbook (₦5,000) is a guided process for writing the sentence with the customer in it.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liTime":"12:15","ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D6-05","type":"How-to","topic":"Turn a vague offer into a specific sentence","why":"Craft. Shows the actual edit, which is the part people nev ple language is a strength, not a compromise.","tiktok":{"fmt":"Kinetic type, 22s","hook":"Clarity is not boring. Unclear is.","beats":["Simple is not the same as basic","It is the difference between being understood and being impressive","Your competitor with the complicated words is not winning","They are just being misunderstood","Say it so people can repeat it"],"vo":"Clarity is not boring. Unclear is. Simple is not the same as basic. It is the difference between being understood and being impressive. Your competitor with the complicated vocabulary is not winning, they are just being misunderstood. Say it so that people can repeat it back to you. That is the whole ambition.","cap":"Clarity is not boring. Unclear is.\n\nSay it so people can repeat it back.","tags":["#Copywriting","#MarketingClarity","#Easywurld","#BusinessAdvice","#LagosBusiness"],"asset":"Cream, one line at a time, terracotta underline on the last line."},"instagram":{"fmt":"Static post, 4:5","slides":["Clarity is not boring.\nUnclear is.","Simple is not the same as basic","Understood vs impressive","Your competitor with the big words is not winning","They are just being misunderstood"],"cap":"Say it so that people can repeat it back to you. That is the whole ambition.\n\nThe Clear Message Workbook, ₦5,000. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#Copywriting","#BusinessAdvice","#Easywurld","#LagosEntrepreneur","#MarketingClarity"],"asset":"Statement on cream, terracotta underline on the final line."},"facebook":{"fmt":"Feed post","body":"Clarity is not boring. Unclear is.\n\nSimple is not the same as basic. It is the difference between being understood and being impressive.\n\nYour competitor with the complicated vocabulary is not winning. They are just being misunderstood, and misunderstood does not send a WhatsApp message.\n\nSmall business owners often apologise for being plain. As if plain were a lack of ambition. Being plain is how the answer gets to somebody who is scrolling one, length, what to avoid","Then ask for 3 options, not 1"],"cap":"Also paste one real example of your own writing, so it learns your voice instead of the internet's.\n\nThe Everyday AI Prompt Desk is 50 prompts written for small businesses: replies, product descriptions, proposals, posts, complaints, follow-ups, and the awkward ones. ₦5,000. Message PROMPTS on WhatsApp: 0905 069 0837.","tags":["#AIforBusiness","#ProductivityTips","#Easywurld","#LagosSME","#DigitalProducts"],"asset":"Contrast between bad and good prompt, terracotta on the good one."},"facebook":{"fmt":"Feed post","body":"Your AI assistant is not the problem. Your prompt is.\n\nDo not say: 'write me a caption.'\n\nSay: 'write a caption for a Lagos bakery, warm tone, two lines, no emoji, mention Saturday deliveries.'\n\nGive it five things: who it is for, where they are, the tone, the length, and what to avoid. Then paste one real example of how you write, so it learns your voice and not the internet's.\n\nAnd ask for three options, not one. The first option is never the one you wanted, and if you only asked for one you will spend longer editing than writing.\n\nThe Everyday AI Prompt Desk has 50 of these, written for small businesses, including the awkward ones. ₦5,000.\n\nMessage PROMPTS on WhatsApp: 0905 069 0837","tags":[]},"linkedin":{"fmt":"Text post, 08:15","body":"Most complaints about AI writing are actually complaints about prompting.\n\n'Write me a caption' returns the average of the internet. It has no idea who you are, who you are writing to, what you sell, how long the answer should be, or what you have decided you never want to say again.\n\nGive it five things instead: audience, location, tone, length, and what to avoid. Then paste one genuine example of your own writing, because a single real sample teaches voice better than three paragraphs of instruction.\n\nAsk for three options, not one. The first answer is a rough guess, and giving yourself options is how you keep your own judgement in the loop instead of accepting the machine's first move.\n\nWe wrote 50 of these prompts for small businesses: replies, descriptions, proposals, posts, complaints, follow-ups. The Everyday AI Prompt Desk is ₦5,000.\n\nWhatsApp: 0905 069 0837. Message PROMPTS."},"liTime":"08:15","ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D7-02","type":"Meme","topic":"Asking AI to write your whole business for you","why":"Relatable and slightly wicked. Everyone has done it and been disappointed.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"Me: 'write my entire business strategy' AI: ... Me: 'why does this sound like a textbook'","beats":["Gave it my business name","Got back a 12 point plan","Point 4: 'establish your brand identity'","I still do not know who my customer is","The blank page is still mine"],"vo":"Me: write my entire business strategy. AI: here is a twelve point plan. Point four, establish your brand identity. I still do not know who my customer is, and the blank page is still mine. The tool does not know your business. It knows a lot of businesses. You have to bring the part only you know.","cap":"Point 4: 'establish your brand identity' 😭\n\nIt does not know your business. It knows a lot of businesses.","tags":["#AIforBusiness","#LagosBusiness","#Easywurld","#Meme","#SmallBusinessNigeria"],"asset":"Four-panel meme, cream and deep green, one terracotta accent."},"instagram":{"fmt":"Static meme post, 4:5","slides":["Me: 'write my entire business strategy'","AI: here is a 12 point plan","Point 4: 'establish your brand identity'","I still do not know who my customer is","The blank page is still mine"],"cap":"It does not know your business. It knows a lot of businesses.\n\nThe 50 prompts in the Everyday AI Prompt Desk are written to fill in the part only you know, ₦5,000. Message PROMPTS on WhatsApp: 0905 069 0837.","tags":["#Meme","#AIforBusiness","#Easywurld","#LagosSME","#ProductivityTips"],"asset":"Flat meme, cream and deep green onl e draft, cut half, add one real detail","That is the workflow, not a cheat"],"vo":"The best AI output is the one you had to fix. If it came out perfect, nobody would believe it, because perfect and generic are the same thing. Take the draft, cut half of it, and add one real detail that only you have. The customer who fixes your generator at 11pm, the price you charged last year, the thing you always forget to bring. That is the workflow, and it is not a cheat, it is editing.","cap":"Perfect and generic are the same thing.\n\nTake the draft, cut half, add one real detail.","tags":["#HonestBusiness","#AIforBusiness","#Easywurld","#NoHype","#LagosBusiness"],"asset":"Cream, one line at a time, terracotta underline on the last line."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["The best AI output is the one you had to fix.","If it came out perfect, nobody would believe it","Perfect and generic are the same thing","Cut half, add one real detail","That is the workflow, not a cheat"],"cap":"The detail only you have is the part the machine cannot write for you, and it is the part people reply to.\n\nThe Everyday AI Prompt Desk gives you the draft and the five ingredients, ₦5,000. Message PROMPTS on WhatsApp: 0905 069 0837.","tags":["#HonestBusiness","#AIforBusiness","#Easywurld","#LagosSME","#NoHype"],"asset":"Plain type on cream, terracotta rule on the last slide."},"facebook":{"fmt":"Feed post","body":"Honest answer: the best AI output is the one you had to fix.\n\nIf it came out perfect, nobody would believe it, because perfect and generic are the same thing. Your customers can tell, even if they cannot name it.\n\nSo take the draft, cut half of it, and add one real detail that only you have. The customer who fixes your generator at 11pm. The price you charged last year. The thing you always forget to bring. That is the part people reply to.\n\nThat is the workflow, and it is not a cheat, it is editing. It is also the part nobody tells you about AI, which is why sinesses\" on our page.\n\nWe have built 49 concept projects. Every one of them says so on the site.\n\nSaying no to a number you cannot evidence is a business trait, not a personality trait.","tags":["#Easywurld","#SmallBusinessNigeria","#HonestyInBusiness","#LagosBusiness"],"asset":"Talking head, plain shirt, warm light, no graphics except a small caption bar with the brand mark."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["We will not put this\non our own page:","\"Trusted by 200+ businesses\"","We have not served 200 businesses.","We have built 49 concept projects.\nEvery one is labelled a sample.","Saying no to a number you\ncannot evidence is a business\ntrait, not a personality trait."],"cap":"We have built 49 concept projects for our portfolio. Every single one of them is labelled as a concept project or sample build, on the page itself, not in small print at the bottom.\n\nThat is not modesty. It is the only way a claim stays useful.\n\nEverything in our portfolio is a sample build. Nothing is presented as client work.","tags":["#Easywurld","#HonestBusiness","#LagosSME","#SampleBuild"],"asset":"Cream slides, deep green serif headline, terracotta rule under the quoted line, mark bottom right."},"facebook":{"fmt":"Feed post","body":"\"Trusted by 200+ businesses.\"\n\nWe will not put that on our page. We have not served 200 businesses. We have built 49 concept projects for our portfolio, and every one of them says \"concept project\" or \"sample build\" right on the page, not buried in a footer.\n\nI know that looks modest for a studio. It is the opposite. A buyer who catches one inflated number stops believing every other number on the site.\n\nSaying no to a claim you cannot evidence is a business trait. It is how the rest of your claims stay useful.\n\nIf you want the same standard applied to your own page, send us the link. Within 24 hours you get a voice note and three points: what is costing you enquiries, what to fix first, and what to leave ems. No prices written down anywhere. Photos taken on a phone in bad light, in the evening, with the shop sign glowing behind. We had to invent every single line, which is exactly why the sample looks the way it does.\n\nFor a real restaurant, that inventory is the first week of work. Not the last. People expect the design to be the hard part, and it usually is not.\n\nEvery build in our portfolio is a concept project, labelled as such on the site.\n\nIf your page is missing the obvious things, we will tell you which ones. The Landing Page Kit, ₦5,000, has the prompts. Message PAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 17:15","body":"A lesson from a sample build, because it is the same lesson that shows up in real work.\n\nWe built a sample neighbourhood restaurant site. The hard part was not the layout, the typography or the code.\n\nIt was the menu.\n\nForty items. No prices written down anywhere. Photos shot on a phone in bad light. To build the sample we had to invent every line, and that constraint is the only reason the finished page looks the way it does.\n\nWith a real restaurant, that inventory is week one. It always takes longer than anyone expects, and it is where the design decisions actually come from.\n\nThis is why our process starts with Understand, and why it is a separate step. The hardest part of a website is usually the content nobody has collected yet.\n\nAll our portfolio builds are concept projects, labelled as such. Message PAGE on WhatsApp: 0905 069 0837 if you want the structure for your own offer page. ₦5,000."},"liTime":"17:15","ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D8-10","type":"Offer","topic":"The One-Offer Landing Page Kit, what is actually inside","why":"Offer. The file list removes the uncertainty of buying something you cannot see.","tiktok":{"fmt":"Kinetic type with voiceover, 30s","hook":"Here is exactly what is inside the Landing Page Kit. Four files, no mystery.","beats":["1 · tsApp, email, form.","Your visitor does four things\nfor nobody.\n\nOne ask per page."],"cap":"One ask per page. And make it small enough to feel safe.\n\nIf you want a page that does that, the One-Offer Landing Page Kit has an offer block, a proof block and a single closing ask, in that order. ₦5,000. Message PAGE on WhatsApp: 0905 069 0837.\n\nOr send us your link and get a free 24-hour review.","tags":["#ConversionTips","#Easywurld","#LagosSME","#SmallBusinessTips"],"asset":"Cream slides, deep green serif, terracotta rule under the last line."},"facebook":{"fmt":"Feed post","body":"If your page gets views and no enquiries, here is where I would look first.\n\nNot the traffic. The traffic is probably fine.\nNot the offer. The offer is probably fine.\n\nThe ask.\n\nMost pages ask for four things. Call us. WhatsApp us. Email us. Fill the form. Your visitor has to do four things for nobody, so they do none of them.\n\nOne ask per page. And make it small enough that it feels safe to click. \"Ask for the price\" beats \"Request a quote\" for a first-time visitor, because one costs them nothing.\n\nThis is the whole argument of the One-Offer Landing Page Kit, ₦5,000, one offer and one action per page.\n\nMessage PAGE on WhatsApp: 0905 069 0837.\n\nOr send me your link first. Within 24 hours you get a voice note and three points, free, no sales call.","tags":[]},"linkedin":{"fmt":"Text post, 20:15 (optional)","body":"A symptom worth naming: traffic, no enquiries.\n\nIn our experience the traffic is rarely the problem, and the offer is rarely the problem. The ask is.\n\nMost pages ask for four things. Call. WhatsApp. Email. Form. The visitor has to choose one, commit effort, and reveal intent to a business they do not know yet. Most of them will not, and they are not being difficult. They are being sensible about a first contact.\n\nOne ask per page. Make it small. \"Ask for the price\" is easier to click than \"Request a quote\", and it costs the customer nothing to find t is a marketing\nstrategy, really?","It is a set of decisions.","1 · Who you are for\n2 · What you say to them","3 · Where you say it\n4 · What happens after","If a document does not answer\nthose, it is decoration."],"cap":"The first two are the hard ones. If you cannot write who you are for and what you say to them without guessing, more posting will not fix it.\n\nThat is the first step in the process we call Understand, and it is why the strategy work comes before the design work.\n\nIf you want to do it yourself, the Lagos Local Visibility Starter gives you the questions in order for your own area and your own customers. ₦5,000. Message LOCAL on WhatsApp: 0905 069 0837.","tags":["#DigitalMarketing","#Easywurld","#LagosSME","#MarketingStrategy"],"asset":"Cream slides, deep green serif headline, terracotta number markers."},"facebook":{"fmt":"Feed post","body":"What is a marketing strategy, really?\n\nHere is the honest version. It is a set of decisions:\n\n1. Who you are for.\n2. What you say to them.\n3. Where you say it.\n4. What happens after they reply.\n\nThat is the whole thing. It is not a mood board, and it is not a calendar with pictures in it.\n\nIf a strategy document does not answer those four, it is decoration. And if you cannot answer the first two without guessing, that is the real work. No amount of posting fixes a message that has not been decided yet.\n\nWe build these as projects. If you would rather run the process yourself, the Lagos Local Visibility Starter gives you the questions in order, for your area and your customers. ₦5,000.\n\nMessage LOCAL on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 08:15","body":"Most marketing strategy work is decoration, and it is easy to spot.\n\nA strategy answers four questions:\n\nWho are you for?\nWhat do you say to them?\nWhere do you say it?\nWhat happens when they respond?\n\nIf a document does not answer those, there is a deck of slides where the strategy should be. That is not a criticism of the deck. The issue is that the questions were skipped, and the work downstream inherits the gap.\n\nThe first two are where most small businesses get stuck, and it is worth being honest about why: writing down who you are for usually means admitting you serve a smaller group of people than you hoped.\n\nThat is not a limitation. It is the decision that makes the rest work.\n\nWe write these as projects, and we also sell a self-guided version: the Lagos Local Visibility Starter, ₦5,000, the same questions in order for your own market.\n\nWhatsApp: 0905 069 0837. Message LOCAL."},"liTime":"08:15","ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D9-02","type":"Meme","topic":"Seven agencies, seven invoices, one business","why":"Relatable. Everyone knows this pain, and it sets up the point that the seven services work as one.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"One business. Seven suppliers.","beats":["The designer does not talk to the copywriter","The copywriter does not know the price","The ads person used the old logo","Nobody owns the result"],"vo":"One business, seven suppliers. The designer never speaks to the copywriter. The copywriter does not know the price. The ads person used last year's logo. And nobody owns the result. That is not a complaint about the suppliers. It is what happens when seven people work on one thing without a shared plan. Which is why we keep the seven services in one place.","cap":"One business. Seven suppliers.\n\nNobody owns the result.\n\nThat is what happens when the plan, the design, the words and the systems are built separately. We keep them together.","tags":["#Meme","#SmallBusinessNigeria","#Easywurld","#LagosBusiness"],"asset":"Four-panel meme, cream background, deep green type, terracotta panel borders."},"instagram":{"fmt":"Static meme post, 4:5","slides":["One business. Seven suppliers.","The designer never speaks\nto the copywriter.","The copywriter does not\nknow the price. nce we say to people, and we mean it.","beats":["\"This is not a good fit for us\"","We say it before the proposal","Because after the proposal\nit is a bill","A no now saves both of us"],"vo":"Here is the sentence we say to people, and we mean it: this is not a good fit for us. We say it before the proposal, not after. After the proposal it becomes a bill, and nobody wants a bill for a bad idea. We have turned down work that would have paid. The business only works if the work works, and a client who is not served well stops sending people.","cap":"\"This is not a good fit for us.\"\n\nWe say it before the proposal, not after. After the proposal it is a bill.\n\nA no now saves both of us the trouble.","tags":["#Easywurld","#HonestBusiness","#SmallBusinessNigeria","#ClientWork"],"asset":"Talking head, plain shirt, warm light, small caption bar with the mark."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["\"This is not a good fit\nfor us.\"","We say it before\nthe proposal.","After the proposal,\nit is a bill.","We have turned down work\nthat would have paid.","A no now saves both of us\nthe trouble."],"cap":"A client who is not served well stops sending people. That is the whole business, so it is not good business to take work you cannot do well.\n\nIf we think you need something else, we will say so, including pointing you to a free tool or a cheaper route. Ask us on WhatsApp: 0905 069 0837.","tags":["#Easywurld","#HonestBusiness","#LagosSME","#WorkingTogether"],"asset":"Cream slides, deep green serif, terracotta quote mark on slide 1."},"facebook":{"fmt":"Feed post","body":"Here is a sentence we actually say to people, and we mean it:\n\n\"This is not a good fit for us.\"\n\nWe say it before the proposal, not after. After the proposal, it becomes a bill, and nobody wants a bill for a bad idea.\n\nWe have turned down work that would have paid. It is not a marketing line. A client who is not served well stops sending people, and that is the whole business, age asks: why now.\n\nOne offer. One action. One page, one job.","tags":["#LandingPages","#Easywurld","#SmallBusinessNigeria","#ConversionTips"],"asset":"Cream background, two contrasting lines, terracotta line under the second."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["A landing page and a home\npage are not the same thing.","A home page asks:\nwho are you?","A landing page asks:\nwhy now?","One offer. One action.","One page, one job.\nThree offers and two buttons\nis a home page pretending."],"cap":"If you have a campaign, a new offer, a product launch or an event, it needs a landing page, not a section of your home page.\n\nThe One-Offer Landing Page Kit gives you the structure and 12 fill-in copy blocks. ₦5,000, message PAGE on WhatsApp: 0905 069 0837.","tags":["#LandingPages","#Easywurld","#LagosSME","#DigitalDownloads"],"asset":"Cream slides, deep green serif, terracotta underline on the last slide."},"facebook":{"fmt":"Feed post","body":"A landing page and a home page are not the same thing, and mixing them is a common waste.\n\nA home page asks: who are you.\nA landing page asks: why now.\n\nOne offer. One action. One page, one job. No navigation menu, no three other services, no second button competing with the first.\n\nWhen a page has three offers and two buttons and a nav bar, it is a home page pretending to be a landing page, and it converts like one.\n\nIf you are running a campaign, launching something, or selling one specific thing, it needs its own page.\n\nThe One-Offer Landing Page Kit is ₦5,000: the structure, twelve fill-in copy blocks, an objection block, and a worksheet with a prompt beside every section. Message PAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D9-07","type":"Offer","topic":"The Website Launch & Care Handbook, and who it is for","why":"Offer. It is the first time this pack is pitched, and it opens up the website project conversation.","tiktok"  numbered list, mark bottom right."},"facebook":{"fmt":"Feed post","body":"Building a website? Read this before you pay anyone.\n\nThe Website Launch & Care Handbook, ₦5,000, digital download:\n\n1. The order of decisions. Goal, pages, content, domain, platform. In that order, because the order you brief a designer in decides half the work.\n\n2. Domain and hosting, in plain language. What each one is for, what it costs, and how to avoid buying the same thing twice.\n\n3. How to compare quotes. What to ask, what a vague quote is hiding, and the questions that separate a serious quote from a cheap one.\n\n4. Who owns what. Accounts, domains, code, content. The bit people discover too late.\n\n5. A launch-day checklist and a 30-minute monthly care routine, because websites rot quietly.\n\n6. A ready-to-fill website brief and an Excel tracker with launch tasks, a care log and renewal reminders.\n\nIt does not include a website. We build those as projects, scoped and quoted after a call.\n\nMessage LAUNCH on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 17:15","body":"Most website projects do not fail because of the technology. They fail because the order of decisions was wrong.\n\nGoal, then pages, then content, then domain, then platform. If you brief a designer before the first one is settled, you pay twice for the same page.\n\nWe sell the self-guided version of this: the Website Launch & Care Handbook, ₦5,000. It covers the order of decisions, domain and hosting in plain language, how to brief a designer, how to compare quotes, who should own what, a launch-day checklist, and a 30-minute monthly care routine.\n\nIt is deliberately neutral about tools. Website builders, WordPress and custom builds all have a place. The handbook explains which suits whom so you choose on your needs and budget, not on whoever you spoke to first.\n\nWe build sites as projects too, scoped after a call. The handbook is for the people who want to run it themselves.\n\nWhatsApp: 0905 069 0837. Message LAUNCH."},"liTime":"17:15","ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D9-08","type":"Relatable","topic":"The client who says just make it look nice","why":"Relatable. Everyone in the audience has been on both sides of this conversation.","tiktok":{"fmt":"Talking head, 25s","hook":"The brief that breaks every project: just make it look nice.","beats":["\"Make it look nice\"","That is not a brief","That is a hope","A brief says: for whom, what action","That is the whole difference"],"vo":"The brief that breaks every project: just make it look nice. That is not a brief, that is a hope. A brief says who it is for, what action you want, and what they are worried about. With those three, I can build. Without them, I am guessing, and guessing is how people end up unhappy with a site that did what I asked.","cap":"\"Just make it look nice\" is not a brief. It is a hope.\n\nA brief says: for whom, what action, and what are they worried about.\n\nThree lines. That is all it takes to get good work.","tags":["#Easywurld","#WebDesign","#SmallBusinessNigeria","#CreativeProcess"],"asset":"Talking head, plain shirt, warm light, terracotta caption text."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["The brief that breaks\nevery project:","\"Just make it look nice.\"","That is not a brief.\nThat is a hope.","A brief says: for whom,\nwhat action, what worry.","Three lines is all it takes\nto get good work."],"cap":"The Website Launch & Care Handbook includes a ready-to-fill website brief, so you do not have to write one from a blank page.\n\n₦5,000, message LAUNCH on WhatsApp: 0905 069 0837.","tags":["#Easywurld","#WebDesign","#LagosSME","#SmallBusinessTips"],"asset":"Cream slides, deep green serif, terracotta quote mark."},"facebook":{"fmt":"Feed post","body":"The brief that breaks every project: \"just make it look nice.\"\n\nThat is not a brief. It is a hope. I cannot build a page from a hope, and when I try, I guess. And guessing is how you end up with a site you are unhappy with, because I did what you asked and what you asked was a mood.\n\nA brief needs three lines:\n\n1. Who it is for.\n2. What action you want them to take.\n3. What they are worried about, that you need to answer on the page.\n\nThat is genuinely it. Three lines, and the design decisions make themselves.\n\nIf you are building a site soon, the Website Launch & Care Handbook has a ready-to-fill brief and a tracker for the rest of the launch. ₦5,000, message LAUNCH on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"19:00","igTime":"19:30","fbTime":"19:30"},{"id":"D9-09","type":"Teach","topic":"Service four: what a business system actually is","why":"Teach. It makes the least familiar service on the list concrete, in terms a small business owner can picture.","tiktok":{"fmt":"Kinetic type with voiceover, 30s","hook":"A business system is not software. It is what happens when nobody is watching.","beats":["What happens at 10pm","What happens on a Monday","Who does what, and when","And what it is allowed to say no to"],"vo":"A business system is not software. It is what happens when nobody is watching. What happens at ten at night when somebody sends a WhatsApp. What happens on Monday morning when a week of orders arrived. Who does what, and when. And what the system is allowed to say no to. If you cannot describe that out loud, you do not have a system, you have a habit that depends on you being awake.","cap":"A business system is not software. It is what happens when nobody is watching.\n\nWhat happens at 10pm. What happens on Monday. Who does what, and when. And what it is allowed to say no to.","tags":["#BusinessSystems","#Easywurld","#SmallBusinessNigeria","#Automation"],"asset":"Cream background, four lines, terracotta tick on the last, mark bottom right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["A business system\nis not software.","It is what happens\nwhen nobody is watching.","What happens at 10pm","What happens on Monday,\nwho does what, and when","And what it is allowed\nto say no to."],"cap":"The Chat-to-Customer Playbook is the self-guided version of this for one part of your business: the chat. Reply flow, scripts, a tracker, and a follow-up rhythm. ₦5,000, message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#BusinessSystems","#Easywurld","#LagosSME","#WhatsAppBusiness"],"asset":"Cream slides, deep green serif, terracotta rule under the last line."},"facebook":{"fmt":"Feed post","body":"A business system is not software. I want to be clear about that, because the word makes people think of expensive tools.\n\nA business system is what happens when nobody is watching.\n\nWhat happens at 10pm when a WhatsApp comes in. What happens on Monday morning when a week of orders arrived. Who does what, and when. And what the system is allowed to say no to, because a system that answers everything is a system that lies.\n\nIf you cannot describe that out loud, you do not have a system. You have a habit that depends on you being awake and in a good mood.\n\nThe Chat-to-Customer Playbook does this for one part of a business: the chat. Reply flow, 36 scripts, a tracker, and a follow-up rhythm. ₦5,000, message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 20:15 (optional)","body":"A business system is not software.\n\nIt is what happens when nobody is watching.\n\nWhat happens at 10pm when an enquiry arrives. What happens on Monday morning when a week of orders have landed. Who does what, and when. And what the system is allowed to say no to.\n\nThat last one matters more than it sounds. A system that answers everything is a system that eventually lies, because it cannot be right about the thing it does not know. Deciding what the assistant refuses, before deciding what it does, is the difference between a useful system and an expensive embarrassment.\n\nWe design these as projects: written workflow, the conversation re unhappy with, or no website and a social page instead, both are fine.\n\nSend your link on WhatsApp: 0905 069 0837.","tags":["#Easywurld","#FreeReview","#LagosSME","#SmallBusinessTips"],"asset":"Cream slides, deep green serif, terracotta rule, mark bottom right."},"facebook":{"fmt":"Feed post","body":"Before you buy anything from us, let us look at your page. Free.\n\nSend three things on WhatsApp: your link, your business name, and one line about what you sell.\n\nWithin 24 hours you get a voice note and three points:\n\n1. What is costing you enquiries.\n2. What to fix first.\n3. What to leave alone.\n\nNumber three is the one people skip, and usually it is the biggest. Most pages need less work than people assume. If your social page is doing the job, we will say so.\n\nNo charge. No sales call. No list, no spam. One review per business, and it stays free while we build our own record.\n\nSend your link: WhatsApp 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D9-11","type":"Story","topic":"The first question we ask, and why it is not about money","why":"Story. It shows the method behind the work, which is what a careful buyer is buying.","tiktok":{"fmt":"Talking head, 30s","hook":"The first question we ask a new client is not about budget.","beats":["It is: what changed?","Something changed, or they would not call","It is usually smaller than they think","And it is never the website"],"vo":"The first question we ask a new client is not about budget. It is: what changed? Something changed, or you would not have called. And when we dig, it is usually smaller than they think. It is never the website. It is that a competitor opened, or a price went up, or a whole batch of people had a bad experience. The website gets the blame because the website is the thing they can see. The real problem is usually somewhere else, and finding it is the job.","cap":"The first question we ask a new client is not about budget.\n\nIt is: what changed?\n\nSomething changed, or you would not have called. It is rarely the website. It is usually something smaller and less visible.","tags":["#Easywurld","#SmallBusinessNigeria","#LagosBusiness","#Strategy"],"asset":"Talking head, plain shirt, warm light, brand mark lower right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["The first question we ask\nis not about budget.","It is: what changed?","Something changed, or you\nwould not have called.","It is usually smaller\nthan they think.","And it is rarely the website."],"cap":"The website gets the blame because the website is the thing they can see. The real problem is usually somewhere else, and finding it is most of the job.\n\nIf you want that answered for your own business, the free review does it in 24 hours. WhatsApp: 0905 069 0837.","tags":["#Easywurld","#LagosSME","#Strategy","#SmallBusinessTips"],"asset":"Cream slides, deep green serif, terracotta rule on slide 2."},"facebook":{"fmt":"Feed post","body":"The first question we ask a new client is not about budget. It is not even what they want built.\n\nIt is: what changed?\n\nSomething changed, or they would not have called us. And when we dig, it is almost always smaller than they expected. It is rarely the website. It is usually that a competitor opened, or a price went up, or a whole batch of people had a bad experience somewhere else entirely.\n\nThe website gets the blame because the website is the thing they can see. The real problem is usually somewhere you cannot photograph.\n\nFinding that is the job. The rest is the build.\n\nIf you want that answered for your own business, send us your link. Within 24 hours you get a voice note and three points, free, no sales call. WhatsApp: 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"21:30","igTime":"21:15","fbTime":"21:45"}],"date":{"iso":"2026-10-27","day":27,"month":"Oct","year":2026,"weekday":"Tuesday","label":"Tuesday 27 Oct"},"short":"27 Oct"},{"day":10,"label":"Day 10 · Wednesday","theme":"Saying the number out loud","offer":"The Clear Message Workbook · MESSAGE","posts":[{"id":"D10-01","type":"Teach","topic":"How to set a price without apologising for it","why":"Teach. Naming the three parts of a price answer gives them language for the next enquiry today.","tiktok":{"fmt":"Kinetic type with voiceover, 25s","hook":"You should not apologise when you give a price. Here is the three-part answer.","beats":["1 · The number","2 · What it includes","3 · The next step","No apologising, no justifying"],"vo":"You should not apologise when you give a price. Not sorry, not just, not the price is a bit. Three parts: the number, one line on what it includes, and the next step. And no justifying. The moment you explain the price, you tell them it is too high. Just say it, say what is inside, and ask the question that keeps the conversation alive.","cap":"Never apologise when you give a price.\n\n1 · The number\n2 · What it includes, one line\n3 · The next step\n\nThe moment you justify a price, you tell the customer it is too high.","tags":["#Pricing","#SmallBusinessNigeria","#Easywurld","#LagosBusiness"],"asset":"Cream background, three numbered lines, terracotta tick on the third."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["Never apologise\nwhen you give a price.","1 · The number","2 · What it includes\n(one line)","3 · The next step","The moment you justify a price,\nyou tell them it is too high."],"cap":"The Clear Message Workbook has 30 message templates for the moments where you have to say something out loud: the price, the delay, the no, the apology. ₦5,000, message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#PricingTips","#Easywurld","#LagosSME","#Copywriting"],"asset":"Cream slides, deep green serif, terracotta number markers."},"facebook":{"fmt":"Feed post","body":"Never apologise when you give a price.\n\nNot \"sorry, it is a bit\". Not \"the price is 45,000 but\". Not \"it is quite expensive but\".\n\nThree parts, in this order:\n\n1. The number.\n2. One line on what it includes.\n3. The next step.\n\n\"The Ankara set is ₦18,000. It is tailored to your size and ready in five days. Would you like me to take your measurements now?\"\n\nThe moment you start justifying a price, you have told the customer it is too high. Saying the number, saying what is inside, and asking a question takes five seconds and does not argue with anyone.\n\nThe Clear Message Workbook, ₦5,000, has 30 templates for the moments where you have to say something out loud. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 08:15","body":"A small habit with a large effect: stop apologising when you quote.\n\n\"Sorry, it is 45,000 but...\" has started a sentence in a way that is already working against you. The word \"but\" tells the buyer to look for the reason the number is wrong.\n\nThree parts instead:\n\nThe number. One line on what it includes. The next step.\n\n\"The Ankara set is ₦18,000. Tailored to your size, ready in five days. Shall I take your measurements?\"\n\nThe reason this works is not confidence theatre. Apologising adds information the buyer did not ask for: that the price is at the edge of what you consider acceptable. Once they know that, they anchor to it.\n\nWe put 30 versions of these, for prices, delays, difficult no's and apologies, into the Clear Message Workbook, ₦5,000. It does not write the messages for you. It gives you the sentences so you stop starting from a blank page at 11pm.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liTime":"08:15","ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D10-02","type":"Meme","topic":"The customer who says it is too expensive","why":"Relatable. Everyone has heard this price line, and laughing at it together is the fastest way to earn a share.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"Customer: it is too expensive","beats":["Me: how much were you hoping to spend?","Customer: I do not know","Me: it is ₦18,000","Customer: that is fine"],"vo":"Customer says it is too expensive. I ask how much they were hoping to spend. They say they do not know. I tell them it is eighteen thousand naira. They say that is fine. The price was never the problem. The problem was that nobody ever asked, so they had nothing to compare it to.","cap":"\"It is too expensive.\"\n\n\"How much were you hoping to spend?\"\n\"I do not know.\"\n\nMost of the time, the price was never the problem. Nobody asked.","tags":["#Meme","#Pricing","#Easywurld","#SmallBusinessNigeria"],"asset":"Four-panel meme, cream background, deep green type, terracotta panel on the last line."},"instagram":{"fmt":"Static meme post, 4:5","slides":["Customer: it is too expensive","Me: how much were you\nhoping to spend?","Customer: I do not know","Me: it is ₦18,000","Customer: that is fine","The price was never the problem.\nNobody asked."],"cap":"The first question after a price objection is the one that changes the conversation.\n\nThe Clear Message Workbook, ₦5,000, has 30 templates for moments like this. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#Meme","#Easywurld","#PricingTips","#LagosSME"],"asset":"Two-panel meme, cream and deep green, no stock imagery."},"facebook":{"fmt":"Feed post","body":"Customer: it is too expensive.\n\nMe: how much were you hoping to spend?\nCustomer: I do not know.\nMe: it is ₦18,000.\nCustomer: that is fine.\n\nI have had this conversation enough times to know. The price was almost never the problem. The problem was that nobody ever asked, so the customer had nothing to compare it to. \"Too expensive\" means \"I have no idea what this should cost, and I am uncomfortable saying that.\"\n\nAsk what they expected. Then say your number. Then let them decide.\n\nThirty templates for moments like this, plus the rest of the messages you have to say out loud, are in the Clear Message Workbook, ₦5,000. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D10-03","type":"Teach","topic":"When to raise your price, and how to say it","why":"Teach. Raising a price is a fear for small business owners, and the trigger point settles it.","tiktok":{"fmt":"Kinetic type with voiceover, 30s","hook":"Three signs you should raise your price. Most businesses need this yesterday.","beats":["1 · You are turning work away","2 · You dread the quote","3 · Your last three jobs took longer","Raise it small, then raise it again"],"vo":"Three signs you should raise your price. One, you are turning work away. Two, you dread writing the quote. Three, your last three jobs took longer than they should. Any one of those and your price is wrong. When you do raise it, do not double it. Raise it by twenty percent on new work only, keep the old price for old clients, and say nothing about it. The increase is not a speech. Nobody is owed an explanation for your price.","cap":"Three signs it is time to raise your price:\n\n1 · You are turning work away\n2 · You dread writing the quote\n3 · The last three jobs took too long\n\nRaise it 20%. New work only. Say nothing.","tags":["#Pricing","#FreelanceLagos","#Easywurld","#SmallBusinessNigeria"],"asset":"Cream background, three numbered lines, terracotta tick, mark bottom right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["Three signs it is time to\nraise your price.","1 · You are turning work away","2 · You dread writing the quote","3 · The last three jobs\ntook too long","Raise it 20%.\nNew work only.\nSay nothing."],"cap":"Nobody is owed an explanation for their price. But people are owed a price that reflects the work.\n\nThe Clear Message Workbook has the templates for the conversation after the increase, including the reply when someone says it used to be less. ₦5,000, message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#PricingTips","#Easywurld","#LagosSME","#FreelanceBusiness"],"asset":"Cream slides, deep green serif, terracotta numbers."},"facebook":{"fmt":"Feed post","body":"Three signs you should raise your price.\n\n1. You are turning work away.\n2. You dread writing the quote.\n3. Your last three jobs took longer than they should.\n\nAny one of those and your price is wrong. Not your confidence, not your marketing. The price.\n\nWhen you raise it, do not double it. That is a panic move and it costs you clients you could have kept. Raise it by twenty percent, apply it to new work only, keep the old price for the people already in, and say nothing about it.\n\nThe increase is not a speech. Nobody is owed an explanation for what your work costs. And the customers who leave over twenty percent were never going to be easy to work with.\n\nThe Clear Message Workbook, ₦5,000, has 30 templates for the messages you have to say out loud, including the reply when someone tells you it used to be less. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 12:15","body":"Most small businesses are underpriced, and they know it, and they keep the price anyway.\n\nThe three signals I watch for:\n\nYou are turning work away. You dread writing the quote. Your last three jobs took longer than they should.\n\nAny one of those and the price is wrong. And notice that none of the signals are about confidence. The business owner is not convinced they deserve more. The work says otherwise, and the work is the thing being paid for.\n\nHow to do it: raise by twenty percent, not double. New work only, keep the old price for existing clients, and say nothing. An increase is not a speech. Nobody is owed an explanation for what your work costs.\n\nThe template for the awkward reply, when someone tells you it used to be less, is one of 30 in the Clear Message Workbook, ₦5,000.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liTime":"12:15","ttTime":"11:30","igTime":"12:30","fbTime":"12:00"},{"id":"D10-04","type":"Honest","topic":"We are not going to tell you to post more","w ding them costs more than the words ever would.\n\nThe Clear Message Workbook, ₦5,000, has 30 of them in plain English, each with a note on when to use it and a fill-in version so the language stays yours. It also covers the messages people avoid because they sound too cold, and includes a one-page checklist for anything difficult.\n\nIt does not create customers. It stops you from losing the ones you already have, in a sentence you did not want to write.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liTime":"16:15","ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D10-06","type":"Relatable","topic":"The quote you wrote at midnight and regretted","why":"Relatable. A specific small moment of real life, told plainly, builds affection for the brand.","tiktok":{"fmt":"Talking head, 25s","hook":"I wrote a quote at midnight once. It is still out there.","beats":["It was fine, actually","That was the problem","I priced it to be safe","Safe got me three more months of fear"],"vo":"I wrote a quote at midnight once. It is still out there, and it was fine, which was the problem. I priced it to be safe. Safe got me three more months of not saying the number I actually thought. Nobody sees that you were nervous. They only see the number, and they judge it against every other number they saw that day.","cap":"I priced it to be safe. Safe got me three more months of fear.\n\nNobody sees that you were nervous. They only see the number, and they compare it to every other number that day.","tags":["#Easywurld","#Pricing","#SmallBusinessNigeria","#LagosBusiness"],"asset":"Talking head, plain shirt, warm light, no graphics, mark lower right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["I wrote a quote at midnight\nonce. It is still out there.","It was fine, actually.\nThat was the problem.","I priced it to be safe.","Safe got me three more months\nof not saying the number\nI actually thought.","Nobody sees that you were\nnervous. They only see\nthe number."],"cap":"Thirty templates, including the ones for the nights when you do not want to talk to anyone. The Clear Message Workbook, ₦5,000, message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#Pricing","#Easywurld","#LagosSME","#HonestBusiness"],"asset":"Cream slides, deep green serif, terracotta rule on slide 3."},"facebook":{"fmt":"Feed post","body":"I wrote a quote at midnight once. It is still out there, and it was fine, which was the problem.\n\nI priced it to be safe. Safe got me three more months of not saying the number I actually thought.\n\nAnd nobody sees that you were nervous. The customer only sees the number, and they compare it against every other number they saw that day. The nervous part is invisible. It only shows up as a price that is slightly too low to feel good about.\n\nSay the number. Say what is inside. Ask the question. The whole exchange takes five seconds and the decision takes a week.\n\nIf you want the sentences ready for the difficult moments, the Clear Message Workbook is ₦5,000 and it has 30 of them. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D10-07","type":"Teach","topic":"What a customer is actually comparing your price to","why":"Teach. It reframes price objections as a comparison problem, which is a genuinely new angle.","tiktok":{"fmt":"Kinetic type with voiceover, 30s","hook":"Your customer is not comparing your price to your cost. They are comparing it to their last bad experience.","beats":["They remember the last one","Not the last good one","That is why clarity beats cheap","Tell them what they avoid"],"vo":"Your customer is not comparing your price to your cost. They are comparing it to their last bad experience, and unfortunately the last bad experience is more memorable than the last good one. That is why clarity beats cheap. A slightly higher price with a clear explanation of what they are avoiding is usually easier to accept than a lower price with silence. Tell them what goes wrong, not what goes right.","cap":"Your customer is not comparing your price to your cost.\n\nThey are comparing it to their last bad experience, and the bad one sticks.\n\nThat is why clarity beats cheap. Tell them what they avoid.","tags":["#Pricing","#Easywurld","#SmallBusinessNigeria","#CustomerServiceTips"],"asset":"Cream background, four lines, terracotta underline on the last, mark bottom right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["Your customer is not\ncomparing your price to\nyour cost.","They are comparing it to\ntheir last bad experience.","The bad one sticks.","That is why clarity beats cheap.","Tell them what they avoid,\nnot what goes right."],"cap":"A slightly higher price with a clear explanation of what they are avoiding is usually easier to accept than a lower price with silence.\n\nThe Clear Message Workbook has the templates for exactly this conversation. ₦5,000, message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#PricingTips","#Easywurld","#LagosSME","#Copywriting"],"asset":"Cream slides, deep green serif, terracotta rule."},"facebook":{"fmt":"Feed post","body":"Your customer is not comparing your price to your cost. They are comparing it to their last bad experience.\n\nAnd the bad one sticks. The person who kept them waiting three days, the one who disappeared after taking the money, the one who got the thing wrong and never called back. That is the reference price in their head, and it is not a number, it is a feeling.\n\nThat is why clarity beats cheap. A slightly higher price with a clear explanation of what they are avoiding is easier to accept than a lower price with silence. And it is easier to sell the avoidance than the promise.\n\nTell them what goes wrong. Not just what goes right.\n\nThe Clear Message Workbook, ₦5,000, has 30 templates for the difficult conversations, including the price one. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 17:15","body":"A pricing idea worth trying: sell the avoidance, not the promise.\n\nA buyer is not comparing your price to your costs. They are comparing it to their last bad experience, and bad experiences are more memorable than good ones. That memory is the reference point, and it is not a number, it is a feeling.\n\nSo a slightly higher price with a clear statement of what they are avoiding is often easier to accept than a lower price with silence. The buyer is not paying for the feature list, they are paying for the feeling of not repeating a bad month.\n\nPractical version for a small business: in your quote reply, after the price, name the thing that usually goes wrong in this kind of job and that you handle. One line. Not a guarantee, not a claim you cannot evidence, just the thing you know from experience.\n\nWe put 30 templates for moments like this in the Clear Message Workbook, ₦5,000.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liTime":"17:15","ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D10-08","type":"Meme","topic":"Group chat math versus actual business math","why":"Meme. A shared joke about a universal small business frustration.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"Me: the business needs a website","beats":["Group chat: \"make it pop\"","Also group chat: \"add a pop-up\"","Also group chat: \"but cheaper\"","Me, quietly: a website"],"vo":"Me: the business needs a website. Group chat: make it pop. Also group chat: can we add a pop-up. Also group chat: but it should be cheaper. Me, quietly: a website. This is the entire brief I have received in five years of doing this work, compressed into one group chat.","cap":"The entire brief, in one group chat:\n\n\"Make it pop\"\n\"Add a pop-up\"\n\"But cheaper\"\n\nMe, quietly: a website.","tags":["#Meme","#Easywurld","#WebDesign","#SmallBusinessNigeria"],"asset":"Four-panel meme, cream background, deep green type, terracotta chat bubbles."},"instagram":{"fmt":"Sta op your price, ask this one question.","beats":["\"What were you hoping to pay?\"","If they say a number,\nprice is not the problem","If they say nothing,\nthey have no comparison","Now you know what to fix"],"vo":"Before you drop your price, ask this one question: what were you hoping to pay? If they give you a number, the price is not the problem, and you can either meet it or walk. If they say nothing, they have no comparison, and the problem is that they do not yet understand what they are getting. Those are two completely different problems and they need two completely different answers. One question tells you which one you have.","cap":"Before you drop your price, ask: what were you hoping to pay?\n\nA number means price is not the problem.\nSilence means they have no comparison yet.\n\nOne question. Two different fixes.","tags":["#Pricing","#Easywurld","#SmallBusinessNigeria","#SalesTips"],"asset":"Cream background, the question in deep green serif, terracotta tick, mark bottom right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["Before you drop your price,\nask one question.","\"What were you hoping to pay?\"","A number means price\nis not the problem.","Silence means they have\nno comparison yet.","Two different problems.\nTwo different fixes."],"cap":"Thirty templates for the pricing conversation, including this one. The Clear Message Workbook, ₦5,000, message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#PricingTips","#Easywurld","#LagosSME","#SalesTips"],"asset":"Cream slides, deep green serif, terracotta rule on the last slide."},"facebook":{"fmt":"Feed post","body":"Before you drop your price, ask this one question:\n\n\"What were you hoping to pay?\"\n\nIf they give you a number, the price is not the problem. You can meet it, or you can walk, but at least you know what you are dealing with.\n\nIf they say nothing, they have no comparison. The problem is not the money, it is that they do not yet understand what they are getting. Those are tw hem beat thirty messages that say just checking in.\n\nThe Chat-to-Customer Playbook has the 1-3-7 rhythm, a tracker that flags who to follow up with today, and 36 scripts. ₦5,000, message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#FollowUp","#Easywurld","#LagosSME","#WhatsAppBusiness"],"asset":"Cream slides, deep green serif, terracotta day markers."},"facebook":{"fmt":"Feed post","body":"If an enquiry goes quiet, you get three chances. Not thirty.\n\nOne day after. Three days after. Seven days after. Then you let it go.\n\nAnd letting go is the actual skill, because the business that chases for a month is the business that gets blocked. Every extra message after the seventh day makes it less likely the next one gets read.\n\nThree good follow-ups, each with something useful in them, beat thirty messages that say just checking in. Checking in is not useful. A price drop, a stock update, a photo of the finished work, a shorter option, that is useful.\n\nThe Chat-to-Customer Playbook, ₦5,000, has the rhythm, a tracker that flags who to contact today, and 36 scripts written for the actual situations. Message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 08:15","body":"The most underrated sales skill is knowing when to stop.\n\nMost small businesses do the opposite. An enquiry goes quiet, and then they send a message every three days for a month, each one a little more desperate, until the customer blocks the number. Every message after the third one reduces the chance the next one is read.\n\nThree chances is enough:\n\nOne day after. Three days after. Seven days after. Then let it go.\n\nWhat makes those three work is that each one carries something useful. Not just checking in. The price came down. The stock is back. Here is the photo of the finished work. Here is a smaller option.\n\n\"Just checking in\" is not useful, and it is the most common follow-up message in Nigeria. It asks the customer to do work on the relationship for free.\n\nWe put the rhythm, the tracker and 36 scripts into the Chat-to-Customer Playbook, ₦5,000. It does not create enquiries. It handles the ones you already have.\n\nWhatsApp: 0905 069 0837. Message PLAYBOOK."},"liTime":"08:15","ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D11-02","type":"Meme","topic":"Just checking in","why":"Meme. It is the most-sent, least-useful message in small business, and calling it out earns agreement.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"\"Hi, I am just checking in on my previous message\"","beats":["Sent on day 4","Day 9","Day 16","Day 23","Read: day 24"],"vo":"Hi, I am just checking in on my previous message. Day four. Day nine. Day sixteen. Day twenty-three. Read on day twenty-four. Checking in is not a message. It is a reminder that you exist, sent to somebody who is busy. Every follow-up should carry something. The price came down, the stock is back, here is the photo.","cap":"\"Just checking in on my previous message\"\n\nSent on day 4. Day 9. Day 16. Day 23.\n\nChecking in is not a message. It is a reminder that you exist, sent to somebody who is busy.","tags":["#Meme","#Easywurld","#FollowUp","#SmallBusinessNigeria"],"asset":"Five-panel meme, cream background, deep green type, terracotta on the read receipt."},"instagram":{"fmt":"Static meme post, 4:5","slides":["\"Hi, I am just checking in\non my previous message\"","Sent on day 4. Day 9.\nDay 16. Day 23.","Read: day 24","Checking in is not a message.","It is a reminder that you exist,\nsent to somebody who is busy."],"cap":"Every follow-up should carry something. The price came down. The stock is back. Here is the photo of the finished work.\n\n36 scripts for the moments that matter, in the Chat-to-Customer Playbook. ₦5,000, message PLAYBOOK on WhatsApp: 0905 069 0837.","tags":["#Meme","#Easywurld","#LagosSME","#FollowUp"],"asset":"Two-panel meme, cream and deep green."},"facebook":{"fmt":"Feed post","body":"\"Hi, I am just checking in o ll reply, and not just \"I will get back to you\".\n3. One saved reply for your most common question, so the reply takes two seconds instead of two minutes.\n\nAll three are in the setup guide inside the Chat-to-Customer Playbook, ₦5,000, along with the tracker and 36 scripts.\n\nMessage PLAYBOOK on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 17:15","body":"Two hours of unanswered messages is a closed shop with a sign on the door.\n\nYour shop is open at nine in the morning. Your phone is not. A customer messages at nine past nine. You reply at three, because that is when the shop gets quiet. By three, they have already bought from the person whose phone was on.\n\nThis is the gap that a lot of small business chat revenue disappears into, and it is not a discipline problem. It is a setup problem, and the setup is twenty minutes of work, once.\n\nA greeting for outside hours. An away message that names a time, not a sentiment. One saved reply for the most common question, so answering takes two seconds instead of two minutes.\n\nThe saved reply is the one people skip, and it is the one that matters most, because the most common question is the same every time and it should never be typed from scratch.\n\nWe put the setup, the away message templates and 36 scripts into the Chat-to-Customer Playbook, ₦5,000, with a tracker so nothing is forgotten.\n\nWhatsApp: 0905 069 0837. Message PLAYBOOK."},"liTime":"17:15","ttTime":"18:00","igTime":"18:30","fbTime":"18:00"},{"id":"D11-08","type":"Meme","topic":"The customer who says call me","why":"Meme. A universal small business moment, and a bridge into the reply scripts.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"Customer: call me","beats":["Me: I am at the shop","Customer: okay, call me","Me: when are you free?","Customer: also call me"],"vo":"Customer: call me. Me: I am at the shop. Customer: okay, call me. Me: when are you free? Customer: also call me. This is the most common sentence y what is not included.","Say what you need from them."],"cap":"A clear proposal is not less impressive than a long one. It is faster to agree.\n\nThe proposal template in the Template Pack is built on exactly these rules, ₦5,000. Message TEMPLATES on WhatsApp: 0905 069 0837.","tags":["#Easywurld","#HonestBusiness","#LagosSME","#BusinessTips"],"asset":"Cream slides, deep green serif, terracotta rule on the last slide."},"facebook":{"fmt":"Feed post","body":"A proposal nobody reads is not a proposal. It is a letter to yourself.\n\nIf it is twelve pages, it should be four. Put the price on page one. Say what is not included. Say what you need from them.\n\nThat is the whole trick. A clear proposal is not less impressive than a long one. It is more professional, and it is much faster to agree, because there is nothing for the other side to get confused about.\n\nThe proposal template in the Proposal & Report Template Pack is built on those rules. ₦5,000, with six more documents in the same folder.\n\nMessage TEMPLATES on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"15:00","igTime":"15:45","fbTime":"15:00"},{"id":"D12-06","type":"Teach","topic":"The four-part proposal that gets a yes","why":"Teach. A structure they can apply to their next quote makes the pack obviously worth ₦5,000.","tiktok":{"fmt":"Kinetic type with voiceover, 30s","hook":"Four parts. One page. That is a proposal that gets read.","beats":["1 · Their problem, in their words","2 · What you will do about it","3 · What it costs and what is not included","4 · What you need from them"],"vo":"Four parts, one page, and a proposal that gets read. One: their problem, in their words, not yours. Two: what you will do about it, in three sentences. Three: what it costs, and what is not included, because the thing they will argue about is the thing you did not mention. Four: what you need from them. That last part is the one everybody skips, and it is the one that gets a yes.","cap":"Four parts, one page:\n\n1 · Their problem, in their words\n2 · What you will do about it\n3 · What it costs, and what is not included\n4 · What you need from them\n\nPart four is the one everybody skips.","tags":["#BusinessTips","#Easywurld","#SmallBusinessNigeria","#WritingTips"],"asset":"Cream background, four numbered lines, terracotta tick on the last, mark bottom right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["Four parts.\nOne page.","1 · Their problem,\nin their words","2 · What you will do\nabout it","3 · What it costs and\nwhat is not included","4 · What you need from them","Part four is the one\neverybody skips,\nand it is the one\nthat gets a yes."],"cap":"The proposal template in the Proposal & Report Template Pack is exactly this structure, with the prompts filled in.\n\n₦5,000, message TEMPLATES on WhatsApp: 0905 069 0837.","tags":["#BusinessTips","#Easywurld","#LagosSME","#WritingTips"],"asset":"Cream slides, deep green serif, terracotta numbers."},"facebook":{"fmt":"Feed post","body":"Four parts. One page. That is a proposal that gets read.\n\n1. Their problem, in their words, not yours.\n2. What you will do about it, in three sentences.\n3. What it costs, and what is not included.\n4. What you need from them.\n\nNumber three and number four are where proposals are won. Three, because the thing they will argue about is the thing you did not mention. Four, because a proposal that does not say what you need from them gets a slow, polite nothing.\n\nThe proposal template in the Proposal & Report Template Pack is exactly this structure, with the prompts filled in, plus six more documents in the same folder. ₦5,000.\n\nMessage TEMPLATES on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 12:15","body":"Most proposals fail on part four, and part four is the part everybody skips.\n\nA proposal that works:\n\nTheir problem, in their words, not yours. What you will do about it, in three sentences. What it costs, and what is not included. And what you need from them.\n\nThe first three parts are familiar. The fourth is the one that changes the outcome.\n\nWithout it, a proposal is a document that asks for a decision but never says what the customer has to do to make that decision. So the customer does nothing, and six weeks later you find out they were not undecided, they were waiting for you to tell them how to start.\n\nWith it, the customer knows exactly what happens next. And a proposal that makes the next step obvious gets a faster answer, including a faster no, which saves both sides a month.\n\nThe Proposal & Report Template Pack, ₦5,000, has this structure as a template, with the prompts filled in, plus a report template, a brief, a project plan, a status report, a partnership agreement and a feedback form.\n\nWhatsApp: 0905 069 0837. Message TEMPLATES."},"liTime":"12:15","ttTime":"16:30","igTime":"17:15","fbTime":"16:30"},{"id":"D12-07","type":"Meme","topic":"The free design advice from a relative","why":"Meme. A universal family moment that every small business owner recognises instantly.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"My brother, who has never run a business, has feedback","beats":["\"It is nice but\"","\"Maybe more like...\"","He cannot say what","He has been in a business\nfor two weeks"],"vo":"My brother, who has never run a business, has feedback. It is nice but. Maybe more like something. He cannot say what. He has been in a business for two weeks. Listen to feedback that comes with a reason, and ignore feedback that comes with a feeling. The second kind is not wrong, it is just not information.","cap":"\"It is nice but.\"\n\"Maybe more like...\"\n\nFeedback with a feeling is not information.\nFeedback with a reason is a specification.","tags":["#Meme","#Easywurld","#SmallBusinessNigeria","#WebDesign"],"asset":"Four-panel meme, cream background, deep green type, terracotta speech bubble."},"instagram":{"fmt":"Static meme post, 4:5","slides":["My brother, who
