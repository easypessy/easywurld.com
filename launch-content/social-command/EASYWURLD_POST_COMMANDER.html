ee. Your document has to do some work to beat free.\n\nThat is why the proposal template in the Template Pack is four pages, and it is why the price goes on page one anyway. The extra pages are not filler, they are the argument.\n\n₦5,000, message TEMPLATES on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 17:15","body":"A proposal is not a price list, and the difference is the whole job.\n\nA price list says: this costs X.\n\nA proposal says: here is what I understand about your problem, here is what I will do about it, here is what I need from you, and this is what it costs.\n\nSame price, completely different outcome. And notice the order: the price comes last, even though it is the only part most people read first.\n\nThe reason is not style. It is that the customer is not comparing your price to your cost. They are comparing your document to the alternative, which is doing nothing, which costs nothing. Your document has to do some work to beat free.\n\nThe price on page one is right, because hiding it is a trick and people notice. But the three pages before it are what make the price acceptable.\n\nThe Proposal & Report Template Pack, ₦5,000, has this structure as a template, plus six other documents.\n\nWhatsApp: 0905 069 0837. Message TEMPLATES."},"liTime":"17:15","ttTime":"20:45","igTime":"20:45","fbTime":"21:00"},{"id":"D12-11","type":"Direct response","topic":"The end-of-week question that sets up next week","why":"Direct response. It invites a reply, which pushes engagement, and it carries the review habit.","tiktok":{"fmt":"Kinetic type with voiceover, 20s","hook":"One question to ask yourself on Friday night.","beats":["Not: what did I sell today","But: what did I learn today","About my customers","One answer is enough","Write it down"],"vo":"One question to ask yourself on Friday night. Not what did I sell today, because somebody else decides that. What did I learn today about my customers. One answer is enough. Write it down, and p e is the one most studios break. And it is the reason people talk about studios badly, when they talk about studios badly.\n\nIt is also the reason people come back. A business that fails a project well is a business you will send your friend to.\n\nIf you want a second opinion on your own page before it goes anywhere, send us the link. Within 24 hours you get a voice note and three points, free, no sales call.","tags":[]},"linkedin":{"fmt":"Text post, 12:15","body":"What happens when a project does not work is more revealing than what happens when it does.\n\nOur rules, written down so nobody has to remember them in a bad moment:\n\nWe say so before the deadline, not after. We do not run to the end hoping it turns around. We hand back what is done, in a usable state. And we do not charge for the part that failed.\n\nThat last one is the rule most studios break, and it is the reason people talk about studios badly.\n\nIt is also, in the long run, the profitable behaviour. A studio that fails a project well gets referred. A studio that fails a project badly and bills for it gets avoided, and avoidance is contagious in small circles.\n\nNone of this is generosity. It is arithmetic about reputation, and it happens to be the same thing.\n\nIf you want a second opinion on your own page before it goes anywhere: send the link, get a 24-hour voice note with three points. Free, no sales call.\n\nWhatsApp: 0905 069 0837."},"liTime":"12:15","ttTime":"13:45","igTime":"14:15","fbTime":"13:30"},{"id":"D13-05","type":"Teach","topic":"How to post when you have nothing to announce","why":"Teach. It removes the single biggest reason small businesses stop posting: nothing to say.","tiktok":{"fmt":"Kinetic type with voiceover, 25s","hook":"You do not need news to post. You need answers.","beats":["1 · The question you get asked daily","2 · The mistake you see weekly","3 · The thing you do differently","That is a month of posts"],"vo":"You do not need news to post. You need answers. The is a customer telling you\nwhere it hurts, for free.","Do not explain first.","Acknowledge. Then ask one\nquestion. Then offer the next step.","In that order, every time,\nand the temperature comes down\nin about 30 seconds."],"cap":"Thirty templates for the difficult messages, including the angry ones, are in the Clear Message Workbook, ₦5,000. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#CustomerService","#Easywurld","#LagosSME","#Copywriting"],"asset":"Cream slides, deep green serif, terracotta numbers."},"facebook":{"fmt":"Feed post","body":"An angry message is not a lost customer. It is a customer telling you exactly where it hurts, and telling you for free.\n\nThe mistake is explaining before you acknowledge. You read their complaint, you get defensive, you start writing the story of why it was not your fault, and by the third sentence they have stopped being a customer and become an audience.\n\nThe order matters:\n\n1. Acknowledge what they are actually saying. Not the words, the thing underneath.\n2. Ask one question that finds out the real problem.\n3. Offer the next step.\n\nIn that order, every time, the temperature comes down in about thirty seconds. And you learn something, which is the other half of it.\n\nThirty templates for exactly these moments are in the Clear Message Workbook, ₦5,000. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 08:15","body":"An angry message is not a lost customer. It is the cheapest customer research you will ever get.\n\nSomebody is telling you, in writing, at no cost, exactly where your business fails them. Most of them will not tell you this politely, and most of them will not tell you at all.\n\nThe mistake is explaining first. You read the complaint, you get defensive, you start writing the account of why it was not your fault, and by the third sentence they have stopped being a customer and become an audience.\n\nThe order that works:\n\nAcknowledge what they are actually saying, which is not always what they said. Ask one question that finds the real problem. Then offer the next step.\n\nThat last part is the one people skip. A question without a next step turns a complaint into a longer conversation. A question with a next step turns it into a decision.\n\nThirty templates for these moments, in the Clear Message Workbook, ₦5,000.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liTime":"08:15","ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D16-02","type":"Story","topic":"The four reasons people actually complain","why":"Story. A framework that makes complaints legible, which is more useful than any single script.","tiktok":{"fmt":"Talking head with text cards, 30s","hook":"People complain about four things. Only one of them is the actual problem.","beats":["1 · It is late","2 · It is not what I expected","3 · It costs more than I thought","4 · Nobody answered me","Number four is the real one"],"vo":"People complain about four things. It is late. It is not what I expected. It costs more than I thought. And nobody answered me. The first three are about the work. The fourth is about you, and it is the one that decides whether they ever come back. Which is why the reply matters more than the fix. You can fix a delay. You cannot fix a customer who decided you do not care.","cap":"People complain about four things:\n\n1 · It is late\n2 · It is not what I expected\n3 · It costs more than I thought\n4 · Nobody answered me\n\nThe first three are about the work. The fourth decides whether they come back.","tags":["#CustomerServiceTips","#Easywurld","#SmallBusinessNigeria","#BusinessTips"],"asset":"Talking head, plain shirt, warm light, four numbered cards on screen, mark lower right."},"instagram":{"fmt":"5-slide carousel, 4:5","slides":["People complain\nabout four things.","1 · It is late\n2 · It is not what I expected","3 · It costs more\nthan I thought","4 · Nobody answered me","The first three are about the work.\nThe fourth is about you.\n\nYou can fix a delay.\nYou cannot fix a customer\nwho decided you do not care."],"cap":"Which is why the reply matters more than the fix.\n\nThirty templates, including the ones for the moment you have to say no, are in the Clear Message Workbook. ₦5,000, message MESSAGE on WhatsApp: 0905 069 0837.","tags":["#CustomerService","#Easywurld","#LagosSME","#Copywriting"],"asset":"Cream slides, deep green serif, terracotta number 4 highlighted."},"facebook":{"fmt":"Feed post","body":"People complain about four things.\n\n1. It is late.\n2. It is not what I expected.\n3. It costs more than I thought.\n4. Nobody answered me.\n\nThe first three are about the work. The fourth is about you, and it is the one that decides whether they ever come back.\n\nWhich is why the reply matters more than the fix. You can fix a delay, you can explain a price, you can replace something. You cannot fix a customer who has decided that you do not care, because that decision is about the silence, not the service.\n\nAnd that is the fix most small businesses skip. Not the work. The reply.\n\nThirty templates for these moments are in the Clear Message Workbook, ₦5,000. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":null,"ttTime":"09:15","igTime":"10:00","fbTime":"10:30"},{"id":"D16-03","type":"Meme","topic":"I am the manager","why":"Meme. Everyone who runs a small business has said this, and it is funny rather than bitter.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"Customer: I want to speak to the manager","beats":["Me, in the back room,\nalone, holding the phone:","Yes. Hello. I am the manager","Also me, three months ago,\nclaiming to be the owner","We are thriving"],"vo":"Customer: I want to speak to the manager. Me, in the back room, alone, holding the phone: yes, hello, I am the manager. Also me, three months ago, claiming to be the owner. We are thriving. The role of manager in a small business is mostly the ability to sound like you ha . Say what happened, plainly, without excuses.\n2. Say what you are going to do about it.\n3. Say when they will hear from you.\n\nThen do exactly that, on the time you said.\n\nThat is the whole recovery. People do not need perfection. They need to see that the business is paying attention, and the third sentence is the one that does the work, because it turns a complaint into a scheduled action.\n\nThe templates for these replies are in the Clear Message Workbook, ₦5,000, along with thirty others. Message MESSAGE on WhatsApp: 0905 069 0837.","tags":[]},"linkedin":{"fmt":"Text post, 20:15 (optional)","body":"When you get something wrong, the next twenty minutes decide more than the next twenty days.\n\nThree sentences, in this order:\n\nSay what happened, plainly, without excuses. Say what you are going to do about it. Say when they will hear from you.\n\nThen do exactly that, on the time you said.\n\nThe third sentence is the one that does the work. Without it, an apology is just noise, and the customer is still waiting without knowing when the waiting ends. With it, a complaint becomes a scheduled action, which is a completely different object.\n\nPeople do not need perfection. They need to see that the business is paying attention.\n\nThe templates for these replies are in the Clear Message Workbook, ₦5,000, along with thirty others.\n\nWhatsApp: 0905 069 0837. Message MESSAGE."},"liBonus":"20:15","liOpt":true,"ttTime":"20:00","igTime":"20:15","fbTime":"20:15"},{"id":"D16-10","type":"Story","topic":"The rule we wrote on the wall","why":"Story. A concrete internal rule, which is a different kind of proof: a practice, not a claim.","tiktok":{"fmt":"Talking head, 25s","hook":"We have one rule written on the wall. Here it is.","beats":["The oldest message gets\nthe first reply","Not the angriest","The oldest","Because that one has\nalready waited longest"],"vo":"We have one rule written on the wall. The oldest message gets the first reply. Not the angriest, the olde trust without checking, because it did what it said. The one that solved their exact problem, in their exact words, so they can tell the story.\n\nIf your customer has to think about how to describe you, they will describe you vaguely. And vague recommendations do not bring anybody through the door, because \"there is this place, it is nice\" is not a reason to cross a street. \"The place that fixed my phone while I waited\" is a reason.\n\nThis is a slightly uncomfortable idea for a business owner, because it says the thing that makes you recommendable is clarity and consistency rather than excellence. But excellence without a describable outcome is invisible. People can only recommend what they can put into a sentence.\n\nSo the work is not to be better than the shop down the road. It is to be the shop down the road, with one thing that is easy to describe and always true.\n\nThe Clear Homepage Blueprint, ₦5,000, is how you get that sentence onto a page. WhatsApp: 0905 069 0837. Message CLEAR."},"liTime":"08:15","ttTime":"07:00","igTime":"07:30","fbTime":"08:00"},{"id":"D19-02","type":"Meme","topic":"Tell somebody about my business","why":"Meme. It is the universal recommendation struggle, and it is funny and true.","tiktok":{"fmt":"Static meme, 12s, with voiceover","hook":"Someone asked for a recommendation","beats":["Me, thinking: my business\nis the obvious answer","Me, out loud:","\"there is this place...\"","Them: what does it do","Me: ...it is nice"],"vo":"Someone asked for a recommendation. Me, thinking: my business is the obvious answer. Me, out loud: there is this place. Them: what does it do. Me: it is nice. If you cannot describe your business in a sentence, you are not competing for the recommendation. You are hoping somebody remembers you. That is a much weaker position.","cap":"Someone asked for a recommendation.\n\nMe, thinking: my business is the obvious answer.\nMe, out loud: \"there is this place...\"\nThem: what does it do.\nMe: ...it is nice.\n /* ---------------- state ---------------- */
var KEY_DONE = "eww_done_v2", KEY_NOTE = "eww_note_v2", KEY_DAY = "eww_day_v2",
    KEY_OPEN = "eww_open_v2", KEY_START = "eww_start_v2";
var done = {}, notes = {}, open = {}, dayIdx = 0, filter = "all", startDate = "";

var PLAT = {
  tiktok: { label: "TikTok", cls: "tt" },
  instagram: { label: "Instagram", cls: "ig" },
  facebook: { label: "Facebook", cls: "fb" },
  linkedin: { label: "LinkedIn", cls: "li" }
};
var WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
var WD_LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
var MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function load() {
  try { done = JSON.parse(localStorage.getItem(KEY_DONE) || "{}"); } catch (e) { done = {}; }
  try { notes = JSON.parse(localStorage.getItem(KEY_NOTE) || "{}"); } catch (e) { notes = {}; }
  try { open = JSON.parse(localStorage.getItem(KEY_OPEN) || "{}"); } catch (e) { open = {}; }
  try { var d = parseInt(localStorage.getItem(KEY_DAY), 10); if (!isNaN(d)) dayIdx = d; } catch (e) {}
  startDate = localStorage.getItem(KEY_START) || (DATA.meta && DATA.meta.startDate) || "2026-10-19";
  if (dayIdx < 0 || dayIdx >= DATA.days.length) dayIdx = 0;
}
function save() {
  localStorage.setItem(KEY_DONE, JSON.stringify(done));
  localStorage.setItem(KEY_NOTE, JSON.stringify(notes));
  localStorage.setItem(KEY_OPEN, JSON.stringify(open));
  localStorage.setItem(KEY_DAY, String(dayIdx));
  localStorage.setItem(KEY_START, startDate);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 1700);
}

/* ---------------- dates ---------------- */
function parseISO(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dateFor(i) { return addDays(parseISO(startDate), i); }
function dateLabel(d) { return WD_LONG[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MO[d.getMonth()] + " " + d.getFullYear(); }
function dateShort(d) { return d.getDate() + " " + MO[d.getMonth()]; }
function isoOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayIndex() {
  var t = new Date(); t.setHours(0, 0, 0, 0);
  for (var i = 0; i < DATA.days.length; i++) {
    if (dateFor(i).getTime() === t.getTime()) return i;
  }
  return -1;
}

/* ---------------- schedule ---------------- */
function slotsForDay(d) {
  var out = [], p, i, times = DATA.times;
  for (p in PLAT) {
    if (!PLAT.hasOwnProperty(p)) continue;
    var list = [];
    for (i = 0; i < d.posts.length; i++) if (d.posts[i][p]) list.push(d.posts[i]);
    list.forEach(function (post, idx) {
      var t = (times[p] && times[p][idx]) ? times[p][idx] : "";
      if (p === "linkedin" && post.liBonus) t = post.liBonus;
      out.push({ time: t, platform: p, post: post, key: post.id + ":" + p });
    });
  }
  out.sort(function (a, b) {
    return a.time < b.time ? -1 : a.time > b.time ? 1 : (a.platform < b.platform ? -1 : 1);
  });
  return out;
}
function minutes(t) { var a = t.split(":"); return (+a[0]) * 60 + (+a[1]); }
function nextUp(slots) {
  var now = new Date(), n = now.getHours() * 60 + now.getMinutes();
  for (var i = 0; i < slots.length; i++) if (!done[slots[i].key] && minutes(slots[i].time) >= n) return slots[i];
  for (var j = 0; j < slots.length; j++) if (!done[slots[j].key]) return slots[j];
  return null;
}

/* ---------------- copy ---------------- */
function copyText(text, label) {
  if (!text) { toast("Nothing to copy"); return; }
  var t = String(text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(
      function () { toast("Copied: " + label); },
      function () { fallbackCopy(t, label); }
    );
  } else fallbackCopy(t, label);
}
function fallbackCopy(t, label) {
  var ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  if (ok) { toast("Copied: " + label); }
  else {
    document.getElementById("dlgTitle").textContent = label;
    document.getElementById("dlgText").value = t;
    var d = document.getElementById("dlg");
    if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  }
}
function fullText(s) {
  var p = s.post, out = [];
  if (s.platform === "tiktok") {
    out.push(p.tiktok.hook, "---", p.tiktok.beats.join("\n"), "", "VOICEOVER:", p.tiktok.vo, "", "CAPTION:", p.tiktok.cap, p.tiktok.tags.join(" "));
  } else if (s.platform === "instagram") {
    out.push(p.instagram.slides.join("\n"), "", "CAPTION:", p.instagram.cap, p.instagram.tags.join(" "));
  } else if (s.platform === "facebook") {
    out.push(p.facebook.body);
  } else {
    out.push(p.linkedin.body);
  }
  return out.join("\n");
}
function copyPost(key) { var s = findSlot(key); if (s) copyText(fullText(s), PLAT[s.platform].label); }
function copyField(key, field) {
  var s = findSlot(key); if (!s) return;
  var p = s.post, v = "";
  if (field === "vo") v = p.tiktok.vo;
  else if (field === "cap") v = s.platform === "tiktok" ? p.tiktok.cap : p.instagram.cap;
  else if (field === "body") v = s.platform === "facebook" ? p.facebook.body : p.linkedin.body;
  else if (field === "slides") v = p.instagram.slides.join("\n\n");
  copyText(v, field);
}
function findSlot(key) {
  var slots = slotsForDay(DATA.days[dayIdx]);
  for (var i = 0; i < slots.length; i++) if (slots[i].key === key) return slots[i];
  return null;
}

/* ---------------- render: day ---------------- */
function renderToday() {
  var d = DATA.days[dayIdx], slots = slotsForDay(d), dt = dateFor(dayIdx);
  var doneCount = slots.filter(function (s) { return done[s.key]; }).length;
  document.getElementById("bar").style.width = (slots.length ? doneCount / slots.length * 100 : 0) + "%";
  document.getElementById("progTxt").textContent = doneCount + " of " + slots.length + " done";
  document.getElementById("dayTxt").textContent = dateLabel(dt);

  var h = "";
  h += '<div class="dayscroll">';
  var ti = todayIndex();
  DATA.days.forEach(function (dd, i) {
    var s = slotsForDay(dd), c = s.filter(function (x) { return done[x.key]; }).length;
    var cls = "daybtn" + (i === dayIdx ? " today" : "") + (c === s.length && s.length ? " done" : "");
    h += '<button class="' + cls + '" onclick="setDay(' + i + ')"><b>' + dateShort(dateFor(i)) + '</b>' +
      WD[(dateFor(i).getDay() + 6) % 7] + (i === ti ? ' <span class="dot"></span>' : "") +
      (c === s.length && s.length ? "<br>" + c + "/" + s.length : "") + "</button>";
  });
  h += "</div>";

  h += '<div class="chips">';
  ["all", "tiktok", "instagram", "facebook", "linkedin", "left"].forEach(function (f) {
    var nm = f === "all" ? "All " + slots.length : f === "left" ? "Not done" : PLAT[f].label;
    h += '<button class="chip' + (filter === f ? " on" : "") + '" onclick="setFilter(\'' + f + '\')">' + nm + "</button>";
  });
  h += "</div>";

  var nu = nextUp(slots);
  if (nu) {
    h += '<h2 class="sechead">Next up <small>' + nu.time + " · " + PLAT[nu.platform].label + "</small></h2>";
    h += cardHTML(nu);
  }
  h += '<h2 class="sechead">' + esc(d.theme) + " <small>" + esc(d.offer) + "</small></h2>";
  var shown = 0;
  slots.forEach(function (s) {
    if (filter !== "all" && filter !== "left" && s.platform !== filter) return;
    if (filter === "left" && done[s.key]) return;
    shown++; h += cardHTML(s);
  });
  if (!shown) h += '<p class="mini">Nothing here. Tap All to see everything for this day.</p>';
  document.getElementById("viewToday").innerHTML = h;
  bindNotes();
}

function cardHTML(s) {
  var p = s.post, isOpen = !!open[s.key], isDone = !!done[s.key];
  var h = '<div class="card' + (isOpen ? " open" : "") + (isDone ? " done" : "") + '" id="c_' + s.key.replace(/[^a-z0-9]/gi, "") + '">';
  h += '<div class="chead" onclick="toggleCard(\'' + s.key + '\')">';
  h += '<div style="min-width:0;flex:1">';
  h += '<div><span class="badge ' + PLAT[s.platform].cls + '">' + PLAT[s.platform].label + "</span> <span class=\"time\">" + s.time + (p.liOpt ? " · optional" : "") + "</span></div>";
  h += '<div class="ctitle">' + esc(p.topic) + "</div>";
  h += '<div class="ctype">' + esc(p.type) + " · post " + p.id.split("-")[1] + "</div>";
  h += "</div>";
  h += '<button class="tick' + (isDone ? " on" : "") + '" onclick="event.stopPropagation();toggleDone(\'' + s.key + '\')">' + (isDone ? "✓" : "") + "</button>";
  h += "</div>";
  if (isOpen) {
    h += '<div class="cbody">';
    h += '<div class="blk"><h4>Why this works</h4><p>' + esc(p.why) + "</p></div>";
    if (s.platform === "tiktok") {
      var t = p.tiktok;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(t.fmt) + "</p></div>";
      h += '<div class="blk"><h4>Hook (0-3s)</h4><p>' + esc(t.hook) + "</p></div>";
      h += '<div class="blk"><h4>On-screen beats</h4><ul class="beats">' + t.beats.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul></div>";
      h += '<div class="blk"><h4>Voiceover script</h4><p>' + esc(t.vo) + "</p></div>";
      h += '<div class="blk"><h4>Caption</h4><p>' + esc(t.cap) + "</p></div>";
      h += '<div class="blk"><h4>Hashtags</h4><p class="tags">' + esc(t.tags.join(" ")) + "</p></div>";
      h += '<div class="blk"><h4>Visual</h4><p>' + esc(t.asset) + "</p></div>";
    } else if (s.platform === "instagram") {
      var g = p.instagram;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(g.fmt) + "</p></div>";
      h += '<div class="blk"><h4>' + (/reel/i.test(g.fmt) ? "Script slides" : "Slide copy") + '</h4><ul class="beats">' + g.slides.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul></div>";
      h += '<div class="blk"><h4>Caption</h4><p>' + esc(g.cap) + "</p></div>";
      h += '<div class="blk"><h4>Hashtags</h4><p class="tags">' + esc(g.tags.join(" ")) + "</p></div>";
      h += '<div class="blk"><h4>Visual</h4><p>' + esc(g.asset) + "</p></div>";
    } else if (s.platform === "facebook") {
      var f = p.facebook;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(f.fmt) + "</p></div>";
      h += '<div class="blk"><h4>Post</h4><p>' + esc(f.body) + "</p></div>";
    } else {
      var l = p.linkedin;
      h += '<div class="blk"><h4>Format</h4><p>' + esc(l.fmt) + "</p></div>";
      h += '<div class="blk"><h4>Post</h4><p>' + esc(l.body) + "</p></div>";
    }
    h += '<div class="copyrow">';
    h += '<button class="btn" onclick="copyPost(\'' + s.key + '\')">Copy all for ' + PLAT[s.platform].label + "</button>";
    if (s.platform === "tiktok") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'vo\')">Copy voiceover</button>';
    if (s.platform === "tiktok" || s.platform === "instagram") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'cap\')">Copy caption</button>';
    if (s.platform === "facebook" || s.platform === "linkedin") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'body\')">Copy post</button>';
    if (s.platform === "instagram") h += '<button class="btn ghost" onclick="copyField(\'' + s.key + '\',\'slides\')">Copy slides</button>';
    h += "</div>";
    h += '<div class="blk"><h4>Your note</h4><textarea class="note" data-note="' + s.key + '" placeholder="e.g. record this at 3pm, use the shop photo">' + esc(notes[s.key] || "") + "</textarea></div>";
    h += "</div>";
  }
  h += "</div>";
  return h;
}
function bindNotes() {
  var tas = document.querySelectorAll("textarea[data-note]");
  for (var i = 0; i < tas.length; i++) {
    tas[i].addEventListener("change", function (e) {
      notes[e.target.getAttribute("data-note")] = e.target.value;
      save(); toast("Note saved");
    });
  }
}
function toggleCard(key) {
  open[key] = !open[key]; save(); renderToday();
  setTimeout(function () {
    var el = document.getElementById("c_" + key.replace(/[^a-z0-9]/gi, ""));
    if (el) el.scrollIntoView({ block: "start" });
  }, 20);
}
function toggleDone(key) { if (done[key]) delete done[key]; else done[key] = 1; save(); renderToday(); }
function setDay(i) { dayIdx = i; save(); renderToday(); window.scrollTo(0, 0); }
function setFilter(f) { filter = f; renderToday(); }

/* ---------------- render: month ---------------- */
function renderMonth() {
  var tot = 0, td = 0, h = "";
  h += '<h2 class="sechead">The month <small>' + DATA.days.length + " days · " + DATA.days.length * 37 + " posts</small></h2>";
  h += '<div class="monthgrid">';
  DATA.days.forEach(function (dd, i) {
    var s = slotsForDay(dd), c = s.filter(function (x) { return done[x.key]; }).length;
    tot += s.length; td += c;
    var dt = dateFor(i);
    var pct = s.length ? Math.round(c / s.length * 100) : 0;
    h += '<button class="mcell' + (i === dayIdx ? " on" : "") + '" onclick="setDay(' + i + ')">';
    h += '<span class="md">' + dateShort(dt) + "</span>";
    h += '<span class="mw">' + WD[(dt.getDay() + 6) % 7] + "</span>";
    h += '<span class="mbar"><i style="width:' + pct + '%"></i></span>';
    h += '<span class="mn">' + c + "/" + s.length + "</span>";
    h += "</button>";
  });
  h += "</div>";
  h += '<h2 class="sechead">Totals</h2><div class="grid2">';
  h += '<div class="tile"><b>' + td + "</b><span>posted</span></div>";
  h += '<div class="tile"><b>' + (tot - td) + "</b><span>left</span></div>";
  h += "</div>";

  h += '<h2 class="sechead">Plan start date <small>move the whole plan</small></h2>';
  h += '<div class="copyrow"><input type="date" class="datein" value="' + startDate + '" onchange="setStart(this.value)"></div>';
  h += '<p class="mini">Every day in the app and in the sheet shifts with this date. Set it to the Monday you want to start posting.</p>';

  h += '<h2 class="sechead">Backup <small>save or move your progress</small></h2>';
  h += '<div class="copyrow"><button class="btn" onclick="exportData()">Export progress (file)</button>';
  h += '<button class="btn ghost" onclick="document.getElementById(\'importFile\').click()">Import progress</button></div>';
  h += '<input type="file" id="importFile" class="hide" accept=".json" onchange="importData(this)">';
  h += '<p class="mini">Export writes a small JSON file. Save it to Google Drive so a new phone can pick up where this one stopped.</p>';
  h += '<h2 class="sechead">Reset</h2>';
  h += '<div class="copyrow"><button class="btn ghost" onclick="resetAll()">Clear all tick marks and notes</button></div>';
  document.getElementById("viewMonth").innerHTML = h;
}
function setStart(v) {
  if (!v) return;
  startDate = v; save(); renderMonth(); renderToday();
  toast("Plan now starts " + dateLabel(parseISO(v)));
}
function exportData() {
  var payload = { app: "easywurld-post-commander", v: 2, saved: new Date().toISOString(), done: done, notes: notes, day: dayIdx, start: startDate };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "easywurld-progress-" + isoOf(new Date()) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast("Exported. Save it to Drive.");
}
function importData(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var j = JSON.parse(rd.result);
      if (j.done) done = j.done;
      if (j.notes) notes = j.notes;
      if (j.start) startDate = j.start;
      save(); renderToday(); renderMonth(); toast("Progress imported");
    } catch (e) { toast("That file did not work"); }
  };
  rd.readAsText(f); inp.value = "";
}
function resetAll() {
  if (!confirm("Clear every tick mark and note on this phone?")) return;
  done = {}; notes = {}; save(); renderToday(); renderMonth(); toast("Cleared");
}

/* ---------------- nav ---------------- */
function setView(v) {
  ["Today", "Month", "Help"].forEach(function (x) {
    document.getElementById("view" + x).classList.toggle("hide", x.toLowerCase() !== v);
  });
  var bs = document.querySelectorAll("nav.tabs button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-v") === v);
  document.getElementById("hdRight").textContent =
    v === "today" ? "POST COMMANDER" : v === "month" ? "THE MONTH" : "HOW TO USE";
  if (v === "month") renderMonth();
  if (v === "help") renderHelp();
  window.scrollTo(0, 0);
}
document.addEventListener("DOMContentLoaded", function () {
  load();
  var ti = todayIndex();
  if (ti >= 0) dayIdx = ti;
  var bs = document.querySelectorAll("nav.tabs button");
  for (var i = 0; i < bs.length; i++) {
    (function (b) { b.addEventListener("click", function () { setView(b.getAttribute("data-v")); }); })(bs[i]);
  }
  renderToday(); renderMonth(); renderHelp();
  setView("today");
});
