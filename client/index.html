  <body>
    <a
      href="#content"
      style="
        position: absolute;
        left: -9999px;
        top: 0;
        background: #1e3d2f;
        color: #fff;
        padding: 12px 18px;
        z-index: 200;
      "
      onfocus="
        this.style.left = '8px';
        this.style.top = '8px';
      "
      onblur="this.style.left = '-9999px'"
      >Skip to content</a
    >
    <!-- Crawler-facing copy. Filled at build/dev time from
         client/src/data/content.ts by the easywurld-prerender Vite plugin, so
         there is exactly one source for these words. Removed on hydration. -->
    <div id="prerender"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/chat/easywurld-chat.js" defer></script>
  </body>
